<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polit-Reise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root {
  --bg: #f6f3ef; --surface: #ffffff; --ink: #1d232a; --muted: #5d6670; --line: #e2ddd6;
  --red: #c8102e; --redsoft: #fbe6e9; --gold: #b7791f; --goldsoft: #fdf3dc;
  --ok: #1f7a4d; --okbg: #e3f3ea; --bad: #b42318; --badbg: #fbe7e5; --pick: #2847c9; --picksoft: #e6ebfb;
  --font-d: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-b: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14181d; --surface: #1d232a; --ink: #eef1f4; --muted: #a2adb8; --line: #323b45;
    --red: #ff6b7d; --redsoft: #3a1d22; --gold: #f0c060; --goldsoft: #3a2f14;
    --ok: #5cc492; --okbg: #17332a; --bad: #ff8a80; --badbg: #3a1f1d; --pick: #8aa2ff; --picksoft: #22294a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14181d; --surface: #1d232a; --ink: #eef1f4; --muted: #a2adb8; --line: #323b45;
  --red: #ff6b7d; --redsoft: #3a1d22; --gold: #f0c060; --goldsoft: #3a2f14;
  --ok: #5cc492; --okbg: #17332a; --bad: #ff8a80; --badbg: #3a1f1d; --pick: #8aa2ff; --picksoft: #22294a; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 var(--font-b); }
#app { max-width: 880px; margin: 0 auto; padding: 18px 16px 32px; }
h1, h2, h3 { font-family: var(--font-d); line-height: 1.15; margin: 0; }
h1 { font-size: clamp(1.7rem, 5vw, 2.5rem); letter-spacing: -.01em; }
h2 { font-size: clamp(1.3rem, 3.6vw, 1.7rem); }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 999px; padding: 12px 22px; background: var(--red); color: #fff; font-weight: 700; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn:focus-visible, .opt:focus-visible, .chip:focus-visible, .stn:focus-visible { outline: 3px solid var(--pick); outline-offset: 2px; }
.eyebrow { display: inline-block; font-size: .78rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--red); margin-bottom: 6px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
.muted { color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.stack > * + * { margin-top: 14px; }
/* Kopfzeile */
.hud { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.hud .t { font-family: var(--font-d); font-weight: 800; font-size: 1.1rem; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: .9rem; font-weight: 700; white-space: nowrap; }
.pill.red { background: var(--redsoft); border-color: transparent; color: var(--red); }
/* Start */
.hero { position: relative; overflow: hidden; }
.hero .flag { position: absolute; right: -24px; top: -24px; width: 140px; height: 140px; background: var(--red); border-radius: 24px; transform: rotate(12deg); opacity: .12; }
.niv { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.nivbtn { text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.nivbtn[aria-pressed="true"] { border-color: var(--red); background: var(--redsoft); }
.nivbtn strong { display: block; font-family: var(--font-d); font-size: 1.1rem; }
/* Karte der Stationen */
.weg { list-style: none; margin: 0; padding: 0; position: relative; display: grid; gap: 12px; }
.weg::before { content: ""; position: absolute; left: 31px; top: 20px; bottom: 20px; border-left: 3px dashed var(--line); }
.stn { position: relative; display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; width: 100%; text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 10px 14px 10px 8px; }
.stn .nr { width: 48px; height: 48px; margin-left: 0; border-radius: 50%; display: grid; place-items: center; font-size: 1.4rem; background: var(--bg); border: 2px solid var(--line); position: relative; z-index: 1; }
.stn .tt { font-family: var(--font-d); font-weight: 700; font-size: 1.05rem; }
.stn .sub { font-size: .85rem; color: var(--muted); }
.stn .st { font-size: 1.1rem; letter-spacing: 2px; color: var(--gold); white-space: nowrap; }
.stn.offen { border-color: var(--red); box-shadow: 0 0 0 3px var(--redsoft); }
.stn.offen .nr { border-color: var(--red); background: var(--redsoft); }
.stn.fertig .nr { border-color: var(--gold); background: var(--goldsoft); }
.stn.zu { opacity: .55; cursor: default; }
.stn .lock { font-size: .85rem; color: var(--muted); }
/* Lernkarte */
.lern { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.lern li { padding: 10px 14px 10px 40px; position: relative; background: var(--bg); border-radius: 12px; }
.lern li::before { content: "✓"; position: absolute; left: 14px; top: 10px; color: var(--red); font-weight: 700; }
/* Fragen */
.dots { display: flex; gap: 6px; }
.dots span { width: 26px; height: 8px; border-radius: 99px; background: var(--line); }
.dots span.ok { background: var(--ok); } .dots span.bad { background: var(--bad); } .dots span.now { background: var(--red); }
.qtyp { font-size: .8rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.frage { font-family: var(--font-d); font-weight: 700; font-size: clamp(1.15rem, 3.2vw, 1.4rem); }
.opts { display: grid; gap: 10px; }
.opt { text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.opt:hover:not(:disabled) { border-color: var(--muted); }
.opt.right { border-color: var(--ok); background: var(--okbg); }
.opt.wrong { border-color: var(--bad); background: var(--badbg); }
.opt.weg5050 { visibility: hidden; }
.opt:disabled { cursor: default; }
.rfopts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.zu-item { padding: 10px 0; border-top: 1px solid var(--line); }
.zu-item:first-child { border-top: 0; }
.zu-item .w { font-weight: 700; margin-bottom: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--surface); border: 1.5px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: .92rem; }
.chip[aria-pressed="true"] { background: var(--picksoft); border-color: var(--pick); color: var(--ink); font-weight: 700; }
.chip.right { background: var(--okbg); border-color: var(--ok); }
.chip.wrong { background: var(--badbg); border-color: var(--bad); }
.reihe { display: grid; gap: 8px; }
.reihe .opt .pos { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--picksoft); color: var(--pick); font-weight: 700; margin-right: 8px; font-size: .9rem; }
.reihe .opt.gewaehlt { border-color: var(--pick); }
.fb { border-radius: 12px; padding: 12px 14px; font-weight: 700; }
.fb.ok { background: var(--okbg); color: var(--ok); }
.fb.bad { background: var(--badbg); color: var(--bad); }
.fb small { display: block; font-weight: 400; color: var(--ink); margin-top: 4px; font-size: .95rem; }
/* Ergebnis */
.big { font-family: var(--font-d); font-weight: 800; font-size: clamp(2.4rem, 9vw, 3.6rem); line-height: 1; }
.sterne { font-size: 2.2rem; letter-spacing: 6px; color: var(--gold); }
.resgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.resgrid div { background: var(--bg); border-radius: 10px; padding: 8px 10px; font-size: .9rem; }
.resgrid b { display: block; color: var(--gold); letter-spacing: 2px; }
@media (max-width: 520px) { .rfopts { grid-template-columns: 1fr; } .stn { grid-template-columns: 56px 1fr; } .stn .st, .stn .lock { grid-column: 2; } .weg::before { left: 27px; } }
@media (prefers-reduced-motion: no-preference) { .pop { animation: pop .35s ease-out; } @keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: none; opacity: 1; } } }
</style>
</head>

  if (!G) return "";
  return `<div class="hud"><span class="t">Polit-Reise</span><div class="pills">
    <span class="pill">${G.niv === "e" ? "Erweitert" : "Grundniveau"}</span>
    <span class="pill red">${G.pts} Punkte</span>
    <span class="pill">Serie ${G.serie}</span>
    <span class="pill" title="Joker 50:50">Joker 50:50: ${G.joker}×</span></div></div>`;
}

// ---------------------------------------------------------------- Start
let wahlNiv = "g";
function start() {
  G = null;
  zeige(`<div class="card hero stack pop">
    <div class="flag" aria-hidden="true"></div>
    <span class="eyebrow">RZG · Politische Bildung</span>
    <h1>Polit-Reise: So regiert sich die Schweiz</h1>
    <p class="muted">Reise in 10 Stationen durch die Schweizer Politik, von der Gemeinde bis nach Brüssel. An jeder Station wiederholst du zuerst das Wichtigste und beantwortest danach ${PRO_STATION} Fragen. Für jede Station gibt es bis zu drei Sterne.</p>
    <h3>Wähle dein Niveau</h3>
    <div class="niv" role="group" aria-label="Niveau">
      <button class="nivbtn" data-n="g" aria-pressed="${wahlNiv === "g"}"><strong>Grundniveau</strong><span class="muted">Fragen zum Grundanspruch im Heft</span></button>
      <button class="nivbtn" data-n="e" aria-pressed="${wahlNiv === "e"}"><strong>Erweitert</strong><span class="muted">Schwierigere Fragen zum erweiterten Teil</span></button>
    </div>
    <p class="muted" style="font-size:.95rem">Tipp: Du hast zwei Joker «50:50». Ein Joker streicht bei einer Auswahlfrage zwei falsche Antworten.</p>
    <div class="row"><button class="btn" id="los">Reise starten</button></div>
  </div>`);
  app.querySelectorAll(".nivbtn").forEach(b => b.onclick = () => { wahlNiv = b.dataset.n; start(); });
  document.getElementById("los").onclick = () => {
    G = { niv: wahlNiv, st: 0, res: Array(STATIONEN.length).fill(null), pts: 0, joker: 2, serie: 0, best: 0 };
    karte();
  };
}

// ---------------------------------------------------------------- Karte
function karte() {
  const items = STATIONEN.map((s, i) => {
    const fertig = G.res[i] != null, offen = i === G.st && !fertig;
    const cls = fertig ? "fertig" : offen ? "offen" : "zu";
    return `<li><button class="stn ${cls}" data-i="${i}" ${offen ? "" : "disabled"} aria-label="Station ${i + 1}: ${esc(s.t)}${fertig ? ", " + G.res[i].st + " Sterne" : offen ? ", jetzt spielen" : ", noch gesperrt"}">
      <span class="nr" aria-hidden="true">${s.ic}</span>
      <span><span class="sub">Station ${i + 1} · ${esc(s.ort)}</span><br><span class="tt">${esc(s.t)}</span></span>
      ${fertig ? `<span class="st" aria-hidden="true">${sternStr(G.res[i].st)}</span>` : offen ? `<span class="pill red">Los!</span>` : `<span class="lock">gesperrt</span>`}
    </button></li>`;
  }).join("");
  zeige(hud() + `<div class="stack pop">
    <div><span class="eyebrow">Deine Route</span><h2>${G.st < STATIONEN.length ? `Weiter zu Station ${G.st + 1}` : "Alle Stationen geschafft!"}</h2></div>
    <ol class="weg">${items}</ol>
    <div class="row"><button class="btn ghost" id="neu">Von vorne beginnen</button></div>
  </div>`);
  app.querySelectorAll(".stn.offen").forEach(b => b.onclick = () => lernkarte(+b.dataset.i));
  document.getElementById("neu").onclick = () => { if (G.st === 0 || confirmNeu()) start(); };
}
let neuKlick = 0;
function confirmNeu() { const n = Date.now(); if (n - neuKlick < 4000) return true; neuKlick = n; const b = document.getElementById("neu"); b.textContent = "Sicher? Nochmals tippen"; return false; }

// ---------------------------------------------------------------- Lernkarte
function lernkarte(i) {
  const s = STATIONEN[i];
  zeige(hud() + `<div class="card stack pop">
    <span class="eyebrow">Station ${i + 1} · Kurz wiederholen</span>
    <h2>${s.ic} ${esc(s.t)}</h2>
    <ul class="lern">${s.lern.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
    <div class="row"><button class="btn" id="go">Bereit: ${PRO_STATION} Fragen</button><button class="btn ghost" id="zur">Zur Karte</button></div>
  </div>`);
  document.getElementById("go").onclick = () => station(i);
  document.getElementById("zur").onclick = karte;
}

// ---------------------------------------------------------------- Fragen
function station(i) {
  const pool = STATIONEN[i][G.niv];
  // Pro Station: mindestens eine Zuordnungs- oder Reihenfolgeaufgabe, falls vorhanden
  const spezial = pool.filter(q => q.z || q.r), normal = pool.filter(q => !(q.z || q.r));
  const wahl = mische(spezial).slice(0, 1).concat(mische(normal).slice(0, PRO_STATION - Math.min(1, spezial.length)));
  Q = { i, qs: mische(wahl).slice(0, PRO_STATION), n: 0, ok: [], fertig: false };
  frage();
}
function dots() {
  return `<div class="dots" aria-hidden="true">${Q.qs.map((_, k) => `<span class="${k < Q.ok.length ? (Q.ok[k] ? "ok" : "bad") : k === Q.n ? "now" : ""}"></span>`).join("")}</div>`;
}
function frage() {
  const q = Q.qs[Q.n], s = STATIONEN[Q.i];
  let typ = "", body = "";
  Q.fertig = false;
  if (q.m) {
    typ = "Wähle die richtige Antwort";
    Q.opts = mische(q.o.map((t, k) => ({ t, ok: k === 0 })));
    body = `<p class="frage">${esc(q.m)}</p><div class="opts">${Q.opts.map((o, k) => `<button class="opt" data-k="${k}">${esc(o.t)}</button>`).join("")}</div>
      ${G.joker ? `<div class="row"><button class="btn ghost" id="joker">Joker 50:50 einsetzen (${G.joker} übrig)</button></div>` : ""}`;
  } else if ("rf" in q) {
    typ = "Richtig oder falsch?";
    body = `<p class="frage">${esc(q.rf)}</p><div class="rfopts"><button class="opt" data-v="1">Richtig</button><button class="opt" data-v="0">Falsch</button></div>`;
  } else if (q.z) {
    typ = "Ordne zu";
    Q.zw = q.i.map(() => null);
    Q.zi = mische(q.i.map((x, k) => k));
    body = `<p class="frage">${esc(q.z)}</p><div class="card" style="padding:8px 16px">${Q.zi.map(k => `<div class="zu-item" data-k="${k}"><p class="w">${esc(q.i[k][0])}</p>
      <div class="chips" role="group" aria-label="${esc(q.i[k][0])}">${q.k.map((c, j) => `<button class="chip" data-j="${j}" aria-pressed="false">${esc(c)}</button>`).join("")}</div></div>`).join("")}</div>
      <div class="row"><button class="btn" id="pruefen" disabled>Prüfen</button></div>`;
  } else if (q.r) {
    typ = "Reihenfolge";
    Q.rw = [];
    Q.rm = mische(q.s.map((x, k) => k));
    if (Q.rm.every((v, k) => v === k)) Q.rm.reverse();
    body = `<p class="frage">${esc(q.r)}</p><p class="muted" style="font-size:.95rem">Tippe die Schritte in der richtigen Reihenfolge an.</p>
      <div class="reihe">${Q.rm.map(k => `<button class="opt" data-k="${k}"><span class="pos"></span>${esc(q.s[k])}</button>`).join("")}</div>
      <div class="row"><button class="btn" id="pruefen" disabled>Prüfen</button><button class="btn ghost" id="reset">Neu ordnen</button></div>`;
  }
  zeige(hud() + `<div class="card stack pop">
    <div class="row" style="justify-content:space-between"><span class="eyebrow" style="margin:0">Station ${Q.i + 1} · ${esc(s.t)}</span>${dots()}</div>
    <p class="qtyp">Frage ${Q.n + 1} von ${Q.qs.length} · ${typ}</p>
    ${body}
    <div id="fb" aria-live="polite"></div>
  </div>`);
  binde(q);
}
function binde(q) {
  if (q.m) {
    app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      const o = Q.opts[+b.dataset.k];
      app.querySelectorAll(".opt").forEach((x, k) => { x.disabled = true; if (Q.opts[k].ok) x.classList.add("right"); });
      if (!o.ok) b.classList.add("wrong");
      const j = document.getElementById("joker"); if (j) j.remove();
      ergebnis(o.ok, Q.opts.find(x => x.ok).t, q.x);
    });
    const j = document.getElementById("joker");
    if (j) j.onclick = () => {
      G.joker--; let weg = 0;
      mische(Q.opts.map((o, k) => k)).forEach(k => { if (!Q.opts[k].ok && weg < 2) { app.querySelector(`.opt[data-k="${k}"]`).classList.add("weg5050"); weg++; } });
      j.remove(); hoehe();
    };
  } else if ("rf" in q) {
    app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      const v = b.dataset.v === "1", ok = v === q.a;
      app.querySelectorAll(".opt").forEach(x => { x.disabled = true; if ((x.dataset.v === "1") === q.a) x.classList.add("right"); });
      if (!ok) b.classList.add("wrong");
      ergebnis(ok, q.a ? "Die Aussage ist richtig." : "Die Aussage ist falsch.", q.x);
    });
  } else if (q.z) {
    const pr = document.getElementById("pruefen");
    app.querySelectorAll(".zu-item").forEach(it => it.querySelectorAll(".chip").forEach(c => c.onclick = () => {
      if (Q.fertig) return;
      it.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", "false"));
      c.setAttribute("aria-pressed", "true");
      Q.zw[+it.dataset.k] = +c.dataset.j;
      pr.disabled = Q.zw.some(x => x === null);
    }));
    pr.onclick = () => {
      let alle = true;
      app.querySelectorAll(".zu-item").forEach(it => {
        const k = +it.dataset.k, soll = q.i[k][1], ist = Q.zw[k];
        it.querySelectorAll(".chip").forEach(c => { const j = +c.dataset.j; c.disabled = true; if (j === soll) c.classList.add("right"); else if (j === ist) c.classList.add("wrong"); });
        if (ist !== soll) alle = false;
      });
      pr.remove();
      ergebnis(alle, alle ? "" : "Die richtigen Zuordnungen sind grün markiert.", q.x);
    };
  } else if (q.r) {
    const pr = document.getElementById("pruefen"), rs = document.getElementById("reset");
    const nummern = () => app.querySelectorAll(".reihe .opt").forEach(b => { const p = Q.rw.indexOf(+b.dataset.k); b.querySelector(".pos").textContent = p >= 0 ? p + 1 : ""; b.classList.toggle("gewaehlt", p >= 0); });
    app.querySelectorAll(".reihe .opt").forEach(b => b.onclick = () => {
      if (Q.fertig) return;
      const k = +b.dataset.k, p = Q.rw.indexOf(k);
      if (p >= 0) Q.rw.splice(p, 1); else Q.rw.push(k);
      nummern(); pr.disabled = Q.rw.length !== q.s.length;
    });
    rs.onclick = () => { if (Q.fertig) return; Q.rw = []; nummern(); pr.disabled = true; };
    pr.onclick = () => {
      const ok = Q.rw.every((k, p) => k === p);
      app.querySelectorAll(".reihe .opt").forEach(b => { b.disabled = true; const k = +b.dataset.k; b.classList.add(Q.rw.indexOf(k) === k ? "right" : "wrong"); });
      pr.remove(); rs.remove();
      ergebnis(ok, ok ? "" : "Richtig wäre: " + q.s.map((t, p) => `${p + 1}. ${t}`).join(" → "), q.x);
    };
  }
}
function ergebnis(ok, richtig, x) {
  Q.fertig = true;
  Q.ok.push(ok);
  if (ok) { G.pts++; G.serie++; G.best = Math.max(G.best, G.serie); } else G.serie = 0;
  const lob = ["Richtig!", "Stark!", "Genau!", "Super!", "Bravo!"];
  const letzte = Q.n + 1 >= Q.qs.length;
  document.getElementById("fb").innerHTML = `<div class="fb ${ok ? "ok" : "bad"} pop">${ok ? lob[Math.floor(Math.random() * lob.length)] + (G.serie >= 3 ? ` ${G.serie} richtige Antworten in Folge!` : "") : "Leider falsch."}
      ${!ok && richtig ? `<small>${esc(richtig.startsWith("Die ") || richtig.startsWith("Richtig") ? richtig : "Richtig ist: " + richtig)}</small>` : ""}${x ? `<small>${esc(x)}</small>` : ""}</div>
    <div class="row" style="margin-top:12px"><button class="btn" id="weiter">${letzte ? "Station abschliessen" : "Nächste Frage"}</button></div>`;
  app.querySelector(".hud .pill.red").textContent = G.pts + " Punkte";
  const w = document.getElementById("weiter"); w.focus({ preventScroll: true });
  w.onclick = () => { if (letzte) stationEnde(); else { Q.n++; frage(); } };
  hoehe();
}

// ---------------------------------------------------------------- Stationsende
function stationEnde() {
  const k = Q.ok.filter(Boolean).length, st = sterneFuer(k);
  G.res[Q.i] = { k, st };
  G.st = Q.i + 1;
  const ende = G.st >= STATIONEN.length;
  const text = st === 3 ? "Perfekt! Du kennst dich hier bestens aus." : st === 2 ? "Sehr gut! Fast alles gewusst." : st === 1 ? "Geschafft! Lies die Lernkarte nochmals in Ruhe durch." : "Diese Station war schwierig. Schau dir die Lernkarte und das Heft nochmals an.";
  zeige(hud() + `<div class="card stack pop" style="text-align:center">
    <span class="eyebrow">Station ${Q.i + 1} geschafft</span>
    <h2>${esc(STATIONEN[Q.i].t)}</h2>
    <p class="sterne" aria-label="${st} von 3 Sternen">${sternStr(st)}</p>
    <p><strong>${k} von ${Q.qs.length}</strong> richtig. ${text}</p>
    <div class="row" style="justify-content:center"><button class="btn" id="weiter">${ende ? "Zum Schlussresultat" : "Weiter auf der Karte"}</button></div>
  </div>`);
  document.getElementById("weiter").onclick = () => ende ? schluss() : karte();
}

// ---------------------------------------------------------------- Schluss
function titelFuer(p) {
  return p >= .9 ? ["Bundesrätin / Bundesrat", "Du bist bereit für die Landesregierung!"]
    : p >= .75 ? ["Nationalrätin / Nationalrat", "Du kennst dich im Bundeshaus richtig gut aus."]
    : p >= .55 ? ["Kantonsrätin / Kantonsrat", "Ein solides Wissen – mit etwas Übung schaffst du es nach Bern."]
    : p >= .35 ? ["Gemeinderätin / Gemeinderat", "Ein guter Anfang. Wiederhole die Stationen mit wenigen Sternen."]
    : ["Stimmbürgerin / Stimmbürger in Ausbildung", "Lies die Lernkarten und das Heft nochmals und spiel dann noch einmal."];
}
function schluss() {
  const [titel, satz] = titelFuer(G.pts / MAX);
  const sterne = G.res.map(r => r ? r.st : 0);
  zeige(`<div class="card stack pop" style="text-align:center">
    <span class="eyebrow">Reise beendet · ${G.niv === "e" ? "Erweitert" : "Grundniveau"}</span>
    <p class="big">${G.pts} / ${MAX}</p>
    <p class="sterne" aria-label="${sterne.reduce((a, b) => a + b, 0)} von ${STATIONEN.length * 3} Sternen">${sterne.reduce((a, b) => a + b, 0)} ★</p>
    <h2>Dein Titel: ${esc(titel)}</h2>
    <p class="muted">${esc(satz)} Längste Serie: ${G.best} richtige Antworten in Folge.</p>
    <div class="resgrid" style="text-align:left">${STATIONEN.map((s, i) => `<div>${s.ic} ${esc(s.t)}<b>${sternStr(sterne[i])}</b></div>`).join("")}</div>
    <div class="row" style="justify-content:center"><button class="btn" id="nochmal">Nochmals spielen</button></div>
  </div>`);
  document.getElementById("nochmal").onclick = start;
  try { if (parent !== window) parent.postMessage({ seekarteErgebnis: { pts: G.pts, max: MAX, res: sterne, niv: G.niv } }, "*"); } catch (e) {}
}

start();
</script>
</body>
</html>
