  { id: "dl-fakenews", r: "lgesell", typ: "text", texttitel: "Text", titel: "Fake News erkennen", kanal: "Ratgeber", dauer: "ca. 170 Wörter",
    kurz: "Im Internet ist nicht alles wahr. Mit ein paar einfachen Fragen kann man falsche Meldungen erkennen.",
    vor: "Hast du schon einmal eine Nachricht gelesen, die sich später als falsch herausgestellt hat?",
    text: "«Schule fällt morgen wegen Hitze aus!» Diese Nachricht verbreitet sich schnell in einem Klassenchat. Alle freuen sich. Doch am nächsten Morgen findet die Schule ganz normal statt. Die Nachricht war falsch. Man spricht von «Fake News».\n\nFake News sind falsche Meldungen, die wie echte Nachrichten aussehen. Manche Leute verbreiten sie aus Spass. Andere wollen damit Geld verdienen oder die Meinung von Menschen beeinflussen. Weil Fake News oft überraschend oder lustig sind, teilen viele Leute sie sofort weiter.\n\nWie kann man Fake News erkennen? Stelle dir vier Fragen:\n\nErstens: Wer hat das geschrieben? Gibt es einen Namen oder eine bekannte Zeitung? Zweitens: Berichten auch andere, seriöse Medien darüber? Wenn nur eine einzige Seite davon schreibt, ist Vorsicht nötig. Drittens: Passt das Bild wirklich zur Meldung? Manchmal sind Fotos alt oder stammen von einem ganz anderen Ort. Viertens: Will die Nachricht, dass ich wütend oder ängstlich werde? Starke Gefühle sind oft ein Warnsignal.\n\nDie wichtigste Regel ist einfach: Erst prüfen, dann teilen. Wer eine Nachricht nicht prüfen kann, sollte sie lieber nicht weiterschicken.",
    wort: [["verbreiten","dafür sorgen, dass viele etwas erfahren"],["die Meldung","eine Nachricht, eine Information"],["beeinflussen","bewirken, dass jemand anders denkt oder handelt"],["seriös","ernsthaft und zuverlässig"],["das Warnsignal","ein Zeichen, dass man aufpassen muss"]],
    mc: [
      { q: "Was sind Fake News?", o: ["Falsche Meldungen, die wie echte Nachrichten aussehen","Nachrichten aus dem Ausland","Lustige Videos"], a: 0 },
      { q: "Warum teilen viele Leute Fake News sofort weiter?", o: ["Weil sie dafür bezahlt werden","Weil sie oft überraschend oder lustig sind","Weil sie es müssen"], a: 1 },
      { q: "Wann ist besonders Vorsicht nötig?", o: ["Wenn viele seriöse Medien darüber berichten","Wenn nur eine einzige Seite davon schreibt","Wenn die Meldung langweilig ist"], a: 1 },
      { q: "Was ist die wichtigste Regel?", o: ["Schnell teilen","Erst prüfen, dann teilen","Nie Nachrichten lesen"], a: 1 }
    ],
    rf: [
      { s: "Die Nachricht im Klassenchat war wahr.", a: false, x: "Die Schule fand ganz normal statt. Die Nachricht war falsch." },
      { s: "Manchmal sind Fotos alt oder stammen von einem anderen Ort.", a: true },
      { s: "Starke Gefühle wie Wut oder Angst können ein Warnsignal sein.", a: true }
    ],
    offen: [
      { q: "Nenne zwei der vier Fragen, mit denen man Fake News erkennen kann.", l: "Wer hat das geschrieben? Berichten auch andere seriöse Medien darüber? Passt das Bild zur Meldung? Will die Nachricht, dass ich wütend oder ängstlich werde?" },
      { q: "Warum verbreiten manche Leute Fake News? Nenne zwei Gründe aus dem Text.", l: "Aus Spass, um Geld zu verdienen, um die Meinung von Menschen zu beeinflussen." }
    ] },

  { id: "dl-cybermobbing", r: "lgesell", typ: "text", texttitel: "Text", titel: "Wenn der Chat verletzt", kanal: "Sachtext", dauer: "ca. 180 Wörter",
    kurz: "Cybermobbing kann jeden treffen. Was ist das genau, und was kann man dagegen tun?",
    vor: "Was denkst du: Was ist der Unterschied zwischen Spass und Mobbing?",
    text: "Mobbing bedeutet: Eine Person wird über längere Zeit immer wieder geplagt, ausgelacht oder ausgeschlossen. Passiert das im Internet oder auf dem Handy, spricht man von Cybermobbing. Zum Beispiel werden peinliche Fotos verschickt, gemeine Kommentare geschrieben oder jemand wird absichtlich aus einem Gruppenchat entfernt.\n\nCybermobbing ist besonders schlimm, weil es nie aufhört. Früher war man zu Hause in Sicherheit. Heute kommen die Nachrichten auch am Abend und am Wochenende. Ausserdem können sehr viele Menschen zuschauen. Und was einmal im Internet ist, lässt sich nur schwer wieder löschen.\n\nWas kann man tun, wenn man selbst betroffen ist? Erstens: nicht antworten und nicht zurückschlagen. Zweitens: Beweise sichern, also Screenshots machen. Drittens: die Person blockieren und melden. Und viertens, ganz wichtig: mit einer erwachsenen Person darüber reden, zum Beispiel mit den Eltern, einer Lehrperson oder der Schulsozialarbeit. In der Schweiz kann man auch gratis die Nummer 147 von Pro Juventute anrufen oder eine Nachricht schicken.\n\nUnd wer zuschaut? Auch Zuschauer haben Verantwortung. Wer mitlacht oder Bilder weiterleitet, macht mit. Besser ist es, der betroffenen Person zu zeigen: «Du bist nicht allein.»",
    wort: [["plagen","jemanden immer wieder ärgern"],["ausschliessen","jemanden nicht mitmachen lassen"],["betroffen sein","selbst von etwas Schlimmem getroffen werden"],["der Beweis","etwas, das zeigt, dass etwas passiert ist"],["die Verantwortung","die Pflicht, für etwas zu sorgen"]],
    mc: [
      { q: "Was ist Cybermobbing?", o: ["Mobbing im Internet oder auf dem Handy","Ein Computerspiel","Ein Fehler im Handy"], a: 0 },
      { q: "Warum ist Cybermobbing besonders schlimm?", o: ["Weil es nur in der Schule passiert","Weil es nie aufhört und viele zuschauen können","Weil es nichts kostet"], a: 1 },
      { q: "Was soll man als Betroffene oder Betroffener NICHT tun?", o: ["Screenshots machen","Mit einer erwachsenen Person reden","Zurückschlagen und gemein antworten"], a: 2 },
      { q: "Welche Nummer kann man in der Schweiz gratis anrufen?", o: ["117","147","1818"], a: 1 }
    ],
    rf: [
      { s: "Was einmal im Internet ist, kann man leicht löschen.", a: false, x: "Es lässt sich nur schwer wieder löschen." },
      { s: "Man soll Beweise sichern, zum Beispiel mit Screenshots.", a: true },
      { s: "Wer nur zuschaut und Bilder weiterleitet, macht auch mit.", a: true }
    ],
    offen: [
      { q: "Nenne drei Dinge, die man tun kann, wenn man von Cybermobbing betroffen ist.", l: "Nicht antworten, Screenshots machen, blockieren und melden, mit einer erwachsenen Person reden, die 147 anrufen." },
      { q: "Was kannst du tun, wenn du siehst, dass jemand anderes gemobbt wird? Schreibe zwei Ideen.", l: "Nicht mitlachen, nichts weiterleiten, der Person zeigen, dass sie nicht allein ist, einer erwachsenen Person Bescheid geben." }
    ] },

  { id: "dl-schulden", r: "lgesell", typ: "text", texttitel: "Text", titel: "Jetzt kaufen, später zahlen", kanal: "Sachtext", dauer: "ca. 180 Wörter",
    kurz: "Online-Shops locken mit «Bezahlen in 30 Tagen». Warum das gefährlich werden kann.",
    vor: "Kaufst du manchmal online ein? Wie bezahlst du?",
    text: "Neue Kopfhörer, eine Jacke, ein Game: Im Internet ist alles nur ein paar Klicks entfernt. Viele Online-Shops bieten an: «Jetzt kaufen, in 30 Tagen bezahlen.» Oder man kann den Preis in kleinen Raten bezahlen, zum Beispiel jeden Monat 20 Franken. Das klingt praktisch.\n\nDas Problem: Man verliert schnell den Überblick. Man bestellt hier etwas und dort etwas. Jede Rechnung ist klein, aber zusammen ergeben sie viel Geld. Wer eine Rechnung nicht pünktlich bezahlt, bekommt eine Mahnung. Dazu kommen oft Gebühren, zum Beispiel 20 oder 30 Franken pro Mahnung. Aus einer Rechnung von 50 Franken können so schnell 100 Franken werden.\n\nWer gar nicht bezahlt, bekommt Probleme mit der Betreibung. Dann wird ein Eintrag im Betreibungsregister gemacht. Das kann später unangenehm sein, zum Beispiel wenn man eine Wohnung sucht.\n\nViele Menschen in der Schweiz haben Schulden. Oft fängt es schon früh an, mit dem Handy-Abo oder mit Online-Einkäufen. Darum geben Fachleute drei Tipps: Kaufe nur, was du sofort bezahlen kannst. Schlafe eine Nacht darüber, bevor du etwas Teures kaufst. Und schreibe auf, welche Rechnungen noch offen sind.",
    wort: [["die Rate","ein Teil des Preises, den man regelmässig bezahlt"],["der Überblick","wenn man alles im Kopf hat und versteht"],["die Mahnung","Brief, der an eine unbezahlte Rechnung erinnert"],["die Gebühr","Geld, das man zusätzlich bezahlen muss"],["die Betreibung","rechtlicher Weg, mit dem jemand sein Geld einfordert"]],
    mc: [
      { q: "Was bieten viele Online-Shops an?", o: ["Alles gratis","Jetzt kaufen, später bezahlen","Nur Barzahlung"], a: 1 },
      { q: "Was passiert, wenn man eine Rechnung nicht pünktlich bezahlt?", o: ["Man bekommt eine Mahnung","Die Rechnung wird gelöscht","Man bekommt Geld zurück"], a: 0 },
      { q: "Wann kann ein Eintrag im Betreibungsregister unangenehm sein?", o: ["Beim Einkaufen im Supermarkt","Wenn man eine Wohnung sucht","Wenn man Sport macht"], a: 1 },
      { q: "Welcher Tipp steht im Text?", o: ["Kaufe nur, was du sofort bezahlen kannst","Bestelle möglichst viel auf einmal","Bezahle Rechnungen erst nach einem Jahr"], a: 0 }
    ],
    rf: [
      { s: "Kleine Rechnungen können zusammen viel Geld ergeben.", a: true },
      { s: "Mahnungen sind immer gratis.", a: false, x: "Oft kommen Gebühren dazu, zum Beispiel 20 oder 30 Franken." },
      { s: "Schulden fangen oft schon früh an.", a: true }
    ],
    offen: [
      { q: "Erkläre, wie aus einer Rechnung von 50 Franken schnell 100 Franken werden können.", l: "Wenn man nicht pünktlich bezahlt, kommen Mahnungen mit Gebühren dazu, z. B. 20–30 Franken pro Mahnung." },
      { q: "Welcher der drei Tipps findest du am hilfreichsten? Begründe.", l: "Individuelle Antwort, die einen der drei Tipps nennt und begründet." }
    ] },

  { id: "dl-sprachen", r: "lgesell", typ: "text", texttitel: "Text", titel: "Zwei Sprachen, ein Kopf", kanal: "Sachtext", dauer: "ca. 170 Wörter",
    kurz: "Viele Jugendliche in der Schweiz sprechen zu Hause eine andere Sprache als in der Schule. Ist das ein Problem oder ein Vorteil?",
    vor: "Welche Sprachen sprichst du? Mit wem sprichst du welche Sprache?",
    text: "Zu Hause spricht Elif Türkisch, in der Schule Deutsch und mit ihren Freundinnen Schweizerdeutsch. Am Abend schaut sie Videos auf Englisch. Elif ist nicht allein: In der Schweiz sprechen sehr viele Kinder und Jugendliche zu Hause eine andere Sprache als in der Schule.\n\nFrüher haben manche Leute gedacht, dass zwei Sprachen ein Kind verwirren. Heute weiss man: Das stimmt nicht. Mehrsprachige Menschen wechseln oft blitzschnell zwischen den Sprachen. Das trainiert das Gehirn. Forscher sagen, dass mehrsprachige Menschen oft gut darin sind, sich auf etwas zu konzentrieren und schnell umzudenken.\n\nWichtig ist, dass man die Erstsprache gut pflegt. Wer in seiner Erstsprache gut lesen und schreiben kann, lernt oft auch Deutsch leichter. In vielen Gemeinden gibt es deshalb Kurse in heimatlicher Sprache und Kultur, kurz HSK. Dort lernen Kinder zum Beispiel Albanisch, Portugiesisch oder Tamil lesen und schreiben.\n\nAuch für den Beruf sind Sprachen ein Vorteil. In einem Spital, in einem Geschäft oder bei der Polizei braucht man Menschen, die mehrere Sprachen sprechen. Darum: Schreibe deine Sprachen in deinen Lebenslauf. Sie sind eine echte Stärke.",
    wort: [["die Erstsprache","die Sprache, die man als Kind zuerst gelernt hat"],["verwirren","durcheinanderbringen"],["mehrsprachig","mehrere Sprachen sprechend"],["pflegen","sich um etwas kümmern, damit es gut bleibt"],["der Vorteil","etwas Positives, ein Plus"]],
    mc: [
      { q: "Welche Sprache spricht Elif zu Hause?", o: ["Deutsch","Türkisch","Englisch"], a: 1 },
      { q: "Was haben früher manche Leute gedacht?", o: ["Zwei Sprachen verwirren ein Kind","Zwei Sprachen machen reich","Kinder können nur eine Sprache lernen"], a: 0 },
      { q: "Was ist HSK?", o: ["Ein Sportverein","Kurse in heimatlicher Sprache und Kultur","Eine Fernsehsendung"], a: 1 },
      { q: "Was soll man laut Text in den Lebenslauf schreiben?", o: ["Seine Lieblingsessen","Seine Sprachen","Die Namen der Geschwister"], a: 1 }
    ],
    rf: [
      { s: "Heute weiss man, dass zwei Sprachen ein Kind verwirren.", a: false, x: "Heute weiss man: Das stimmt nicht." },
      { s: "Wer in der Erstsprache gut lesen kann, lernt oft auch Deutsch leichter.", a: true },
      { s: "Auch bei der Polizei braucht man Menschen, die mehrere Sprachen sprechen.", a: true }
    ],
    offen: [
      { q: "Schreibe auf, welche Sprachen du sprichst und in welcher Situation du sie brauchst.", l: "Individuelle Antwort, z. B.: «Zu Hause spreche ich Portugiesisch, in der Schule Deutsch.»" },
      { q: "Warum sind Sprachen ein Vorteil im Beruf? Nenne ein Beispiel aus dem Text.", l: "Im Spital, im Geschäft oder bei der Polizei kann man mit mehr Menschen sprechen und helfen." }
    ] },

  { id: "dl-abstimmen", r: "lgesell", typ: "text", texttitel: "Text", titel: "Das Volk hat das letzte Wort", kanal: "Sachtext", dauer: "ca. 180 Wörter",
    kurz: "In der Schweiz können die Stimmberechtigten mehrmals pro Jahr über Sachfragen abstimmen. Wie funktioniert das?",
    vor: "Worüber würdest du gerne einmal abstimmen?",
    text: "In den meisten Ländern wählt das Volk alle paar Jahre ein Parlament, und dieses entscheidet dann. In der Schweiz ist es etwas anders. Hier dürfen die Stimmberechtigten auch direkt über Sachfragen abstimmen, meistens viermal pro Jahr. Man nennt das direkte Demokratie.\n\nStimmberechtigt sind Schweizerinnen und Schweizer ab 18 Jahren. Sie bekommen die Unterlagen per Post nach Hause. Man kann an der Urne abstimmen oder brieflich. Die meisten stimmen brieflich ab.\n\nEs gibt zwei wichtige Werkzeuge. Mit einer Volksinitiative kann das Volk eine Änderung der Verfassung verlangen. Dafür braucht es 100 000 Unterschriften innerhalb von 18 Monaten. Mit einem Referendum kann das Volk über ein neues Gesetz abstimmen, das das Parlament beschlossen hat. Dafür braucht es 50 000 Unterschriften innerhalb von 100 Tagen.\n\nAbgestimmt wird über ganz verschiedene Themen: über Steuern, über den Schutz der Natur, über Autobahnen oder über die Altersvorsorge. Nicht immer gehen viele Menschen abstimmen. Oft nehmen weniger als die Hälfte der Stimmberechtigten teil.\n\nKritiker sagen, die Themen seien manchmal zu kompliziert. Befürworter sagen: Die direkte Demokratie gibt den Menschen eine starke Stimme.",
    wort: [["stimmberechtigt","darf abstimmen und wählen"],["die Urne","Kasten im Wahllokal, in den man den Stimmzettel wirft"],["die Verfassung","das wichtigste Gesetz eines Landes"],["die Unterschrift","der eigene Name, von Hand geschrieben"],["der Befürworter / die Befürworterin","Person, die für etwas ist"]],
    mc: [
      { q: "Wie oft wird in der Schweiz meistens abgestimmt?", o: ["Einmal in zehn Jahren","Etwa viermal pro Jahr","Jeden Tag"], a: 1 },
      { q: "Ab wie vielen Jahren darf man auf Bundesebene abstimmen?", o: ["Ab 16","Ab 18","Ab 21"], a: 1 },
      { q: "Wie viele Unterschriften braucht eine Volksinitiative?", o: ["50 000 in 100 Tagen","100 000 in 18 Monaten","1 Million in einem Jahr"], a: 1 },
      { q: "Was kann man mit einem Referendum erreichen?", o: ["Dass das Volk über ein neues Gesetz abstimmt","Dass der Bundesrat zurücktritt","Dass die Steuern sinken"], a: 0 }
    ],
    rf: [
      { s: "Die meisten Stimmberechtigten stimmen brieflich ab.", a: true },
      { s: "Bei Abstimmungen nehmen immer fast alle Stimmberechtigten teil.", a: false, x: "Oft nehmen weniger als die Hälfte teil." },
      { s: "Man nennt das Schweizer System direkte Demokratie.", a: true }
    ],
    offen: [
      { q: "Erkläre den Unterschied zwischen Volksinitiative und Referendum in eigenen Worten.", l: "Initiative: Das Volk verlangt selbst eine Änderung der Verfassung (100 000 Unterschriften). Referendum: Das Volk stimmt über ein Gesetz ab, das das Parlament schon beschlossen hat (50 000 Unterschriften)." },
      { q: "Was sagen Kritiker, was sagen Befürworter der direkten Demokratie? Und was denkst du?", l: "Kritiker: Themen sind manchmal zu kompliziert. Befürworter: Die Menschen haben eine starke Stimme. Dazu eine eigene, begründete Meinung." }
    ] },

  { id: "dl-gletscher", r: "lnatur", typ: "text", texttitel: "Text", titel: "Die Gletscher schmelzen", kanal: "Sachtext", dauer: "ca. 170 Wörter",
    kurz: "Die Gletscher in den Alpen werden jedes Jahr kleiner. Was bedeutet das für die Schweiz?",
    vor: "Hast du schon einmal einen Gletscher gesehen? Wo?",
    text: "Ein Gletscher ist ein grosser Fluss aus Eis. Er entsteht, wenn in den Bergen über viele Jahre mehr Schnee fällt, als im Sommer schmilzt. Der Schnee wird zusammengedrückt und wird langsam zu Eis. Der grösste Gletscher der Alpen ist der Aletschgletscher im Wallis. Er ist rund 20 Kilometer lang.\n\nDoch die Gletscher werden kleiner. Weil es auf der Erde wärmer wird, schmilzt im Sommer mehr Eis, als im Winter dazukommt. In heissen Sommern verlieren die Schweizer Gletscher besonders viel Eis. Fachleute rechnen damit, dass bis zum Ende dieses Jahrhunderts ein grosser Teil der Alpengletscher verschwunden sein wird.\n\nDas hat Folgen. Gletscher speichern Wasser. Im Sommer, wenn es wenig regnet, geben sie Schmelzwasser an Bäche und Flüsse ab. Ohne Gletscher kann es in trockenen Sommern zu wenig Wasser geben, zum Beispiel für die Landwirtschaft oder für Kraftwerke. Ausserdem kann der Boden in den Bergen unstabil werden. Dann gibt es mehr Felsstürze.\n\nMan kann den Rückgang der Gletscher nicht sofort stoppen. Aber wenn weniger Treibhausgase ausgestossen werden, wird die Erwärmung langsamer. Dann bleiben mehr Gletscher erhalten.",
    wort: [["schmelzen","von fest zu flüssig werden, z. B. Eis zu Wasser"],["speichern","aufbewahren, sammeln"],["die Folge","was danach passiert, das Resultat"],["der Felssturz","grosse Steine fallen vom Berg"],["das Treibhausgas","Gas, das die Erde wärmer macht, z. B. CO₂"]],
    mc: [
      { q: "Wie entsteht ein Gletscher?", o: ["Wenn über viele Jahre mehr Schnee fällt, als schmilzt","Wenn ein See im Winter gefriert","Wenn es viel regnet"], a: 0 },
      { q: "Welcher ist der grösste Gletscher der Alpen?", o: ["Der Rhonegletscher","Der Aletschgletscher","Der Morteratschgletscher"], a: 1 },
      { q: "Warum werden die Gletscher kleiner?", o: ["Weil es auf der Erde wärmer wird","Weil Touristen das Eis mitnehmen","Weil es mehr schneit"], a: 0 },
      { q: "Welche Folge hat der Gletscherschwund?", o: ["Mehr Wasser im Winter","In trockenen Sommern kann es zu wenig Wasser geben","Die Berge werden höher"], a: 1 }
    ],
    rf: [
      { s: "Der Aletschgletscher ist rund 20 Kilometer lang.", a: true },
      { s: "Gletscher geben im Sommer Schmelzwasser an Bäche und Flüsse ab.", a: true },
      { s: "Man kann den Rückgang der Gletscher sofort stoppen.", a: false, x: "Das geht nicht sofort. Aber mit weniger Treibhausgasen wird die Erwärmung langsamer." }
    ],
    offen: [
      { q: "Erkläre mit eigenen Worten, warum Gletscher für das Wasser in der Schweiz wichtig sind.", l: "Sie speichern Wasser und geben es im Sommer ab, wenn es wenig regnet. Bäche, Flüsse, Landwirtschaft und Kraftwerke brauchen dieses Wasser." },
      { q: "Was können Menschen tun, damit die Erwärmung langsamer wird? Nenne eine Idee.", l: "Weniger Treibhausgase ausstossen, z. B. öfter Velo oder ÖV statt Auto, weniger fliegen, Energie sparen." }
    ] },

  { id: "dl-tell", r: "lnatur", typ: "text", texttitel: "Text", titel: "Wilhelm Tell – Held oder Legende?", kanal: "Sachtext", dauer: "ca. 180 Wörter",
    kurz: "Der Apfelschuss ist die berühmteste Geschichte der Schweiz. Aber hat Wilhelm Tell wirklich gelebt?",
    vor: "Was weisst du schon über Wilhelm Tell?",
    text: "Fast jedes Kind in der Schweiz kennt die Geschichte von Wilhelm Tell. Sie spielt vor über 700 Jahren im Kanton Uri. Damals regierten fremde Vögte im Land. Einer von ihnen hiess Gessler. Er war streng und ungerecht.\n\nIn Altdorf liess Gessler einen Hut auf eine Stange setzen. Alle Leute mussten sich vor dem Hut verbeugen. Wilhelm Tell, ein Jäger mit einer Armbrust, ging einfach vorbei. Er verbeugte sich nicht. Zur Strafe musste Tell mit der Armbrust einen Apfel vom Kopf seines Sohnes schiessen. Tell traf den Apfel. Später tötete er Gessler. Danach, so erzählt die Geschichte, befreiten sich die Menschen von den Vögten.\n\nAber ist das wirklich passiert? Die meisten Historikerinnen und Historiker sagen: Wahrscheinlich nicht. Es gibt keine Dokumente aus dieser Zeit, die Tell erwähnen. Die Geschichte wurde erst viel später aufgeschrieben. Ausserdem gibt es eine sehr ähnliche Apfelschuss-Geschichte aus Skandinavien, die noch älter ist.\n\nTrotzdem ist Tell für viele Menschen wichtig. Er steht für Mut und Freiheit. Der deutsche Dichter Friedrich Schiller hat ein berühmtes Theaterstück über ihn geschrieben. In Altdorf steht ein grosses Denkmal von Tell und seinem Sohn.",
    wort: [["der Vogt","Beamter, der im Auftrag eines Herrschers regierte"],["sich verbeugen","den Oberkörper nach vorne neigen, als Zeichen von Respekt"],["die Armbrust","alte Waffe zum Schiessen von Pfeilen"],["der Historiker / die Historikerin","Person, die Geschichte erforscht"],["das Denkmal","Statue oder Bauwerk, das an etwas erinnert"]],
    mc: [
      { q: "In welchem Kanton spielt die Geschichte?", o: ["Uri","Zürich","Genf"], a: 0 },
      { q: "Warum musste Tell den Apfel schiessen?", o: ["Weil er einen Wettbewerb gewinnen wollte","Weil er sich nicht vor dem Hut verbeugt hatte","Weil sein Sohn es wollte"], a: 1 },
      { q: "Was sagen die meisten Historiker?", o: ["Tell hat sicher gelebt","Wahrscheinlich ist die Geschichte nicht wirklich passiert","Tell war ein König"], a: 1 },
      { q: "Wer hat ein berühmtes Theaterstück über Tell geschrieben?", o: ["Friedrich Schiller","Johanna Spyri","Albert Einstein"], a: 0 }
    ],
    rf: [
      { s: "Gessler war ein freundlicher und gerechter Vogt.", a: false, x: "Er war streng und ungerecht." },
      { s: "Es gibt viele Dokumente aus Tells Zeit, die ihn erwähnen.", a: false, x: "Es gibt keine Dokumente aus dieser Zeit, die Tell erwähnen." },
      { s: "In Altdorf steht ein Denkmal von Tell und seinem Sohn.", a: true }
    ],
    offen: [
      { q: "Nenne zwei Gründe, warum Historiker glauben, dass die Geschichte nicht wahr ist.", l: "Es gibt keine Dokumente aus dieser Zeit. Die Geschichte wurde erst viel später aufgeschrieben. Es gibt eine ähnliche, ältere Geschichte aus Skandinavien." },
      { q: "Kennst du eine Heldengeschichte aus einem anderen Land oder aus deiner Familie? Erzähle sie kurz in zwei bis drei Sätzen.", l: "Individuelle Antwort." }
    ] },

  { id: "dl-gotthard", r: "lnatur", typ: "text", texttitel: "Text", titel: "Der längste Eisenbahntunnel der Welt", kanal: "Sachtext", dauer: "ca. 190 Wörter",
    kurz: "Der Gotthard-Basistunnel führt 57 Kilometer durch die Alpen. Wie wurde er gebaut?",
    vor: "Bist du schon einmal durch den Gotthard ins Tessin gefahren?",
    text: "Die Alpen trennen die Deutschschweiz vom Tessin und von Italien. Früher war die Reise über den Gotthardpass lang und gefährlich. 1882 wurde der erste Eisenbahntunnel am Gotthard eröffnet. Er war 15 Kilometer lang und führte hoch oben durch den Berg.\n\nIm Jahr 2016 wurde ein neuer Tunnel eröffnet: der Gotthard-Basistunnel. Er ist 57 Kilometer lang und damit der längste Eisenbahntunnel der Welt. «Basistunnel» heisst er, weil er tief unten, an der Basis der Berge, durch den Fels führt. So müssen die Züge kaum bergauf fahren.\n\nDer Bau dauerte 17 Jahre. Riesige Bohrmaschinen frassen sich durch den harten Stein. Eine solche Maschine war so lang wie vier Fussballfelder. An manchen Stellen liegt über dem Tunnel mehr als 2000 Meter Fels. Dort ist es im Berg bis zu 45 Grad heiss. Tausende Arbeiter aus vielen Ländern haben am Tunnel gearbeitet. Leider sind beim Bau auch neun Menschen gestorben.\n\nHeute fahren jeden Tag viele Personen- und Güterzüge durch den Tunnel. Die Fahrt von Zürich nach Lugano ist deutlich kürzer geworden. Ausserdem können mehr Waren mit dem Zug statt mit Lastwagen transportiert werden. Das ist gut für die Umwelt.",
    wort: [["der Pass","Weg über einen Berg"],["eröffnen","zum ersten Mal für alle öffnen"],["der Fels","sehr harter Stein"],["die Bohrmaschine","Maschine, die Löcher macht"],["der Güterzug","Zug, der Waren transportiert"]],
    mc: [
      { q: "Wie lang ist der Gotthard-Basistunnel?", o: ["15 Kilometer","57 Kilometer","200 Kilometer"], a: 1 },
      { q: "Wann wurde der Basistunnel eröffnet?", o: ["1882","2016","2030"], a: 1 },
      { q: "Warum heisst er «Basistunnel»?", o: ["Weil er tief unten an der Basis der Berge durch den Fels führt","Weil er in Basel beginnt","Weil er der erste Tunnel war"], a: 0 },
      { q: "Wie lange dauerte der Bau?", o: ["2 Jahre","17 Jahre","50 Jahre"], a: 1 }
    ],
    rf: [
      { s: "Im Berg war es beim Bau an manchen Stellen sehr heiss.", a: true },
      { s: "Beim Bau des Tunnels ist niemand gestorben.", a: false, x: "Leider sind beim Bau neun Menschen gestorben." },
      { s: "Durch den Tunnel können mehr Waren mit dem Zug transportiert werden.", a: true }
    ],
    offen: [
      { q: "Warum ist es gut für die Umwelt, wenn mehr Waren mit dem Zug statt mit Lastwagen transportiert werden?", l: "Züge brauchen weniger Energie und stossen weniger Abgase aus als viele Lastwagen. Es gibt weniger Verkehr auf den Strassen." },
      { q: "Suche im Text zwei Zahlen und erkläre, was sie bedeuten.", l: "Zum Beispiel: 57 km = Länge des Tunnels; 2016 = Eröffnung; 17 Jahre = Bauzeit; 2000 m = Fels über dem Tunnel; 45 Grad = Temperatur im Berg." }
    ] },

  { id: "dl-bienen", r: "lnatur", typ: "text", texttitel: "Text", titel: "Kleine Bienen, grosse Arbeit", kanal: "Sachtext", dauer: "ca. 180 Wörter",
    kurz: "Ohne Bienen gäbe es viel weniger Äpfel, Kirschen und Erdbeeren. Warum sind die kleinen Tiere so wichtig?",
    vor: "Was weisst du über Bienen? Hast du Angst vor ihnen?",
    text: "Im Sommer leben in einem Bienenstock bis zu 50 000 Bienen. Jede hat eine Aufgabe. Die Königin legt die Eier, manchmal über tausend an einem Tag. Die Arbeiterinnen putzen den Stock, füttern die jungen Bienen, bauen Waben und fliegen hinaus, um Nektar und Pollen zu sammeln.\n\nAus dem Nektar der Blüten machen die Bienen Honig. Für ein einziges Glas Honig müssen sie zusammen sehr weit fliegen und Millionen von Blüten besuchen. Der Honig ist ihr Vorrat für den Winter.\n\nNoch wichtiger als der Honig ist aber die Bestäubung. Wenn eine Biene von Blüte zu Blüte fliegt, trägt sie den Blütenstaub mit. So können die Pflanzen Früchte bilden. Ohne Bienen und andere Insekten gäbe es viel weniger Äpfel, Kirschen, Erdbeeren oder Gurken.\n\nLeider geht es vielen Bienen nicht gut. Es gibt weniger Wiesen mit Blumen. Manche Pflanzenschutzmittel schaden den Insekten. Und eine Milbe, die Varroamilbe, macht die Honigbienen krank.\n\nJeder kann den Bienen helfen. Wer auf dem Balkon Blumen und Kräuter pflanzt, gibt ihnen Nahrung. Eine Wiese, die nicht zu oft gemäht wird, ist ein kleines Paradies für Insekten.",
    wort: [["der Bienenstock","das Haus der Bienen"],["die Wabe","Teil aus Wachs mit kleinen sechseckigen Zellen"],["der Nektar","süsser Saft in den Blüten"],["die Bestäubung","Blütenstaub kommt von einer Blüte zur anderen"],["die Milbe","sehr kleines Tier, oft ein Parasit"]],
    mc: [
      { q: "Wie viele Bienen leben im Sommer in einem Bienenstock?", o: ["Bis zu 500","Bis zu 50 000","Bis zu 5 Millionen"], a: 1 },
      { q: "Was ist die Aufgabe der Königin?", o: ["Honig sammeln","Eier legen","Den Stock putzen"], a: 1 },
      { q: "Was ist laut Text noch wichtiger als der Honig?", o: ["Das Wachs","Die Bestäubung","Der Stachel"], a: 1 },
      { q: "Was macht die Varroamilbe?", o: ["Sie macht die Honigbienen krank","Sie hilft beim Honigmachen","Sie frisst Blumen"], a: 0 }
    ],
    rf: [
      { s: "Der Honig ist der Vorrat der Bienen für den Winter.", a: true },
      { s: "Ohne Bienen gäbe es mehr Äpfel und Kirschen.", a: false, x: "Ohne Bienen gäbe es viel weniger Früchte." },
      { s: "Auch mit Blumen auf dem Balkon kann man den Bienen helfen.", a: true }
    ],
    offen: [
      { q: "Erkläre mit eigenen Worten, was Bestäubung ist.", l: "Eine Biene fliegt von Blüte zu Blüte und trägt dabei Blütenstaub mit. So können Pflanzen Früchte bilden." },
      { q: "Nenne zwei Gründe, warum es vielen Bienen nicht gut geht.", l: "Weniger Blumenwiesen, Pflanzenschutzmittel, die Varroamilbe." }
    ] },

  { id: "dl-schlaf", r: "lnatur", typ: "text", texttitel: "Text", titel: "Warum Jugendliche so müde sind", kanal: "Sachtext", dauer: "ca. 180 Wörter",
    kurz: "Am Abend hellwach, am Morgen todmüde: Das hat einen biologischen Grund.",
    vor: "Wann gehst du an einem Schultag ins Bett? Wie fühlst du dich am Morgen?",
    text: "Der Wecker klingelt um halb sieben. Mergim möchte am liebsten weiterschlafen. Am Abend vorher konnte er lange nicht einschlafen. Erst um Mitternacht hat er das Handy weggelegt. Vielen Jugendlichen geht es wie ihm.\n\nDas ist nicht einfach Faulheit. In der Pubertät verändert sich die innere Uhr. Der Körper bildet das Schlafhormon Melatonin später am Abend als bei Kindern oder Erwachsenen. Darum werden Jugendliche erst spät müde. Am Morgen aber beginnt die Schule früh. So bekommen viele zu wenig Schlaf.\n\nDabei brauchen Jugendliche viel Schlaf: Fachleute empfehlen acht bis zehn Stunden pro Nacht. Im Schlaf erholt sich der Körper, und das Gehirn speichert, was man am Tag gelernt hat. Wer zu wenig schläft, kann sich schlechter konzentrieren, ist schneller gereizt und wird öfter krank.\n\nWas hilft? Das blaue Licht von Bildschirmen macht wach. Darum ist es gut, das Handy eine Stunde vor dem Schlafen wegzulegen, am besten ausserhalb des Zimmers. Auch feste Schlafzeiten helfen, sogar am Wochenende. Und am Abend sollte man keine Energydrinks oder Cola trinken. Tagsüber hilft dagegen viel Licht und Bewegung an der frischen Luft.",
    wort: [["die Pubertät","Zeit, in der aus einem Kind ein Erwachsener wird"],["die innere Uhr","der natürliche Rhythmus des Körpers"],["das Hormon","Stoff im Körper, der Vorgänge steuert"],["sich erholen","wieder Kraft bekommen"],["gereizt","schnell wütend oder genervt"]],
    mc: [
      { q: "Was verändert sich in der Pubertät?", o: ["Die innere Uhr","Die Augenfarbe","Die Körpergrösse hört auf"], a: 0 },
      { q: "Wie heisst das Schlafhormon?", o: ["Adrenalin","Melatonin","Insulin"], a: 1 },
      { q: "Wie viel Schlaf empfehlen Fachleute für Jugendliche?", o: ["Vier bis fünf Stunden","Acht bis zehn Stunden","Zwölf bis vierzehn Stunden"], a: 1 },
      { q: "Was macht laut Text wach?", o: ["Das blaue Licht von Bildschirmen","Ein Glas Milch","Ein Buch lesen"], a: 0 }
    ],
    rf: [
      { s: "Jugendliche sind am Morgen müde, weil sie faul sind.", a: false, x: "Das ist nicht einfach Faulheit, sondern die veränderte innere Uhr." },
      { s: "Im Schlaf speichert das Gehirn, was man gelernt hat.", a: true },
      { s: "Feste Schlafzeiten helfen, sogar am Wochenende.", a: true }
    ],
    offen: [
      { q: "Was passiert, wenn man zu wenig schläft? Nenne zwei Folgen.", l: "Man kann sich schlechter konzentrieren, ist schneller gereizt, wird öfter krank." },
      { q: "Welchen Tipp aus dem Text möchtest du ausprobieren? Warum?", l: "Individuelle Antwort, z. B. Handy eine Stunde vorher weglegen, feste Schlafzeiten, keine Energydrinks am Abend." }
    ] },
  // ---------- DEUTSCH · LESEN · KLASSENTHEMEN: SPORT & KAMPFSPORT ----------
  { id: "wt-ronaldo", r: "wsport", typ: "text", texttitel: "Text", titel: "Cristiano Ronaldo – vom Strassenfussball zur Legende", kanal: "Porträt", dauer: "ca. 190 Wörter",
    kurz: "Er kommt aus einer armen Familie auf Madeira und wurde einer der besten Fussballer aller Zeiten.",
    vor: "Was weisst du schon über Cristiano Ronaldo? Bei welchen Vereinen hat er gespielt?",
    text: "Cristiano Ronaldo wurde am 5. Februar 1985 in Funchal geboren, auf der portugiesischen Insel Madeira. Seine Familie hatte wenig Geld. Schon als kleiner Junge spielte er jeden Tag Fussball auf der Strasse.\n\nMit zwölf Jahren zog er allein nach Lissabon, um in der Jugend von Sporting Lissabon zu spielen. Das war schwer für ihn: Er vermisste seine Familie, und andere Kinder lachten über seinen Dialekt. Mit 15 Jahren musste er sogar am Herzen operiert werden. Doch er gab nicht auf.\n\n2003 wechselte er zu Manchester United. Dort wurde er zum Weltstar. 2009 ging er zu Real Madrid. Mit Real gewann er viermal die Champions League, insgesamt hat er sie fünfmal gewonnen. Später spielte er für Juventus Turin, dann noch einmal für Manchester United. Seit 2023 spielt er für Al-Nassr in Saudi-Arabien.\n\nRonaldo hat fünfmal den Ballon d'Or gewonnen, die Auszeichnung für den besten Spieler der Welt. Mit Portugal wurde er 2016 Europameister. Kein anderer Mann hat so viele Tore für sein Nationalteam geschossen. In seiner ganzen Karriere hat er über 950 Tore erzielt.\n\nSein Geheimnis? Disziplin. Ronaldo trainiert sehr viel, schläft genug, isst gesund und trinkt keinen Alkohol.",
    wort: [["die Legende","eine sehr berühmte Person, von der man noch lange spricht"],["der Dialekt","die besondere Sprache einer Region"],["wechseln","zu einem anderen Verein gehen"],["die Auszeichnung","ein Preis für eine besondere Leistung"],["die Disziplin","sich an Regeln halten und hart an sich arbeiten"]],
    mc: [
      { q: "Wo wurde Cristiano Ronaldo geboren?", o: ["In Lissabon","Auf der Insel Madeira","In Madrid"], a: 1 },

      { q: "Bei welchem Verein wurde er zum Weltstar?", o: ["Bei Manchester United","Bei Al-Nassr","Beim FC Basel"], a: 0 },

    ],
    rf: [

      { s: "Mit 15 Jahren wurde er am Herzen operiert.", a: true },

      { q: "Ronaldos Geheimnis ist Disziplin. Wo brauchst du in deinem Leben Disziplin? Schreibe zwei Sätze.", l: "Individuelle Antwort, z. B. beim Lernen, im Training, bei der Lehrstellensuche." }
    ] },

  { id: "wt-muaythai", r: "wsport", typ: "text", texttitel: "Text", titel: "Muay Thai – die Kunst der acht Waffen", kanal: "Sachtext", dauer: "ca. 190 Wörter",
    kurz: "Der Nationalsport von Thailand wird auf der ganzen Welt immer beliebter. Was macht ihn so besonders?",
    vor: "Machst du selbst einen Kampfsport? Welchen?",
    text: "Muay Thai ist ein Kampfsport aus Thailand. Dort ist er Nationalsport und mehrere hundert Jahre alt. Man nennt Muay Thai auch «die Kunst der acht Waffen». Denn man kämpft nicht nur mit den beiden Fäusten, sondern auch mit beiden Ellbogen, beiden Knien und beiden Schienbeinen. Zusammen sind das acht «Waffen».\n\nTypisch für Muay Thai ist auch der Clinch. Die Kämpfer halten sich am Kopf oder Nacken fest und versuchen, mit dem Knie zu treffen. Ein Profikampf dauert meistens fünf Runden zu je drei Minuten.\n\nVor dem Kampf zeigen viele Kämpfer den Wai Kru. Das ist ein langsamer Tanz im Ring. Damit danken sie ihrem Trainer und ihren Eltern. Viele tragen dabei ein Band um den Kopf, den Mongkon. Während des Kampfes spielt oft traditionelle Musik mit Flöte und Trommeln.\n\nMuay Thai ist sehr hartes Training. Die Kämpfer laufen, springen Seil, schlagen auf Sandsäcke und trainieren mit Pratzen. Wichtig sind aber auch Respekt und Selbstkontrolle. Im Training gilt: Man will lernen, nicht den Partner verletzen.\n\nHeute trainieren Menschen auf der ganzen Welt Muay Thai, auch in der Schweiz. Viele wollen nicht kämpfen, sondern einfach fit werden und sich selbst verteidigen können.",
    wort: [["der Kampfsport","Sport, bei dem zwei Personen nach Regeln gegeneinander kämpfen"],["das Schienbein","der vordere Knochen am Unterschenkel"],["der Clinch","Kampf auf ganz kurze Distanz, man hält den Gegner fest"],["die Pratze","gepolstertes Polster, auf das man im Training schlägt"],["die Selbstkontrolle","sich selbst im Griff haben, ruhig bleiben"]],
    mc: [
      { q: "Aus welchem Land kommt Muay Thai?", o: ["Aus Japan","Aus Thailand","Aus China"], a: 1 },
      { q: "Warum heisst Muay Thai «Kunst der acht Waffen»?", o: ["Weil man mit acht Körperteilen kämpft: Fäuste, Ellbogen, Knie, Schienbeine","Weil es acht Runden gibt","Weil man mit acht Stöcken kämpft"], a: 0 },
      { q: "Was ist der Wai Kru?", o: ["Ein verbotener Schlag","Ein langsamer Tanz vor dem Kampf","Ein Preis für den Sieger"], a: 1 },
      { q: "Wie lange dauert ein Profikampf meistens?", o: ["Eine Runde","Fünf Runden zu je drei Minuten","Zwölf Runden zu je zehn Minuten"], a: 1 }

    rf: [
      { s: "Im Muay Thai darf man auch mit dem Ellbogen schlagen.", a: true },
      { s: "Mit dem Wai Kru danken die Kämpfer ihrem Trainer und ihren Eltern.", a: true },
      { s: "Alle Menschen, die Muay Thai trainieren, wollen Profikämpfer werden.", a: false, x: "Viele wollen einfach fit werden und sich verteidigen können." }
    ],
    offen: [
      { q: "Nenne drei Dinge, die Muay-Thai-Kämpfer im Training machen.", l: "Laufen, Seil springen, auf Sandsäcke schlagen, mit Pratzen trainieren." },
      { q: "Warum sind Respekt und Selbstkontrolle im Kampfsport wichtig? Erkläre in ein bis zwei Sätzen.", l: "Damit sich niemand verletzt und man fair trainiert. Man will lernen, nicht den Partner verletzen." }
    ] },

  { id: "wt-shara", r: "wsport", typ: "text", texttitel: "Text", titel: "Shara Magomedov – der Kämpfer mit einem Auge", kanal: "Porträt", dauer: "ca. 190 Wörter",
    kurz: "Er kommt aus Dagestan, kämpft in der UFC und ist für seine spektakulären Schläge bekannt. Dabei sieht er nur auf einem Auge.",
    vor: "Kennst du Kämpfer aus der UFC? Wen?",
    text: "Sharabutdin Magomedov, genannt «Shara», wurde 1994 in Machatschkala geboren. Die Stadt liegt in Dagestan, einer Region im Süden von Russland. In Dagestan sind Ringen und Kampfsport sehr beliebt. Viele bekannte Kämpfer kommen von dort.\n\nAls Kind spielte Shara zuerst Fussball. Dann begann er mit Boxen. Später zog er nach Moskau und wechselte zum Muay Thai. Er wurde russischer Meister. Er kämpfte auch in Lethwei, einer sehr harten Kampfsportart aus Myanmar.\n\nBeim Training in Thailand verletzte er sich schwer am Auge. Trotz mehrerer Operationen verlor er auf diesem Auge die Sehkraft. Viele dachten, seine Karriere sei vorbei. Doch Shara machte weiter.\n\nIm Jahr 2023 kämpfte er zum ersten Mal in der UFC, der grössten Organisation für Mixed Martial Arts (MMA). Er kämpft im Mittelgewicht. Berühmt wurde er im Oktober 2024: Er schlug seinen Gegner mit einem doppelten Rückwärts-Faustschlag aus der Drehung K.o. So etwas hatte man in der UFC noch nie gesehen.\n\nSeine erste Niederlage im MMA kassierte er im Februar 2025 gegen Michael Page. Danach gewann er wieder. Fans mögen Shara, weil er nicht vor allem ringt wie viele andere Kämpfer aus Dagestan, sondern gern im Stehen kämpft, mit Schlägen und Tritten.",
    wort: [["die Region","ein Gebiet, ein Teil eines Landes"],["die Sehkraft","die Fähigkeit, mit den Augen zu sehen"],["die Organisation","eine grosse Gruppe oder Firma, die etwas organisiert"],["das Mittelgewicht","eine Gewichtsklasse im Kampfsport"],["die Niederlage","wenn man einen Kampf oder ein Spiel verliert"]],
    mc: [
      { q: "Woher kommt Shara Magomedov?", o: ["Aus Dagestan","Aus Thailand","Aus Brasilien"], a: 0 },
      { q: "Welchen Sport machte er als Kind zuerst?", o: ["Muay Thai","Fussball","Schwimmen"], a: 1 },
      { q: "Was passierte beim Training in Thailand?", o: ["Er brach sich das Bein","Er verletzte sich schwer am Auge","Er gewann einen Weltmeistertitel"], a: 1 },
      { q: "Wofür wurde er im Oktober 2024 berühmt?", o: ["Für einen doppelten Rückwärts-Faustschlag aus der Drehung","Für einen Sieg im Ringen","Für ein Tor im Fussball"], a: 0 }
    ],
    rf: [

    offen: [
      { q: "Was zeigt die Geschichte von Shara über seinen Charakter? Schreibe zwei Sätze.", l: "Zum Beispiel: Er gibt nicht auf, auch wenn es schwierig wird. Er ist mutig und diszipliniert." },
      { q: "Erkläre mit eigenen Worten, was die UFC ist.", l: "Die grösste Organisation für Mixed Martial Arts (MMA), also Kämpfe, bei denen verschiedene Kampfsportarten gemischt werden." }

  { id: "wt-plachta", r: "wsport", typ: "text", texttitel: "Text", titel: "Adriana Płachta – Physikerin und Weltmeisterin", kanal: "Porträt", dauer: "ca. 170 Wörter",
    kurz: "Am Tag arbeitet sie wie viele andere, am Abend trainiert sie. Die Polin ist Welt- und Europameisterin im Muay Thai.",
    vor: "Kann man neben einem normalen Job Spitzensportlerin sein? Was denkst du?",
    text: "Adriana Płachta kommt aus Polen. Als Kind spielte sie Fussball. Mit 17 Jahren begann sie mit Boxen. Sie merkte schnell: Kampfsport ist genau das Richtige für sie.\n\nFür das Studium zog sie nach Rzeszów, eine Stadt im Südosten von Polen. Dort studierte sie Physik, genauer medizinische Physik, und machte einen Master-Abschluss. In dieser Zeit entdeckte sie auch Muay Thai. Heute trainiert sie im Verein Universal Fight Team Rzeszów.\n\nAdriana ist sehr erfolgreich. Sie wurde Weltmeisterin in der Gewichtsklasse bis 60 Kilogramm. Ausserdem wurde sie zweimal Europameisterin. Den zweiten Titel holte sie im November 2025 in Athen. Ihren ersten Europameistertitel gewann sie sogar mit einem angebrochenen Schienbein.\n\nDas Besondere: Adriana ist keine Profisportlerin, die nur trainiert. Sie arbeitet tagsüber von 8 bis 16 Uhr. Danach geht sie ins Training. «Starke Anstrengung, starke Müdigkeit», beschreibt sie ihr Training.\n\nMuay Thai vergleicht sie mit Schach: Es gibt sehr viele Kombinationen von Schlägen, und man muss vorausdenken. Etwas ärgert sie aber: Muay Thai ist (noch) keine olympische Sportart. Sie würde gern einmal an den Olympischen Spielen kämpfen.",
    wort: [["die Physik","Wissenschaft, die Natur und Kräfte erforscht"],["der Master-Abschluss","ein Abschluss an der Universität nach mehreren Jahren Studium"],["die Gewichtsklasse","im Kampfsport kämpft man gegen Leute mit ähnlichem Gewicht"],["angebrochen","ein bisschen gebrochen, mit einem Riss"],["vorausdenken","schon jetzt an das denken, was später passiert"]],
    mc: [
      { q: "Was hat Adriana Płachta studiert?", o: ["Medizin","Physik","Sport"], a: 1 },
      { q: "In welcher Gewichtsklasse kämpft sie?", o: ["Bis 48 Kilogramm","Bis 60 Kilogramm","Über 90 Kilogramm"], a: 1 },
      { q: "Wo gewann sie im November 2025 die Europameisterschaft?", o: ["In Athen","In Warschau","In Bangkok"], a: 0 },
      { q: "Womit vergleicht sie Muay Thai?", o: ["Mit Fussball","Mit Schach","Mit Tanzen"], a: 1 }
    ],
    rf: [
      { s: "Adriana hat mit 17 Jahren mit Boxen angefangen.", a: true },
      { s: "Adriana ist Profisportlerin und arbeitet nicht.", a: false, x: "Sie arbeitet tagsüber von 8 bis 16 Uhr und trainiert danach." },
      { s: "Muay Thai ist schon lange eine olympische Sportart.", a: false, x: "Muay Thai ist (noch) keine olympische Sportart. Das ärgert sie." }
    ],
    offen: [
      { q: "Warum vergleicht Adriana Muay Thai mit Schach? Erkläre.", l: "Es gibt sehr viele Kombinationen von Schlägen, und man muss vorausdenken – wie beim Schach." },
      { q: "Adriana arbeitet und trainiert. Was braucht man, um beides zu schaffen? Nenne zwei Dinge.", l: "Zum Beispiel: Disziplin, gute Planung, viel Energie, genug Schlaf, Motivation." }
    ] },

  { id: "wt-k1", r: "wsport", typ: "text", texttitel: "Text", titel: "K-1 – Kickboxen auf der grossen Bühne", kanal: "Sachtext", dauer: "ca. 220 Wörter",
    kurz: "In den 1990er-Jahren füllte K-1 in Japan riesige Hallen. Ein Schweizer wurde dabei zum Star.",
    vor: "Was ist der Unterschied zwischen Boxen und Kickboxen? Was vermutest du?",
    text: "K-1 ist der Name einer Kampfsport-Organisation und zugleich eines Regelwerks. Sie wurde 1993 in Japan gegründet. Die Idee war: Kämpfer aus verschiedenen Sportarten wie Karate, Kickboxen, Muay Thai oder Taekwondo treffen aufeinander. Das «K» steht für Kampfsportarten, die in Japan mit K beginnen, zum Beispiel Karate und Kickboxen.\n\nBei K-1 darf man mit den Fäusten schlagen und mit den Beinen treten. Auch Knie sind erlaubt. Anders als beim Muay Thai sind Ellbogenschläge aber verboten. Den Gegner lange festzuhalten, ist ebenfalls nicht erlaubt. Ein Kampf dauert meistens drei Runden zu je drei Minuten.\n\nBerühmt wurde K-1 durch den «World Grand Prix». In diesem Turnier musste ein Kämpfer an einem einzigen Abend bis zu drei Kämpfe gewinnen, um Champion zu werden. In Tokio sahen jeweils Zehntausende Menschen zu.\n\nEiner der grössten Stars war ein Schweizer: Andy Hug, geboren in Zürich. Er war früher Karate-Kämpfer und berühmt für seinen Axe-Kick, einen Tritt von oben nach unten. 1996 gewann er den K-1 World Grand Prix. In Japan war er ein Held. Im Jahr 2000 starb Andy Hug mit nur 35 Jahren an Leukämie. Viele Fans in Japan und in der Schweiz trauerten um ihn.\n\nHeute gibt es K-1 immer noch, und die K-1-Regeln werden in vielen Kickbox-Turnieren auf der Welt benutzt.",
    wort: [["das Regelwerk","alle Regeln einer Sportart zusammen"],["gründen","etwas Neues beginnen, z. B. eine Firma"],["das Turnier","ein Wettkampf mit mehreren Spielen oder Kämpfen"],["trauern","traurig sein, weil jemand gestorben ist"],["die Leukämie","eine schwere Krankheit des Blutes (Blutkrebs)"]],
    mc: [
      { q: "Wo und wann wurde K-1 gegründet?", o: ["1993 in Japan","1970 in den USA","2010 in Thailand"], a: 0 },
      { q: "Was ist bei K-1 verboten, im Muay Thai aber erlaubt?", o: ["Tritte mit den Beinen","Schläge mit den Fäusten","Schläge mit den Ellbogen"], a: 2 },
      { q: "Was musste man beim World Grand Prix an einem Abend schaffen?", o: ["Bis zu drei Kämpfe gewinnen","Einen Marathon laufen","Zehn Gegner besiegen"], a: 0 },
      { q: "Wofür war Andy Hug berühmt?", o: ["Für seinen Axe-Kick","Für seinen Ellbogenschlag","Für seine Würfe"], a: 0 }
    ],
    rf: [
      { s: "Bei K-1 treffen Kämpfer aus verschiedenen Sportarten aufeinander.", a: true },
      { s: "Andy Hug kam aus Japan.", a: false, x: "Andy Hug war Schweizer, geboren in Zürich." },
      { s: "Andy Hug gewann 1996 den K-1 World Grand Prix.", a: true }
    ],
    offen: [
      { q: "Nenne zwei Unterschiede zwischen K-1 und Muay Thai.", l: "Bei K-1 sind Ellbogenschläge verboten, man darf den Gegner nicht lange festhalten (kein langer Clinch); K-1-Kämpfe haben meist drei statt fünf Runden." },
      { q: "Warum war Andy Hug in Japan ein Held? Erkläre mit dem Text.", l: "Er gewann 1996 den K-1 World Grand Prix und war ein grosser Star mit seinem berühmten Axe-Kick." }
    ] },

  { id: "wt-albanien", r: "wwelt", typ: "text", texttitel: "Text", titel: "Albanien – das Land der Adler", kanal: "Sachtext", dauer: "ca. 200 Wörter",
    kurz: "Berge, Meer und eine bewegte Geschichte: ein Porträt von Albanien.",
    vor: "Warst du schon einmal in Albanien oder im Kosovo? Was weisst du über das Land?",
    text: "Albanien liegt im Südosten von Europa, auf dem Balkan. Im Westen grenzt es an das Meer, an die Adria und das Ionische Meer. Die Hauptstadt heisst Tirana. In Albanien leben etwa 2,4 Millionen Menschen. Viele Albanerinnen und Albaner leben aber im Ausland, zum Beispiel in Italien, in Deutschland oder in der Schweiz.\n\nAuf Albanisch heisst das Land «Shqipëria». Oft wird es als «Land der Adler» bezeichnet. Darum ist auf der roten Flagge ein schwarzer Adler mit zwei Köpfen. Der Nationalheld ist Skanderbeg. Er kämpfte im 15. Jahrhundert gegen das Osmanische Reich. Am 28. November 1912 wurde Albanien unabhängig. Dieser Tag ist bis heute der Nationalfeiertag.\n\nNach dem Zweiten Weltkrieg wurde Albanien eine kommunistische Diktatur unter Enver Hoxha. Das Land war fast ganz von der Welt abgeschlossen. Die Menschen durften nicht ins Ausland reisen. Die Regierung liess über 170 000 Bunker bauen, aus Angst vor einem Angriff. Viele davon stehen noch heute. Erst Anfang der 1990er-Jahre wurde Albanien eine Demokratie.\n\nHeute kommen immer mehr Touristen nach Albanien. Sie besuchen die Strände der «Albanischen Riviera», die alten Städte Berat und Gjirokastër und die wilden Berge im Norden. Viele junge Albanerinnen und Albaner arbeiten im Tourismus.",
    wort: [["grenzen an","direkt neben etwas liegen"],["unabhängig","frei, von keinem anderen Land regiert"],["die Diktatur","Staat, in dem eine Person oder Partei alle Macht hat"],["der Bunker","ein starkes Gebäude aus Beton zum Schutz im Krieg"],["die Demokratie","Staat, in dem das Volk wählen und mitbestimmen darf"]],

  { id: "wt-marseille", r: "wwelt", typ: "text", texttitel: "Text", titel: "Marseille – die älteste Stadt Frankreichs", kanal: "Sachtext", dauer: "ca. 190 Wörter",
    kurz: "Hafen, Fussball und Fischsuppe: Marseille ist laut, bunt und voller Geschichte.",
    vor: "Was weisst du über Frankreich? Kennst du eine französische Stadt ausser Paris?",
    text: "Marseille liegt im Süden von Frankreich, direkt am Mittelmeer. Mit rund 870 000 Einwohnern ist sie die zweitgrösste Stadt des Landes, nach Paris. Sie ist auch die älteste Stadt Frankreichs: Griechische Seefahrer gründeten sie vor etwa 2600 Jahren. Sie nannten sie «Massalia».\n\nDas Herz der Stadt ist der Alte Hafen, der «Vieux-Port». Hier verkaufen Fischer am Morgen ihren Fang. Über der Stadt steht auf einem Hügel die Kirche Notre-Dame de la Garde. Die Menschen in Marseille nennen sie «la Bonne Mère», die gute Mutter. Von dort hat man einen wunderschönen Blick auf das Meer.\n\nMarseille ist eine sehr gemischte Stadt. Seit Jahrhunderten kommen Menschen aus vielen Ländern hierher, zum Beispiel aus Italien, Armenien, Algerien oder von den Komoren. Man hört auf der Strasse viele Sprachen.\n\nDie Leute in Marseille lieben ihren Fussballclub, Olympique de Marseille, kurz OM. 1993 gewann OM als bisher einziger französischer Club die Champions League. Bei den Heimspielen im Stade Vélodrome ist die Stimmung legendär.\n\nBerühmt ist auch das Essen: Die Bouillabaisse ist eine Fischsuppe aus Marseille. Und ganz in der Nähe liegen die Calanques. Das sind schmale Buchten mit weissen Felsen und türkisblauem Wasser.",
    wort: [["der Seefahrer","Person, die mit dem Schiff über das Meer fährt"],["gründen","eine Stadt neu bauen und beginnen"],["der Fang","die Fische, die man gefangen hat"],["gemischt","mit vielen verschiedenen Menschen oder Dingen"],["die Bucht","Stelle, an der das Meer ins Land hineingeht"]],

      { q: "Wo liegt Marseille?", o: ["Im Norden von Frankreich, am Atlantik","Im Süden von Frankreich, am Mittelmeer","In der Westschweiz"], a: 1 },
      { q: "Wer gründete die Stadt?", o: ["Griechische Seefahrer","Römische Soldaten","Französische Könige"], a: 0 },

    ] },

  { id: "wt-favelas", r: "wwelt", typ: "text", texttitel: "Text", titel: "Leben in der Favela", kanal: "Sachtext", dauer: "ca. 190 Wörter",
    kurz: "In Rio de Janeiro wohnen viele Menschen in Favelas an den Hügeln der Stadt. Wie ist das Leben dort?",
    vor: "Hast du schon Bilder von Favelas gesehen? Was hast du gesehen?",
    text: "Rio de Janeiro in Brasilien ist berühmt für den Strand von Copacabana und den Zuckerhut. Doch an vielen Hügeln der Stadt stehen dicht gedrängte, bunte Häuser. Das sind die Favelas. Fast jeder fünfte Mensch in Rio wohnt in einer Favela.\n\nDie ersten Favelas entstanden vor über 100 Jahren. Arme Menschen, die keine Wohnung bezahlen konnten, bauten ihre Häuser selbst, oft ohne Erlaubnis. Viele kamen vom Land in die Stadt, um Arbeit zu finden. Mit der Zeit wurden aus einfachen Hütten Häuser aus Ziegeln und Beton, oft mit mehreren Stockwerken. Eine der grössten Favelas ist Rocinha. Dort wohnen Zehntausende Menschen.\n\nDas Leben in den Favelas ist nicht einfach. Oft fehlen gute Schulen, Ärzte und eine sichere Wasserversorgung. In manchen Favelas haben Drogenbanden viel Macht. Es kommt zu Schiessereien mit der Polizei. Dabei sterben immer wieder auch unschuldige Menschen.\n\nAber die Favelas sind nicht nur gefährlich. Hier leben Familien, Kinder gehen zur Schule, Erwachsene arbeiten in der ganzen Stadt. Die Nachbarn helfen einander. Aus den Favelas kommen auch Musikstile wie der Funk carioca und viele bekannte Fussballer. Manche Bewohner bieten heute Führungen für Touristen an und zeigen ihre Favela von der positiven Seite.",
    wort: [["dicht gedrängt","ganz nah beieinander, ohne Platz dazwischen"],["die Erlaubnis","wenn man etwas offiziell darf"],["die Hütte","ein kleines, einfaches Haus"],["die Wasserversorgung","dafür sorgen, dass alle sauberes Wasser haben"],["unschuldig","jemand hat nichts Böses gemacht"]],
    mc: [
      { q: "In welcher Stadt spielt der Text?", o: ["In Rio de Janeiro","In Lissabon","In Mexiko-Stadt"], a: 0 },
      { q: "Wie viele Menschen in Rio wohnen in einer Favela?", o: ["Fast jeder fünfte","Fast alle","Nur sehr wenige"], a: 0 },
      { q: "Warum entstanden die ersten Favelas?", o: ["Reiche Menschen wollten Ferienhäuser","Arme Menschen bauten ihre Häuser selbst, weil sie keine Wohnung bezahlen konnten","Die Regierung baute sie für Touristen"], a: 1 },
      { q: "Was kommt laut Text auch aus den Favelas?", o: ["Der Funk carioca und viele Fussballer","Der Karneval von Venedig","Die Bouillabaisse"], a: 0 }
    ],
    rf: [
      { s: "Rocinha ist eine der grössten Favelas.", a: true },
      { s: "In den Favelas gibt es überall sehr gute Schulen und Ärzte.", a: false, x: "Oft fehlen gute Schulen, Ärzte und sichere Wasserversorgung." },
      { s: "In den Favelas helfen sich die Nachbarn oft gegenseitig.", a: true }
    ],
    offen: [
      { q: "Nenne zwei Probleme, die es in vielen Favelas gibt.", l: "Fehlende Schulen, Ärzte oder sichere Wasserversorgung; Drogenbanden; Schiessereien mit der Polizei." },
      { q: "Der Text sagt: Favelas sind «nicht nur gefährlich». Was meint er damit? Erkläre in eigenen Worten.", l: "Dort leben ganz normale Familien, die Nachbarn helfen sich, es gibt Musik und Sport. Man soll nicht nur das Negative sehen." }
    ] },

  { id: "wt-mafia", r: "wwelt", typ: "text", texttitel: "Text", titel: "Die Mafia in Italien", kanal: "Sachtext", dauer: "ca. 210 Wörter",
    kurz: "Die Mafia ist aus Filmen bekannt. Doch sie ist echt – und viele Menschen in Italien kämpfen gegen sie.",
    vor: "Was denkst du, wenn du das Wort «Mafia» hörst? Woher kennst du es?",
    text: "Die Mafia ist eine kriminelle Organisation. Sie verdient Geld mit Drogenhandel, Erpressung und illegalen Geschäften. In Italien gibt es mehrere Mafia-Gruppen: die Cosa Nostra auf Sizilien, die Camorra in Neapel und die 'Ndrangheta in Kalabrien. Die 'Ndrangheta gilt heute als die mächtigste. Sie ist auch in anderen Ländern aktiv, sogar in der Schweiz.\n\nDie Mafia funktioniert wie eine Familie mit strengen Regeln. Die wichtigste Regel ist die «Omertà», das Schweigen. Wer mit der Polizei spricht, muss mit Rache rechnen. Viele Geschäfte müssen der Mafia regelmässig Geld bezahlen, den sogenannten «Pizzo». Dafür «beschützt» die Mafia sie – in Wirklichkeit vor sich selbst.\n\nViele mutige Menschen kämpfen gegen die Mafia. Zwei berühmte Richter, Giovanni Falcone und Paolo Borsellino, brachten Hunderte Mafiosi vor Gericht. 1992 wurden beide von der Mafia mit Bomben getötet. Ganz Italien war geschockt. Heute tragen Schulen, Plätze und sogar der Flughafen von Palermo ihre Namen.\n\nIn Palermo haben junge Leute im Jahr 2004 die Bewegung «Addiopizzo» gegründet, was so viel heisst wie «Tschüss Pizzo». Geschäfte, die mitmachen, zahlen kein Schutzgeld mehr. Kundinnen und Kunden können bewusst dort einkaufen. So zeigen die Menschen: Wir haben keine Angst mehr.\n\nIn Filmen und Serien sieht die Mafia oft cool aus. In Wirklichkeit bringt sie vor allem Angst, Gewalt und Armut.",
    wort: [["kriminell","gegen das Gesetz"],["die Erpressung","jemandem drohen, damit er Geld gibt"],["die Rache","jemandem schaden, weil er einem selbst geschadet hat"],["das Schutzgeld","Geld, das man der Mafia unter Drohung bezahlen muss"],["die Bewegung","eine Gruppe von Menschen, die gemeinsam etwas verändern wollen"]],
    mc: [
      { q: "Welche Mafia-Gruppe gilt heute als die mächtigste?", o: ["Die Cosa Nostra","Die 'Ndrangheta","Die Camorra"], a: 1 },
      { q: "Was bedeutet «Omertà»?", o: ["Das Schweigen","Das Schutzgeld","Die Familie"], a: 0 },
      { q: "Was passierte 1992 mit Falcone und Borsellino?", o: ["Sie wurden Präsidenten","Sie wurden von der Mafia getötet","Sie gingen in die Schweiz"], a: 1 },
      { q: "Was machen Geschäfte bei «Addiopizzo»?", o: ["Sie zahlen kein Schutzgeld mehr","Sie verkaufen nur Pizza","Sie arbeiten mit der Mafia zusammen"], a: 0 }
    ],
    rf: [
      { s: "Die Mafia ist nur in Italien aktiv.", a: false, x: "Die 'Ndrangheta ist auch in anderen Ländern aktiv, sogar in der Schweiz." },
      { s: "Der Flughafen von Palermo trägt die Namen von Falcone und Borsellino.", a: true },
      { s: "Laut Text bringt die Mafia in Wirklichkeit vor allem Angst, Gewalt und Armut.", a: true }
    ],
    offen: [
      { q: "Erkläre, was der «Pizzo» ist und warum die Mafia so mächtig werden konnte.", l: "Der Pizzo ist Schutzgeld, das Geschäfte unter Drohung zahlen müssen. Wegen der Omertà (Schweigen) und aus Angst vor Rache hat lange kaum jemand mit der Polizei gesprochen." },
      { q: "In Filmen sieht die Mafia oft cool aus. Was denkst du darüber? Schreibe zwei bis drei Sätze.", l: "Individuelle Antwort. Eine gute Antwort vergleicht Film und Wirklichkeit (Gewalt, Angst, Opfer)." }
    ] },

  // ---------- DEUTSCH · LESEN · KLASSENTHEMEN: LIFESTYLE ----------
  { id: "wt-shopping", r: "wstyle", typ: "text", texttitel: "Text", titel: "Shopping und Fast Fashion", kanal: "Sachtext", dauer: "ca. 190 Wörter",
    kurz: "Ein T-Shirt für 5 Franken – wie ist das möglich? Und wer bezahlt den wahren Preis?",
    vor: "Wie oft kaufst du neue Kleider? Wo kaufst du sie?",
    text: "Shoppen macht vielen Menschen Spass. Ein neues T-Shirt, eine coole Jacke, neue Sneakers – und man fühlt sich gut. Heute ist Kleidung so billig wie nie zuvor. In manchen Läden und Online-Shops kostet ein T-Shirt weniger als ein Sandwich.\n\nMan nennt das «Fast Fashion», also schnelle Mode. Grosse Modeketten bringen fast jede Woche neue Kollektionen in die Läden. Die Kleider sind günstig, damit die Leute oft und viel kaufen. Viele Teile werden aber nur ein paar Mal getragen und dann weggeworfen.\n\nDer niedrige Preis hat Gründe. Die meisten Kleider werden in Ländern wie Bangladesch, China oder Vietnam hergestellt. Dort arbeiten viele Näherinnen sehr lange für einen sehr kleinen Lohn. Manchmal sind die Fabriken gefährlich. 2013 stürzte in Bangladesch das Fabrikgebäude Rana Plaza ein. Über 1100 Menschen starben.\n\nAuch die Umwelt leidet. Für ein einziges Baumwoll-T-Shirt braucht man sehr viel Wasser. Beim Färben gelangen oft giftige Stoffe in die Flüsse. Und die vielen weggeworfenen Kleider landen im Müll.\n\nWas kann man tun? Weniger, aber dafür bessere Kleider kaufen. Second-Hand-Läden und Kleiderbörsen im Internet nutzen. Kleider tauschen, flicken oder weitergeben. Und vor dem Kauf fragen: Brauche ich das wirklich?",
    wort: [["die Kollektion","eine Gruppe von neuen Kleidern, die zusammen verkauft werden"],["die Näherin","Frau, die Kleider näht"],["einstürzen","plötzlich zusammenfallen"],["färben","einer Sache eine Farbe geben"],["Second-Hand","gebraucht, schon von jemandem getragen"]],
    mc: [
      { q: "Was bedeutet «Fast Fashion»?", o: ["Kleider für Sportler","Schnelle, billige Mode mit ständig neuen Kollektionen","Teure Mode aus Paris"], a: 1 },
      { q: "Wo werden die meisten Kleider hergestellt?", o: ["In der Schweiz","In Ländern wie Bangladesch, China oder Vietnam","In Kanada"], a: 1 },
      { q: "Was passierte 2013 in Bangladesch?", o: ["Ein Fabrikgebäude stürzte ein, über 1100 Menschen starben","Eine neue Modeschule wurde eröffnet","Alle Fabriken wurden geschlossen"], a: 0 },
      { q: "Welcher Tipp steht im Text?", o: ["Jede Woche neue Kleider kaufen","Second-Hand-Läden nutzen","Kleider nach einmal Tragen wegwerfen"], a: 1 }
    ],
    rf: [

      { s: "Die Näherinnen verdienen sehr viel Geld.", a: false, x: "Sie arbeiten sehr lange für einen sehr kleinen Lohn." },
      { s: "Für ein Baumwoll-T-Shirt braucht man viel Wasser.", a: true }
    ],
    offen: [
      { q: "Wer bezahlt laut Text den «wahren Preis» für billige Kleider? Nenne zwei.", l: "Die Näherinnen (wenig Lohn, gefährliche Fabriken) und die Umwelt (Wasser, giftige Stoffe, Müll)." },
      { q: "Was könntest du selbst beim Kleiderkauf anders machen? Schreibe zwei Ideen.", l: "Zum Beispiel: weniger kaufen, Second-Hand kaufen, Kleider tauschen oder flicken, vorher überlegen, ob man es wirklich braucht." }

  { id: "wt-schminke", r: "wstyle", typ: "text", texttitel: "Text", titel: "Schminke – seit 5000 Jahren", kanal: "Sachtext", dauer: "ca. 190 Wörter",
    kurz: "Make-up ist kein moderner Trend. Schon im alten Ägypten schminkten sich Frauen und Männer.",
    vor: "Schminkst du dich? Oder kennst du jemanden, der sich gerne schminkt?",
    text: "Lidstrich, Mascara, Lippenstift: Für viele Jugendliche gehört Make-up zum Alltag. Aber Schminke ist keine neue Erfindung. Schon vor etwa 5000 Jahren schminkten sich die Menschen im alten Ägypten. Frauen und Männer malten sich mit einer schwarzen Farbe, dem Kajal, dicke Linien um die Augen. Das sah schön aus und schützte die Augen vor der starken Sonne.\n\nIn anderen Zeiten war Schminke sogar gefährlich. Im alten Rom und später in Europa malten sich reiche Frauen das Gesicht weiss. Dafür benutzten sie oft Blei. Das ist giftig und machte viele Menschen krank.\n\nHeute ist Make-up sicherer. In der Schweiz und in der EU gibt es strenge Regeln, welche Stoffe in Kosmetik erlaubt sind. Trotzdem sollte man ein paar Dinge beachten: Make-up vor dem Schlafen immer gut entfernen, sonst können Pickel entstehen. Mascara und Lippenstift nicht mit Freundinnen teilen, denn so werden Bakterien übertragen. Und alte Produkte wegwerfen: Mascara hält nach dem Öffnen nur etwa drei bis sechs Monate.\n\nAuf Social Media gibt es unzählige Schmink-Tutorials. Influencerinnen und Influencer zeigen ihre Looks. Das kann inspirieren. Man sollte aber nicht vergessen: Viele Bilder sind mit Filtern bearbeitet. Niemand sieht in Wirklichkeit so perfekt aus.",
    wort: [["der Lidstrich","Linie, die man auf das Augenlid malt"],["schützen","dafür sorgen, dass nichts Schlimmes passiert"],["giftig","macht krank oder tötet"],["übertragen","von einer Person zur anderen weitergeben"],["der Filter","Effekt, der ein Foto verändert"]],
    mc: [
      { q: "Wo schminkten sich die Menschen schon vor etwa 5000 Jahren?", o: ["Im alten Ägypten","In der Schweiz","In Amerika"], a: 0 },
      { q: "Warum war Schminke im alten Rom gefährlich?", o: ["Sie war zu teuer","Sie enthielt oft giftiges Blei","Sie war verboten"], a: 1 },
      { q: "Warum soll man Mascara nicht mit Freundinnen teilen?", o: ["Weil sie dann schneller leer ist","Weil so Bakterien übertragen werden","Weil es verboten ist"], a: 1 },
      { q: "Wie lange hält Mascara nach dem Öffnen etwa?", o: ["Drei bis sechs Monate","Zehn Jahre","Eine Woche"], a: 0 }
    ],
    rf: [
      { s: "Im alten Ägypten schminkten sich nur Frauen.", a: false, x: "Frauen und Männer schminkten sich." },
      { s: "Make-up soll man vor dem Schlafen gut entfernen.", a: true },
      { s: "Viele Bilder auf Social Media sind mit Filtern bearbeitet.", a: true }
    ],
    offen: [
      { q: "Nenne zwei Tipps aus dem Text für den Umgang mit Make-up.", l: "Vor dem Schlafen entfernen, Mascara und Lippenstift nicht teilen, alte Produkte wegwerfen." },
      { q: "Was denkst du über Schmink-Tutorials und Filter auf Social Media? Schreibe zwei bis drei Sätze.", l: "Individuelle Antwort. Eine gute Antwort nennt Vorteile (Inspiration) und Nachteile (unrealistische Bilder)." }
    ] },

  { id: "wt-kosmetik", r: "wstyle", typ: "text", texttitel: "Text", titel: "Was steckt in der Creme?", kanal: "Ratgeber", dauer: "ca. 200 Wörter",
    kurz: "Skincare ist auf TikTok ein riesiger Trend. Doch was brauchen junge Menschen für ihre Haut wirklich?",
    vor: "Welche Pflegeprodukte benutzt du? Wie viel Geld gibst du dafür aus?",
    text: "Seren, Masken, Cremes mit zehn Schritten: Auf Social Media zeigen schon sehr junge Mädchen und Jungen ihre «Skincare-Routine». Manche Produkte kosten 50 Franken oder mehr. Hautärztinnen und Hautärzte warnen aber: Junge Haut braucht viel weniger, als die Werbung sagt.\n\nFür die meisten Jugendlichen reichen drei Dinge: eine milde Reinigung am Abend, eine einfache Creme, wenn die Haut trocken ist, und Sonnenschutz. Sonnencreme ist sogar das wichtigste Produkt überhaupt. Sie schützt vor Sonnenbrand und später vor Hautkrebs. Starke Wirkstoffe wie Retinol oder Säuren sind für Erwachsene gedacht. Bei jungen Menschen können sie die Haut reizen und rot machen.\n\nIn der Pubertät bekommen viele Jugendliche Pickel. Das ist normal und hat mit den Hormonen zu tun. Man sollte Pickel nicht ausdrücken, sonst können Narben bleiben. Wenn die Pickel sehr stark sind, hilft ein Besuch bei der Hautärztin.\n\nWer wissen will, was in einem Produkt steckt, kann die Liste der Inhaltsstoffe auf der Verpackung lesen. Der Stoff, von dem am meisten drin ist, steht zuerst. Übrigens: In der EU sind Tierversuche für Kosmetik seit 2013 verboten.\n\nDie wichtigste Regel: Teuer heisst nicht automatisch besser. Und gesunde Haut kommt auch von genug Schlaf, Wasser trinken und gesundem Essen.",
    wort: [["die Hautärztin / der Hautarzt","Ärztin oder Arzt für Hautprobleme (Dermatologin)"],["mild","sanft, nicht stark"],["der Wirkstoff","Stoff, der in einem Produkt etwas bewirkt"],["reizen","die Haut rot, heiss oder unangenehm machen"],["die Narbe","Spur, die nach einer Verletzung auf der Haut bleibt"]],
    mc: [
      { q: "Was sagen Hautärzte über junge Haut?", o: ["Sie braucht viel weniger, als die Werbung sagt","Sie braucht zehn Produkte pro Tag","Sie braucht keine Pflege"], a: 0 },
      { q: "Welches Produkt ist laut Text das wichtigste?", o: ["Die Maske","Die Sonnencreme","Das Serum mit Retinol"], a: 1 },
      { q: "Warum bekommen viele Jugendliche Pickel?", o: ["Wegen der Hormone in der Pubertät","Weil sie zu viel schlafen","Weil sie zu viel Wasser trinken"], a: 0 },
      { q: "Was steht auf der Liste der Inhaltsstoffe zuerst?", o: ["Der teuerste Stoff","Der Stoff, von dem am meisten drin ist","Der Name der Firma"], a: 1 }
    ],
    rf: [
      { s: "Retinol ist vor allem für Erwachsene gedacht.", a: true },
      { s: "Man soll Pickel immer ausdrücken.", a: false, x: "Man soll sie nicht ausdrücken, sonst können Narben bleiben." },
      { s: "Teure Produkte sind automatisch besser.", a: false, x: "Teuer heisst nicht automatisch besser." }
    ],
    offen: [
      { q: "Welche drei Dinge reichen laut Text für die meisten Jugendlichen?", l: "Eine milde Reinigung am Abend, eine einfache Creme bei trockener Haut, Sonnenschutz." },
      { q: "Warum sind lange Skincare-Routinen auf Social Media so beliebt? Was denkst du? Schreibe zwei Sätze.", l: "Individuelle Antwort, z. B.: Influencer machen Werbung, es sieht schön aus, man will dazugehören." }
    ] },

  { id: "wt-parfum", r: "wstyle", typ: "text", texttitel: "Text", titel: "Wie entsteht ein Parfum?", kanal: "Sachtext", dauer: "ca. 190 Wörter",
    kurz: "Ein guter Duft hat drei Teile und kann ganz schön teuer sein. Ein Blick in die Welt der Parfums.",
    vor: "Benutzt du Parfum oder Deo? Welcher Duft gefällt dir?",
    text: "Ein Parfum besteht vor allem aus Alkohol und Duftölen. Die Duftöle stammen aus Blüten, Früchten, Hölzern oder Gewürzen. Viele Düfte werden heute aber auch im Labor hergestellt. Wer Parfums erfindet, heisst Parfümeur oder Parfümeurin. Diese Fachleute können Hunderte verschiedene Gerüche unterscheiden. Man nennt sie deshalb auch «Nasen».\n\nEin Parfum hat drei Teile. Die Kopfnote riecht man sofort nach dem Sprühen. Sie ist frisch, zum Beispiel nach Zitrone, verfliegt aber schnell. Danach kommt die Herznote, oft blumig, zum Beispiel nach Rose oder Jasmin. Am längsten bleibt die Basisnote. Sie riecht zum Beispiel nach Holz, Vanille oder Moschus und hält viele Stunden.\n\nEs gibt Unterschiede in der Stärke. Ein «Eau de Parfum» enthält mehr Duftöl als ein «Eau de Toilette» und hält deshalb länger. Darum ist es meistens auch teurer.\n\nDie Hauptstadt des Parfums ist Grasse, eine kleine Stadt in Südfrankreich. Dort werden seit Jahrhunderten Blumen für Parfums angebaut.\n\nIm Internet werden oft gefälschte Parfums sehr billig verkauft. Sie sehen aus wie das Original, enthalten aber manchmal Stoffe, die die Haut reizen. Ausserdem darf der Zoll gefälschte Ware beschlagnahmen. Ein Tipp: Parfum nicht auf Kleider sprühen, sondern auf den Hals oder das Handgelenk – und nicht reiben.",
    wort: [["das Duftöl","Öl, das sehr stark riecht"],["unterscheiden","merken, dass Dinge verschieden sind"],["verfliegen","verschwinden, nicht mehr da sein"],["gefälscht","nicht echt, kopiert"],["beschlagnahmen","etwas offiziell wegnehmen, z. B. durch die Polizei oder den Zoll"]],
    mc: [
      { q: "Woraus besteht ein Parfum vor allem?", o: ["Aus Wasser und Zucker","Aus Alkohol und Duftölen","Aus Milch und Honig"], a: 1 },
      { q: "Welche Note riecht man sofort nach dem Sprühen?", o: ["Die Kopfnote","Die Herznote","Die Basisnote"], a: 0 },
      { q: "Warum hält ein Eau de Parfum länger als ein Eau de Toilette?", o: ["Es enthält mehr Duftöl","Es ist grösser","Es hat mehr Alkohol"], a: 0 },
      { q: "Welche Stadt gilt als Hauptstadt des Parfums?", o: ["Paris","Grasse","Genf"], a: 1 }
    ],
    rf: [
      { s: "Parfümeure nennt man auch «Nasen».", a: true },
      { s: "Die Basisnote verfliegt am schnellsten.", a: false, x: "Die Basisnote bleibt am längsten. Die Kopfnote verfliegt schnell." },
      { s: "Gefälschte Parfums können die Haut reizen.", a: true }
    ],
    offen: [
      { q: "Beschreibe die drei Teile eines Parfums mit eigenen Worten.", l: "Kopfnote: sofort, frisch, verfliegt schnell. Herznote: danach, oft blumig. Basisnote: bleibt am längsten, z. B. Holz oder Vanille." },
      { q: "Warum ist es keine gute Idee, ein sehr billiges «Marken-Parfum» im Internet zu kaufen? Nenne zwei Gründe.", l: "Es ist wahrscheinlich gefälscht, kann die Haut reizen, der Zoll kann es beschlagnahmen." }
    ] },

  { id: "wt-mercedes", r: "wstyle", typ: "text", texttitel: "Text", titel: "Mercedes-Benz – der Stern auf der Strasse", kanal: "Sachtext", dauer: "ca. 190 Wörter",
    kurz: "Das erste Auto der Welt, ein Mädchenname und ein berühmter Stern: die Geschichte einer Automarke.",
    vor: "Welches Auto findest du am schönsten? Warum?",
    text: "1886 meldete der Deutsche Carl Benz ein Patent für ein Fahrzeug mit Motor an. Sein «Patent-Motorwagen» hatte drei Räder und fuhr etwa 16 Kilometer pro Stunde. Viele sehen darin das erste Auto der Welt. Ungefähr zur gleichen Zeit baute auch Gottlieb Daimler einen Wagen mit Motor.\n\nDer Name «Mercedes» hat eine besondere Geschichte. Ein reicher Geschäftsmann namens Emil Jellinek kaufte um 1900 Autos der Firma Daimler und fuhr damit Rennen. Er nannte sie nach seiner Tochter: Mercédès. Bald hiessen alle Autos der Firma so. 1926 schlossen sich die Firmen von Daimler und Benz zusammen. So entstand der Name Mercedes-Benz.\n\nDas Logo ist ein Stern mit drei Spitzen. Er soll zeigen, dass die Motoren der Firma an Land, auf dem Wasser und in der Luft eingesetzt werden. Der Hauptsitz von Mercedes-Benz ist in Stuttgart.\n\nMercedes ist auch im Motorsport bekannt. Das Formel-1-Team gewann viele Weltmeistertitel. Lewis Hamilton wurde mit Mercedes sechsmal Weltmeister.\n\nHeute steht auch Mercedes vor grossen Veränderungen. Wegen des Klimawandels sollen Autos weniger CO₂ ausstossen. Darum baut die Firma immer mehr Elektroautos. Der berühmte Stern soll bleiben – auch wenn unter der Motorhaube kein Benzin mehr brennt.",
    wort: [["das Patent","Recht, dass nur der Erfinder eine Erfindung nutzen darf"],["sich zusammenschliessen","zu einer Firma oder Gruppe werden"],["das Logo","Zeichen einer Firma"],["der Hauptsitz","der wichtigste Standort einer Firma"],["ausstossen","nach aussen abgeben, z. B. Abgase"]],
    mc: [
      { q: "Wer meldete 1886 ein Patent für ein Fahrzeug mit Motor an?", o: ["Carl Benz","Emil Jellinek","Lewis Hamilton"], a: 0 },
      { q: "Woher kommt der Name «Mercedes»?", o: ["Von einer Stadt in Spanien","Von der Tochter von Emil Jellinek","Von einem Rennfahrer"], a: 1 },
      { q: "Was bedeuten die drei Spitzen des Sterns?", o: ["Land, Wasser und Luft","Rot, Gelb und Grün","Benz, Daimler und Jellinek"], a: 0 },
      { q: "Wo ist der Hauptsitz von Mercedes-Benz?", o: ["In München","In Stuttgart","In Zürich"], a: 1 }
    ],
    rf: [
      { s: "Der Patent-Motorwagen hatte vier Räder.", a: false, x: "Er hatte drei Räder." },
      { s: "1926 schlossen sich die Firmen von Daimler und Benz zusammen.", a: true },
      { s: "Mercedes baut heute immer mehr Elektroautos.", a: true }
    ],
    offen: [
      { q: "Erkläre in zwei Sätzen, wie der Name «Mercedes-Benz» entstanden ist.", l: "Emil Jellinek nannte die Daimler-Autos nach seiner Tochter Mercédès. 1926 schlossen sich Daimler und Benz zusammen, so entstand «Mercedes-Benz»." },
      { q: "Warum bauen Autofirmen heute mehr Elektroautos? Erkläre mit dem Text.", l: "Wegen des Klimawandels sollen Autos weniger CO₂ ausstossen." }

function renderLogin(mode = "login", email = "", msg = "") {
  document.title = "Anmelden · Unterricht Egg";
  const neu = mode === "register";
  app.innerHTML = `
    <div class="login">
      <span class="eyebrow">Deutsch · Französisch · RZG · Berufliche Vorbereitung</span>
      <h1>Unterricht Egg</h1>
      <div class="filters" role="tablist" aria-label="Anmelden oder registrieren">
        <button class="chip" type="button" id="mode-login" aria-pressed="${!neu}">Anmelden</button>
        <button class="chip" type="button" id="mode-register" aria-pressed="${neu}">Zum ersten Mal hier</button>
      </div>
      <form class="block" id="loginform" novalidate>
        <h3>${neu ? "Konto erstellen" : "Anmelden"}</h3>
        <p class="hint">${neu ? "Gib deine Schul-E-Mail-Adresse ein und wähle ein Passwort mit mindestens 6 Zeichen. Merke es dir gut." : "Melde dich mit deiner Schul-E-Mail-Adresse und deinem Passwort an."}</p>
        <label for="login-email">E-Mail-Adresse</label>
        <input id="login-email" type="email" autocomplete="email" required value="${esc(email)}" placeholder="vorname.nachname@schule-wetzikon.ch">
        <label for="login-pw">Passwort</label>
        <input id="login-pw" type="password" autocomplete="${neu ? "new-password" : "current-password"}" required minlength="6">
        ${neu ? `<label for="login-pw2">Passwort wiederholen</label>
        <input id="login-pw2" type="password" autocomplete="new-password" required minlength="6">` : ""}
        <button class="btn" type="submit" id="login-go">${neu ? "Konto erstellen" : "Anmelden"}</button>
        ${neu ? "" : `<p class="hint">Passwort vergessen? Melde dich bei deiner Lehrperson. Sie gibt dir ein neues Passwort, deine Abgaben bleiben erhalten.</p>`}
        <p class="err" id="login-msg" aria-live="polite">${esc(msg)}</p>
      </form>
    </div>`;
  const mailNow = () => document.getElementById("login-email").value.trim().toLowerCase();
  document.getElementById("mode-login").onclick = () => renderLogin("login", mailNow());
  document.getElementById("mode-register").onclick = () => renderLogin("register", mailNow());
  const go = document.getElementById("login-go");
  const out = document.getElementById("login-msg");
  document.getElementById("loginform").onsubmit = async e => {
    e.preventDefault();
    out.textContent = "";
    const mail = mailNow();
    const pw = document.getElementById("login-pw").value;
    if (!/^\S+@\S+\.\S+$/.test(mail)) { out.textContent = "Bitte gib eine gültige E-Mail-Adresse ein."; return; }
    if (pw.length < 6) { out.textContent = "Das Passwort braucht mindestens 6 Zeichen."; return; }
    if (neu && pw !== document.getElementById("login-pw2").value) { out.textContent = "Die beiden Passwörter sind nicht gleich."; return; }
    go.disabled = true; go.textContent = "Einen Moment …";
    try {
      const { data, error } = neu
        ? await sb.auth.signUp({ email: mail, password: pw })
        : await sb.auth.signInWithPassword({ email: mail, password: pw });
      if (error) throw error;
      if (!data.session) throw new Error("no session");
      await loadUser(data.user);
      route();
    } catch (err) {
      go.disabled = false; go.textContent = neu ? "Konto erstellen" : "Anmelden";
      out.textContent = loginError(err, neu);
    }
  };
}
function loginError(err, neu) {
  const m = (err && err.message || "").toLowerCase();
  if (m.includes("already registered") || m.includes("already been registered")) return "Mit dieser E-Mail gibt es schon ein Konto. Wähle oben «Anmelden».";
  if (m.includes("invalid login") || m.includes("invalid credentials")) return "E-Mail oder Passwort ist falsch. Zum ersten Mal hier? Dann wähle oben «Zum ersten Mal hier».";
  if (m.includes("password")) return "Das Passwort ist zu kurz oder zu einfach. Wähle ein anderes mit mindestens 6 Zeichen.";
  if (m.includes("rate")) return "Zu viele Versuche. Bitte warte eine Minute.";
  if (m === "no session") return "Das Konto wurde erstellt, die Anmeldung ist aber noch gesperrt. Bitte melde dich bei deiner Lehrperson.";
  return "Das hat nicht geklappt. Bitte versuche es nochmals. (" + (err && err.message || "unbekannter Fehler") + ")";
}

function spOk(b, it, v) {

  if (b.t === "komma") return v.length === it.k.length && it.k.every(k => v.includes(k));
  if (b.t === "paare") return v === it.k;
  if (b.t === "reihe") return v.length === it.o.length && v.every((x, i) => x === i);
  if (b.t === "rechnen") { const z = spZahl(v); return !isNaN(z) && Math.abs(z - it.k) <= (it.tol || 0) + 1e-9; }
  if (b.t === "offen") return String(v).trim().length >= 10;

  return false;
}
function spFrage(b, it) {

  if (b.t === "luecke") return it.s.replace("{}", "___");

function spRichtig(b, it) {

        ${prev ? `<p class="hint">Du hast diese Station schon abgegeben (beste Abgabe: ${prev.punkte} von ${prev.total} Punkten${hatStufen(u0) ? ", Niveau " + sternStr(stufeVonErgebnis(prev)) : ""}). Du kannst sie nochmals lösen${hatStufen(u0) ? " oder ein anderes Niveau wählen" : ""}.</p>` : ""}

        <h3><span class="step">${u.typ === "text" ? "Wichtige Begriffe" : "Vor dem Hören"}</span></h3>

        ${u.wort?.length ? `<dl class="words">${u.wort.map(w => `<div><dt>${esc(w[0])}</dt><dd>${esc(w[1])}</dd></div>`).join("")}</dl>` : ""}
      </section>` : ""}
      ${u.typ === "text" ? `<section class="block">
        <h3><span class="step">${esc(u.texttitel || "Zusammenfassung")}</span>${u.texttitel ? ` ${esc(u.titel)}` : ""}</h3>
        ${String(u.text).split("\n\n").map(p => `<p class="lesetext">${esc(p)}</p>`).join("")}
      </section>` : `<section class="block">
        <h3><span class="step">Während des Hörens</span></h3>
        <div class="video">${videoHtml(u)}</div>
        <span class="videolink">Video lädt nicht? <a href="https://www.youtube.com/watch?v=${u.yt}" target="_blank" rel="noopener">Auf YouTube öffnen</a></span>
      </section>`}
      <section class="block">
        <h3><span class="step">${u.typ === "text" ? "Fragen" : "Nach dem Hören"}</span> Fragebogen</h3>

        ${u.rf.length ? `<h3 style="font-size:1rem">Richtig oder falsch?</h3>${rf}` : ""}
        ${u.offen.length ? `<h3 style="font-size:1rem">Beantworte in ganzen Sätzen.</h3>${offen}` : ""}
        <div class="actions">

          <span class="score" id="score" aria-live="polite"></span>

          <button class="btn ghost" id="pdf">Meine Antworten als PDF</button>

      </section>` : ""}

  bindTop();
  app.querySelectorAll(".stufe").forEach(b => b.onclick = () => {

    renderUnit(u0);
  });
  const chk = document.getElementById("check");
  if (chk) chk.onclick = () => { check(u); showLoesungen(); };

  if (sub) sub.onclick = () => submit(u, sub);
  document.getElementById("pdf").onclick = () => makePdf(u, true);
