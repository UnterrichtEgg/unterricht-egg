  window.scrollTo(0, 0);
}
function showLoesungen() { document.querySelectorAll(".loesung").forEach(d => d.hidden = false); }

async function submit(u, btn) {
  const ans = readAnswers(u);
  const fehlt = ans.mc.filter(x => x === null).length + ans.rf.filter(x => x === null).length;
  const score = document.getElementById("score");
  if (fehlt && btn.dataset.sicher !== "1") {
    btn.dataset.sicher = "1"; btn.textContent = "Trotzdem abgeben";
    score.textContent = `${fehlt} Frage(n) noch ohne Antwort.`;
    return;
  }
  btn.disabled = true; btn.textContent = "Wird gespeichert …";
  const res = check(u);
  if (u.stufe) ans.stufe = u.stufe;
  const { error } = await sb.from("ergebnisse").insert({ email: S.email, unit_id: u.id, punkte: res.pts, total: res.total, antworten: ans });
  if (error) {
    btn.disabled = false; btn.textContent = "Nochmals abgeben";
    score.textContent = "Speichern fehlgeschlagen. Prüfe die Internetverbindung und versuche es nochmals.";
    return;
  }
  S.myResults.unshift({ unit_id: u.id, punkte: res.pts, total: res.total, stufe: u.stufe || 1, created_at: new Date().toISOString() });
  btn.textContent = "Abgegeben ✓";
  score.textContent = `${res.pts} von ${res.total} Punkten · gespeichert`;
  showLoesungen();
}

function readAnswers(u) {
  const mc = u.mc.map((m, i) => { const el = document.querySelector(`input[name="mc${i}"]:checked`); return el ? +el.value : null; });
  const rf = u.rf.map((r, i) => { const el = document.querySelector(`input[name="rf${i}"]:checked`); return el ? el.value === "true" : null; });
  const of = u.offen.map((o, i) => document.querySelector(`[data-of="${i}"]`).value.trim());
  return { mc, rf, of };
}
const scoreOf = (u, ans) => {
  let pts = 0;
  u.mc.forEach((m, i) => { if (ans.mc[i] === m.a) pts++; });
  u.rf.forEach((r, i) => { if (ans.rf[i] === r.a) pts++; });
  return { pts, total: u.mc.length + u.rf.length };
};

function check(u) {
  const ans = readAnswers(u);
  document.querySelectorAll('[data-type="mc"]').forEach(fs => {
    const i = +fs.dataset.i, m = u.mc[i];
    fs.querySelectorAll(".opt").forEach((l, j) => { l.classList.remove("right", "wrong"); if (j === m.a) l.classList.add("right"); else if (ans.mc[i] === j) l.classList.add("wrong"); });
    const fb = fs.querySelector(".feedback");
    if (ans.mc[i] === m.a) { fb.textContent = "Richtig." + (m.x ? " " + m.x : ""); fb.className = "feedback ok"; }
    else { fb.textContent = (ans.mc[i] === null ? "Keine Antwort gewählt." : "Leider falsch. Die richtige Antwort ist grün markiert.") + (m.x ? " " + m.x : ""); fb.className = "feedback bad"; }
  });
  document.querySelectorAll('[data-type="rf"]').forEach(fs => {
    const i = +fs.dataset.i, r = u.rf[i];
    fs.querySelectorAll(".opt").forEach(l => {
      const v = l.querySelector("input").value === "true";
      l.classList.remove("right", "wrong");
      if (v === r.a) l.classList.add("right"); else if (ans.rf[i] === v) l.classList.add("wrong");
    });
    const fb = fs.querySelector(".feedback");
    if (ans.rf[i] === r.a) { fb.textContent = "Richtig." + (r.x ? " " + r.x : ""); fb.className = "feedback ok"; }
    else { fb.textContent = (ans.rf[i] === null ? "Keine Antwort gewählt." : `Falsch. Die Aussage ist ${r.a ? "richtig" : "falsch"}.`) + (r.x ? " " + r.x : ""); fb.className = "feedback bad"; }
  });
  const res = scoreOf(u, ans);
  document.getElementById("score").textContent = `${res.pts} von ${res.total} Punkten`;
  return res;
}

// ---------------------------------------------------------------- PDF
function makePdf(u, filled) {
  if (!window.jspdf) { document.getElementById("score").textContent = "Der PDF-Export konnte nicht geladen werden. Bitte Seite neu laden."; return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "mm", format: "a4" });
  const W = 210, M = 18, CW = W - 2 * M;
  let y = 20;
  const ans = filled ? readAnswers(u) : null;
  const name = filled ? (S.member?.name || "") : "";
  const need = h => { if (y + h > 280) { doc.addPage(); y = 20; } };
  const text = (s, size = 11, style = "normal", indent = 0) => {
    doc.setFont("helvetica", style); doc.setFontSize(size);
    const lines = doc.splitTextToSize(s, CW - indent);
    const lh = size * 0.45;
    need(lines.length * lh);
    doc.text(lines, M + indent, y); y += lines.length * lh + 1.5;
  };
  const lines = n => { for (let k = 0; k < n; k++) { need(9); y += 8; doc.setDrawColor(170); doc.line(M, y, M + CW, y); } y += 4; };
  text("Unterricht Egg · " + fachName(fachVon(u.r)) + " · " + rubrikName(u.r) + " · " + KUERZEL[u.id], 9);
  text(u.titel + (hatStufen(u) ? "  (Niveau " + (u.stufe || 1) + " von 3: " + STUFE_NAMEN[u.stufe || 1] + ")" : ""), 16, "bold");
  text(u.kanal + (u.yt ? " · youtube.com/watch?v=" + u.yt : " · " + u.dauer), 9);
  y += 2;
  text("Name: " + (name || "______________________________") + "      Datum: " + (filled ? new Date().toLocaleDateString("de-CH") : "______________"), 11);
  y += 3;
  let n = 0;
  if (u.typ === "text") { text(u.texttitel ? u.titel : "Zusammenfassung", 12, "bold"); String(u.text).split("\n\n").forEach(p => text(p, 11)); y += 3; }
  if (u.mc.length) text("Wähle die richtige Antwort.", 12, "bold");
  u.mc.forEach((m, i) => {
    text(`${++n}. ${m.q}`, 11, "bold");
    m.o.forEach((o, j) => text(`${filled && ans.mc[i] === j ? "[x]" : "[  ]"} ${o}`, 11, "normal", 5));
    y += 1.5;
  });
  if (u.rf.length) text("Richtig oder falsch?", 12, "bold");
  u.rf.forEach((r, i) => {
    const v = filled ? ans.rf[i] : null;
    text(`${++n}. ${r.s}`, 11, "bold");
    text(`${v === true ? "[x]" : "[  ]"} richtig     ${v === false ? "[x]" : "[  ]"} falsch`, 11, "normal", 5);
    y += 1.5;
  });
  if (filled) { const res = scoreOf(u, ans); text(`Ergebnis: ${res.pts} von ${res.total} Punkten`, 11, "bold"); y += 2; }
  if (u.offen.length) text("Beantworte in ganzen Sätzen.", 12, "bold");
  u.offen.forEach((o, i) => {
    text(`${++n}. ${o.q}`, 11, "bold");
    if (filled && ans.of[i]) { text(ans.of[i], 11, "normal", 5); y += 2; } else lines(4);
  });
  if (u.info) {
    y += 4; text("Vertiefung: " + u.info.titel, 12, "bold");
    u.info.zeilen.forEach(z => { text(z[0], 10, "bold"); text(z[1], 10, "normal", 5); });
    if (u.info.quelle) text("Quelle: " + u.info.quelle, 8);
  }
  doc.save((filled ? "Antworten_" : "Fragebogen_") + KUERZEL[u.id] + (name ? "_" + name.replace(/[^\wäöüÄÖÜ-]+/g, "_") : "") + ".pdf");
}

// ---------------------------------------------------------------- Lehrpersonen-Ansicht
async function loadTeacherData() {
  const [g, m, e] = await Promise.all([
    sb.from("gruppen").select("id,name").order("name"),
    sb.from("mitglieder").select("email,name,gruppe_id,created_at").order("name"),
    sb.from("ergebnisse").select("id,email,unit_id,punkte,total,antworten,created_at").order("created_at", { ascending: false })
  ]);
  const err = g.error || m.error || e.error;
  S.gruppen = g.data || []; S.mitglieder = m.data || []; S.ergebnisse = e.data || [];
  return err;
}

async function renderTeacher(msg = "") {
  document.title = "Lehrpersonen-Ansicht · Unterricht Egg";
  app.innerHTML = topbar() + `<p class="hint">Daten werden geladen …</p>`;
  bindTop();
  const err = await loadTeacherData();
  const tabs = [["dashboard", "Dashboard"], ["fortschritt", "Tabelle"], ["gruppen", "Gruppen & Mitglieder"]]
    .map(([k, l]) => `<button class="chip" data-tab="${k}" aria-pressed="${S.tab === k}">${l}</button>`).join("");
  app.innerHTML = topbar() + `
    <header class="top">
      <span class="eyebrow">Lehrpersonen-Ansicht</span>
      <h1>Unterricht Egg</h1>
      <p class="lead">${S.mitglieder.length} Schülerinnen und Schüler · ${S.gruppen.length} Gruppen · ${S.ergebnisse.length} Abgaben</p>
    </header>
    ${err ? `<p class="err">Fehler beim Laden: ${esc(err.message)}</p>` : ""}

}

function membersInSel() {
  if (S.gruppeSel === "alle") return S.mitglieder;
  if (S.gruppeSel === "ohne") return S.mitglieder.filter(m => !m.gruppe_id);
  return S.mitglieder.filter(m => m.gruppe_id === S.gruppeSel);
}

// ---------------------------------------------------------------- Dashboard
function statsFor(m) {
  const mine = S.ergebnisse.filter(e => e.email === m.email);
  const bests = UNITS.map(u => bestOf(mine, u.id)).filter(Boolean);
  const avg = bests.length ? Math.round(100 * bests.reduce((s, b) => s + b.punkte / b.total, 0) / bests.length) : null;
  const last = mine.length ? mine.reduce((a, b) => (a.created_at > b.created_at ? a : b)).created_at : null;
  return { mine, done: bests.length, avg, last, versuche: mine.length };
}
const pctClass = p => p == null ? "" : p >= 80 ? "good" : p >= 50 ? "mid" : "low";
function relDate(d) {
  if (!d) return "noch nie";
  const diff = (Date.now() - new Date(d).getTime()) / 86400000;
  if (diff < 1 && new Date(d).toDateString() === new Date().toDateString()) return "heute";
  if (diff < 2) return "gestern";
  if (diff < 7) return `vor ${Math.floor(diff)} Tagen`;
  return new Date(d).toLocaleDateString("de-CH");
}
function groupSelectHtml() {
  return [["alle", "Alle Gruppen"], ...S.gruppen.map(g => [g.id, g.name]), ["ohne", "Ohne Gruppe"]]
    .map(([v, l]) => `<option value="${esc(v)}" ${S.gruppeSel === v ? "selected" : ""}>${esc(l)}</option>`).join("");
}

function renderDashboard() {
  const body = document.getElementById("tabbody");
  const mem = membersInSel();
  const rows = mem.map(m => ({ m, ...statsFor(m) }));
  const key = S.sort || "fortschritt";
  const cmp = {
    name: (a, b) => a.m.name.localeCompare(b.m.name, "de"),
    fortschritt: (a, b) => b.done - a.done || a.m.name.localeCompare(b.m.name, "de"),
    punkte: (a, b) => (b.avg ?? -1) - (a.avg ?? -1),
    aktiv: (a, b) => String(b.last || "").localeCompare(String(a.last || ""))
  }[key];
  rows.sort(cmp);

  const n = rows.length;
  const abgaben = rows.reduce((s, r) => s + r.versuche, 0);
  const avgDone = n ? rows.reduce((s, r) => s + r.done, 0) / n : 0;
  const scored = rows.filter(r => r.avg != null);
  const avgPct = scored.length ? Math.round(scored.reduce((s, r) => s + r.avg, 0) / scored.length) : null;
  const woche = rows.filter(r => r.last && Date.now() - new Date(r.last).getTime() < 7 * 86400000).length;
  const nie = rows.filter(r => r.done === 0).length;

  const rubrikBars = RUBRIKEN.filter(r => UNITS.some(u => u.r === r.key)).map(r => {
    const units = UNITS.filter(u => u.r === r.key);
    const total = units.length * n;
    const done = rows.reduce((s, row) => s + units.filter(u => row.mine.some(e => e.unit_id === u.id)).length, 0);
    const p = total ? Math.round(100 * done / total) : 0;
    return `<div class="rbar" style="--r: var(--${r.key})">
      <span class="rname">${r.name}</span>
      <span class="track"><span class="fill" style="width:${p}%"></span></span>
      <span class="rval">${p} %</span></div>`;
  }).join("");

  const sortBtn = (k, l) => `<button class="sortbtn" data-sort="${k}" aria-pressed="${key === k}">${l}</button>`;
  const gname = id => S.gruppen.find(g => g.id === id)?.name || "Ohne Gruppe";

  const list = rows.map(r => {
    const p = Math.round(100 * r.done / UNITS.length);
    const open = S.offen === r.m.email;
    return `
    <li class="prow ${r.done === 0 ? "idle" : ""}">
      <button class="phead" data-open="${esc(r.m.email)}" aria-expanded="${open}">
        <span class="pname">${esc(r.m.name)}<span>${esc(gname(r.m.gruppe_id))}</span></span>
        <span class="pprog">
          <span class="track"><span class="fill" style="width:${p}%"></span></span>
          <span class="pnum">${r.done}/${UNITS.length}</span>
        </span>
        <span class="pavg ${pctClass(r.avg)}">${r.avg == null ? "–" : r.avg + " %"}</span>
        <span class="plast">${relDate(r.last)}</span>
      </button>
      ${open ? `<div class="pdetail">
        ${RUBRIKEN.filter(rb => UNITS.some(u => u.r === rb.key)).map(rb => `
          <div class="prub" style="--r: var(--${rb.key})"><span class="tag">${rb.name}</span>
            <div class="chips">${UNITS.filter(u => u.r === rb.key).map(u => {
              const b = bestOf(r.mine, u.id);
              return b
                ? `<button class="cell ${pillClass(b)}" data-email="${esc(r.m.email)}" data-unit="${u.id}" title="${esc(u.titel)}">${KUERZEL[u.id]} · ${b.punkte}/${b.total}${sternTag(u, b)}</button>`
                : `<span class="cell todo" title="${esc(u.titel)}">${KUERZEL[u.id]}</span>`;
            }).join("")}</div></div>`).join("")}
        ${SPIELE.map(g => { const b = bestOf(r.mine, g.id), n = r.mine.filter(e => e.unit_id === g.id).length;
          return `<div class="prub" style="--r: var(--${g.r})"><span class="tag">${esc(g.name)} (RZG)</span>
            <div class="chips">${b ? `<button class="cell ${pillClass(b)}" data-email="${esc(r.m.email)}" data-unit="${g.id}" title="${esc(g.titel)}">${g.kz} · ${b.punkte}/${b.total}</button><span class="hint">${n}× gespielt</span>` : `<span class="cell todo" title="${esc(g.titel)}">${g.kz}</span>`}</div></div>`; }).join("")}
        <p class="hint">Klicken Sie auf eine erledigte Station, um die Antworten zu sehen. ${r.versuche} Abgaben insgesamt.</p>
      </div>` : ""}
    </li>`;
  }).join("");

  body.innerHTML = `
    <div class="toolbar">
      <label for="gsel">Gruppe</label>
      <select id="gsel">${groupSelectHtml()}</select>
      <button class="btn ghost" id="reload">Aktualisieren</button>
    </div>
    ${n ? `
    <div class="kpis">
      <div class="kpi"><span class="kv">${n}</span><span class="kl">Teilnehmende</span></div>
      <div class="kpi"><span class="kv">${avgDone.toFixed(1).replace(".", ",")}<small> / ${UNITS.length}</small></span><span class="kl">Ø erledigte Stationen</span></div>
      <div class="kpi"><span class="kv ${pctClass(avgPct)}">${avgPct == null ? "–" : avgPct + " %"}</span><span class="kl">Ø Punkte</span></div>
      <div class="kpi"><span class="kv">${woche}</span><span class="kl">aktiv in den letzten 7 Tagen</span></div>
      <div class="kpi ${nie ? "warn" : ""}"><span class="kv">${nie}</span><span class="kl">noch nichts abgegeben</span></div>
    </div>
    <section class="block">
      <h3>Fortschritt nach Rubrik</h3>
      <div class="rbars">${rubrikBars}</div>
    </section>
    <section class="block">
      <div class="listhead"><h3>Teilnehmende</h3>
        <div class="sorts" role="group" aria-label="Sortieren">Sortieren: ${sortBtn("fortschritt", "Fortschritt")}${sortBtn("punkte", "Punkte")}${sortBtn("aktiv", "Zuletzt aktiv")}${sortBtn("name", "Name")}</div>

      <div class="pcols" aria-hidden="true"><span>Name</span><span>Fortschritt</span><span>Ø Punkte</span><span>Zuletzt aktiv</span></div>

    </section>`
    : `<p class="note">In dieser Auswahl gibt es noch keine Schülerinnen und Schüler. Sie erscheinen hier, sobald sie sich registriert haben oder Sie sie unter «Gruppen & Mitglieder» hinzufügen.</p>`}
    <div id="detail"></div>`;

  document.getElementById("gsel").onchange = e => { S.gruppeSel = e.target.value; S.detail = null; S.offen = null; renderDashboard(); };
  document.getElementById("reload").onclick = () => renderTeacher();
  body.querySelectorAll("[data-sort]").forEach(b => b.onclick = () => { S.sort = b.dataset.sort; renderDashboard(); });
  body.querySelectorAll("[data-open]").forEach(b => b.onclick = () => { S.offen = S.offen === b.dataset.open ? null : b.dataset.open; S.detail = null; renderDashboard(); });
  body.querySelectorAll(".cell[data-unit]").forEach(c => c.onclick = () => { S.detail = { email: c.dataset.email, unit: c.dataset.unit }; renderDetail(); });
  if (S.detail) renderDetail();
}

function renderFortschritt() {
  const body = document.getElementById("tabbody");
  const opts = groupSelectHtml();
  const mem = membersInSel();
  const head = ORDERED.map(u => `<th title="${esc(u.titel)}" style="--r: var(--${u.r})"><span class="colk">${KUERZEL[u.id]}</span></th>`).join("") + SPIELE.map(g => `<th title="${esc(g.name)}" style="--r: var(--${g.r})"><span class="colk">${g.kz}</span></th>`).join("");
  const rows = mem.map(m => {
    const mine = S.ergebnisse.filter(e => e.email === m.email);
    const done = UNITS.filter(u => mine.some(e => e.unit_id === u.id)).length;
    const cells = ORDERED.map(u => {
      const b = bestOf(mine, u.id);
      if (!b) return `<td class="empty">–</td>`;
      return `<td><button class="cell ${pillClass(b)}" data-email="${esc(m.email)}" data-unit="${u.id}" title="${esc(u.titel)}">${b.punkte}/${b.total}${sternTag(u, b)}</button></td>`;
    }).join("") + SPIELE.map(g => (b => b ? `<td><button class="cell ${pillClass(b)}" data-email="${esc(m.email)}" data-unit="${g.id}" title="${esc(g.name)}">${b.punkte}/${b.total}</button></td>` : `<td class="empty">–</td>`)(bestOf(mine, g.id))).join("");
    return `<tr><th scope="row" class="sname">${esc(m.name)}<span>${esc(m.email)}</span></th><td class="sum">${done}/${UNITS.length}</td>${cells}</tr>`;
  }).join("");
  body.innerHTML = `
    <div class="toolbar">
      <label for="gsel">Gruppe</label>
      <select id="gsel">${opts}</select>
      <button class="btn ghost" id="reload">Aktualisieren</button>
    </div>
    ${mem.length ? `
    <div class="tablewrap"><table class="matrix">
      <thead><tr><th>Name</th><th>Erledigt</th>${head}</tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <p class="hint">Angezeigt wird die beste Abgabe pro Station. Die Sterne zeigen das gewählte Niveau (★ einfach, ★★ mittel, ★★★ schwierig). Klicken Sie auf eine Zelle, um die Antworten zu sehen.</p>
    <details class="legend"><summary>Kürzel der Stationen</summary>
      <ul>${ORDERED.map(u => `<li><strong>${KUERZEL[u.id]}</strong> ${esc(u.titel)}</li>`).join("")}${SPIELE.map(g => `<li><strong>${g.kz}</strong> ${esc(g.name)} (RZG, beste Runde)</li>`).join("")}</ul></details>`
    : `<p class="note">In dieser Auswahl gibt es noch keine Schülerinnen und Schüler. Unter «Gruppen & Mitglieder» können Sie welche hinzufügen, oder sie melden sich selbst an.</p>`}
    <div id="detail"></div>`;
  document.getElementById("gsel").onchange = e => { S.gruppeSel = e.target.value; S.detail = null; renderFortschritt(); };
  document.getElementById("reload").onclick = () => renderTeacher();
  body.querySelectorAll(".cell").forEach(c => c.onclick = () => { S.detail = { email: c.dataset.email, unit: c.dataset.unit }; renderDetail(); });
  if (S.detail) renderDetail();
}

function renderDetail() {
  const box = document.getElementById("detail");
  const { email, unit } = S.detail;
  const spielG = spielById(unit);
  if (spielG) {
    const m = S.mitglieder.find(x => x.email === email);
    const tries = S.ergebnisse.filter(e => e.email === email && e.unit_id === unit);
    const fmt = d => new Date(d).toLocaleString("de-CH", { dateStyle: "medium", timeStyle: "short" });
    box.innerHTML = `
    <section class="block detail" style="--r: var(--${spielG.r})">
      <div class="detailhead"><div><span class="tag">${spielG.kz} · ${esc(spielG.name)} (RZG)</span>
        <h3>${esc(m?.name || email)}: ${esc(spielG.titel)}</h3></div>
        <button class="linkbtn" id="closedetail">Schliessen</button></div>
      ${tries.map((t, k) => { const st = (t.antworten && t.antworten.sterne) || [];
        return `<div class="try"><p class="trymeta"><strong>Spiel ${tries.length - k}</strong> · ${fmt(t.created_at)} · ${t.punkte} von ${t.total} Punkten${t.antworten && t.antworten.niveau ? " · " + esc(t.antworten.niveau) : ""}</p>
        ${st.length ? `<p class="hint">Sterne pro Station: ${st.map((x, i) => `${i + 1}&nbsp;${"★".repeat(x)}${"☆".repeat(3 - x)}`).join(" · ")}</p>` : ""}</div>`; }).join("")}
    </section>`;
    document.getElementById("closedetail").onclick = () => { S.detail = null; box.innerHTML = ""; };
    box.scrollIntoView({ behavior: "smooth", block: "start" });
    return;
  }
  const u = UNITS.find(x => x.id === unit);
  const m = S.mitglieder.find(x => x.email === email);
  const tries = S.ergebnisse.filter(e => e.email === email && e.unit_id === unit);
  const fmt = d => new Date(d).toLocaleString("de-CH", { dateStyle: "medium", timeStyle: "short" });
  box.innerHTML = `
    <section class="block detail" style="--r: var(--${u.r})">
      <div class="detailhead"><div><span class="tag">${KUERZEL[u.id]} · ${rubrikName(u.r)}</span>
        <h3>${esc(m?.name || email)}: ${esc(u.titel)}</h3></div>
        <button class="linkbtn" id="closedetail">Schliessen</button></div>
      ${tries.map((t, k) => {
        const a = t.antworten || { mc: [], rf: [], of: [] };
        const uu = effUnit(u, stufeVonErgebnis(t));
        let n = 0;
        return `<div class="try">
          <p class="trymeta"><strong>Abgabe ${tries.length - k}</strong> · ${fmt(t.created_at)} · ${t.punkte} von ${t.total} Punkten${hatStufen(u) ? ` · Niveau ${sternStr(uu.stufe)} (${STUFE_NAMEN[uu.stufe]})` : ""}</p>
          <ol class="answers">
            ${uu.mc.map((q, i) => { n++; const g = a.mc?.[i]; const ok = g === q.a;
              return `<li class="${ok ? "ok" : "bad"}"><span>${esc(q.q)}</span><span>${g == null ? "keine Antwort" : esc(q.o[g])}${ok ? "" : ` → richtig: ${esc(q.o[q.a])}`}</span></li>`; }).join("")}
            ${uu.rf.map((q, i) => { n++; const g = a.rf?.[i]; const ok = g === q.a;
              return `<li class="${ok ? "ok" : "bad"}"><span>${esc(q.s)}</span><span>${g == null ? "keine Antwort" : g ? "richtig" : "falsch"}${ok ? "" : ` → korrekt wäre: ${q.a ? "richtig" : "falsch"}`}</span></li>`; }).join("")}
            ${uu.typ === "sprache" ? spDetail(uu, a) : ""}
            ${uu.offen.map((q, i) => { n++;
              return `<li class="open"><span>${esc(q.q)}</span><span class="openans">${a.of?.[i] ? esc(a.of[i]) : "<em>keine Antwort</em>"}</span></li>`; }).join("")}
          </ol>
        </div>`; }).join("")}
    </section>`;
  document.getElementById("closedetail").onclick = () => { S.detail = null; box.innerHTML = ""; };
  box.scrollIntoView({ behavior: "smooth", block: "start" });
}

function renderGruppen() {
  const body = document.getElementById("tabbody");
  const groupOpts = sel => [`<option value="">Ohne Gruppe</option>`, ...S.gruppen.map(g => `<option value="${g.id}" ${sel === g.id ? "selected" : ""}>${esc(g.name)}</option>`)].join("");
  const memberRow = m => `
    <li class="mrow">
      <span class="mname">${esc(m.name)}<span>${esc(m.email)}</span></span>
      <label class="sr" for="mv-${esc(m.email)}">Gruppe von ${esc(m.name)}</label>
      <select id="mv-${esc(m.email)}" data-move="${esc(m.email)}">${groupOpts(m.gruppe_id)}</select>
      <button class="linkbtn" data-pw="${esc(m.email)}" data-name="${esc(m.name)}">Passwort zurücksetzen</button>
      <button class="linkbtn danger" data-del-m="${esc(m.email)}">Entfernen</button>
    </li>`;
  const block = (g, list) => `
    <section class="block gblock">
      <div class="ghead">
        ${g ? `<input class="gname" id="gn-${g.id}" value="${esc(g.name)}" aria-label="Gruppenname">
               <button class="linkbtn" data-ren="${g.id}">Umbenennen</button>
               <button class="linkbtn danger" data-del-g="${g.id}">Gruppe löschen</button>`
            : `<h3>Ohne Gruppe</h3><span class="hint">Selbst angemeldet, noch keiner Gruppe zugeordnet</span>`}
      </div>
      ${list.length ? `<ul class="mlist">${list.map(memberRow).join("")}</ul>` : `<p class="hint">Noch keine Mitglieder.</p>`}
      ${g ? `<form class="addm" data-add="${g.id}" novalidate>
          <label class="sr" for="an-${g.id}">Name</label><input id="an-${g.id}" placeholder="Vorname Nachname" required>
          <label class="sr" for="ae-${g.id}">E-Mail</label><input id="ae-${g.id}" type="email" placeholder="schul-e-mail@schule.ch" required>
          <button class="btn" type="submit">Hinzufügen</button>
        </form>` : ""}
    </section>`;
  body.innerHTML = `
    <form class="block newg" id="newg" novalidate>
      <label for="newg-name"><strong>Neue Gruppe</strong></label>
      <div class="row"><input id="newg-name" placeholder="z. B. 3. Sek B, Gruppe 1" required><button class="btn" type="submit">Gruppe erstellen</button></div>
    </form>
    ${S.gruppen.map(g => block(g, S.mitglieder.filter(m => m.gruppe_id === g.id))).join("")}
    ${block(null, S.mitglieder.filter(m => !m.gruppe_id))}`;

  const act = async (p, ok) => { const { error } = await p; renderTeacher(error ? "" : ok).then(() => { if (error) document.querySelector("#tabbody").insertAdjacentHTML("afterbegin", `<p class="err">${esc(error.message)}</p>`); }); };
  document.getElementById("newg").onsubmit = e => {
    e.preventDefault();
    const name = document.getElementById("newg-name").value.trim();
    if (name) act(sb.from("gruppen").insert({ name }), `Gruppe «${name}» erstellt.`);
  };
  body.querySelectorAll("[data-ren]").forEach(b => b.onclick = () => {
    const name = document.getElementById("gn-" + b.dataset.ren).value.trim();
    if (name) act(sb.from("gruppen").update({ name }).eq("id", b.dataset.ren), "Gruppe umbenannt.");
  });
  body.querySelectorAll("[data-del-g]").forEach(b => b.onclick = () => confirmed(b, "Wirklich löschen?", () =>
    act(sb.from("gruppen").delete().eq("id", b.dataset.delG), "Gruppe gelöscht. Die Mitglieder sind jetzt «Ohne Gruppe».")));
  body.querySelectorAll("[data-del-m]").forEach(b => b.onclick = () => confirmed(b, "Wirklich entfernen?", () =>
    act(sb.from("mitglieder").delete().eq("email", b.dataset.delM), "Mitglied entfernt. Die Abgaben bleiben gespeichert.")));
  body.querySelectorAll("[data-pw]").forEach(b => b.onclick = () => confirmed(b, "Neues Passwort erzeugen?", () => resetPw(b)));
  body.querySelectorAll("[data-move]").forEach(s => s.onchange = () =>
    act(sb.from("mitglieder").update({ gruppe_id: s.value || null }).eq("email", s.dataset.move), "Gruppe geändert."));
  body.querySelectorAll("[data-add]").forEach(f => f.onsubmit = e => {
    e.preventDefault();
    const gid = f.dataset.add;
    const name = document.getElementById("an-" + gid).value.trim();
    const email = document.getElementById("ae-" + gid).value.trim().toLowerCase();
    if (!name || !/^\S+@\S+\.\S+$/.test(email)) { f.insertAdjacentHTML("afterend", `<p class="err">Bitte Name und gültige E-Mail eingeben.</p>`); return; }
    const exists = S.mitglieder.find(m => m.email === email);
    act(exists ? sb.from("mitglieder").update({ name, gruppe_id: gid }).eq("email", email)
               : sb.from("mitglieder").insert({ email, name, gruppe_id: gid }), `${name} hinzugefügt.`);
  });
}
function neuesPasswort() {
  const w = ["Sonne", "Berg", "Fluss", "Wolke", "Tiger", "Apfel", "Stern", "Blume", "Adler", "Insel", "Wald", "Regen"];
  const r = new Uint32Array(2); crypto.getRandomValues(r);
  return w[r[0] % w.length] + "-" + String(1000 + (r[1] % 9000));
}
async function resetPw(btn) {
  const email = btn.dataset.pw, name = btn.dataset.name;
  const row = btn.closest(".mrow");
  row.querySelector(".pwbox")?.remove();
  const pw = neuesPasswort();
  btn.disabled = true;
  const { data, error } = await sb.rpc("lp_passwort_setzen", { p_email: email, p_passwort: pw });
  btn.disabled = false; btn.textContent = "Passwort zurücksetzen"; btn.dataset.armed = "";
  const box = document.createElement("div");
  box.className = "pwbox";
  if (error) {
    box.innerHTML = `<p class="err">Zurücksetzen hat nicht geklappt: ${esc(error.message)}</p>`;
  } else if (!data) {
    box.innerHTML = `<p class="hint">${esc(name)} hat noch kein Konto. Die Person registriert sich über «Zum ersten Mal hier» und wählt dabei selbst ein Passwort.</p>`;
  } else {
    box.innerHTML = `<p>Neues Passwort für <strong>${esc(name)}</strong>:</p>
      <p class="pwval">${esc(pw)}</p>
      <p class="hint">Geben Sie es der Person weiter. Sie meldet sich mit ${esc(email)} und diesem Passwort an. Das Passwort wird nur jetzt angezeigt.</p>`;
  }
  row.appendChild(box);
}
function confirmed(btn, label, fn) {
  if (btn.dataset.armed === "1") return fn();
  btn.dataset.armed = "1"; const old = btn.textContent; btn.textContent = label;
  setTimeout(() => { btn.dataset.armed = ""; btn.textContent = old; }, 4000);
}

// ---------------------------------------------------------------- Routing
function route() {
  if (!S.email) return renderLogin();
  const id = location.hash.replace("#", "");
  if (S.isTeacher) {
    const u = UNITS.find(x => x.id === id);
    if (u) return renderUnit(u);
    if (id === "faecher" || id === "stationen") return renderFaecher();
    if (id.startsWith("fach-")) return renderFach(...id.slice(5).split("-"));
    if (id.startsWith("karten-")) return renderKarten(id.slice(7));
    if (id.startsWith("seekarte-")) return renderSeekarte(decodeURIComponent(id.slice(9)));
    return renderTeacher();
  }
  if (!S.member) return renderName();
  const u = UNITS.find(x => x.id === id);
  if (u) return renderUnit(u);
  if (id.startsWith("fach-")) return renderFach(...id.slice(5).split("-"));
  if (id.startsWith("karten-")) return renderKarten(id.slice(7));
  if (id.startsWith("seekarte-")) return renderSeekarte(decodeURIComponent(id.slice(9)));
  renderFaecher();
}
window.addEventListener("hashchange", () => { if (S.email) route(); });

async function boot() {
  if (!sb) return renderSetup();
  app.innerHTML = `<p class="hint">Wird geladen …</p>`;
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return renderLogin();
  try { await loadUser(session.user); } catch (e) { return renderLogin("login", "", "Anmeldung abgelaufen. Bitte neu anmelden."); }
  route();
}
boot();

</script>
