<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unterricht Egg</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="stufen.js"></script>

<script src="beruf.js"></script>
<style>
/* Layout: Werkstatt-Übersicht mit Rubrik-Filter → Hörstation (Video oben, Fragebogen darunter) */
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --ink: #1c2530;
  --muted: #5b6875;
  --line: #d9dfe5;
  --accent: #2847c9;
  --sport: #1f7a4d;
  --gesellschaft: #b3541e;
  --geschichte: #8a2d3b;
  --biologie: #0f6f78;
  --beruf: #6a3fb0;
  --welt: #9a6a00;
  --deutsch: #2847c9;
  --franz: #1d5fa8;
  --rzg: #2f7d3a;
  --bv: #8a5a00;
  --blog: #8a5a00;
  --bfage: #0f7c8c;
  --expg: #2f7d3a;
  --expe: #b4531c;
  --polit: #c8102e;
  --frankreich: #1d5fa8;
  --romandie: #c0392b;
  --decouvertes: #7a4fb5;
  --histoires: #0f7b6c;
  --lsport: #1f7a4d;
  --lberuf: #6a3fb0;
  --lgesell: #b3541e;
  --lnatur: #0f6f78;
  --wsport: #b42318;
  --wwelt: #9a6a00;
  --wstyle: #b0306a;
  --wtech: #2847c9;
  --rrecht: #0f6f78;
  --rgramm: #b0306a;
  --ok: #1f7a4d;
  --bad: #b42318;
  --okbg: #e3f3ea;
  --badbg: #fbe7e5;
  --mid: #8a5a00;
  --midbg: #fdf1d8;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12171d; --surface: #1b222a; --ink: #e8edf2; --muted: #9aa7b4; --line: #2e3843;
    --accent: #8aa2ff; --sport: #5cc492; --gesellschaft: #f0965e; --geschichte: #e88a98; --biologie: #5ccbd4; --beruf: #b79cff; --welt: #e4b54a; --deutsch: #8aa2ff; --franz: #7fb8ff; --rzg: #7fd08c; --bv: #f0b44c; --blog: #f0b44c; --bfage: #5ccbd4; --expg: #7fd08c; --expe: #f08d4f; --polit: #ff6b7d; --frankreich: #7fb8ff; --romandie: #f29b8f; --decouvertes: #b79cff; --histoires: #5ccbb8; --lsport: #5cc492; --lberuf: #b79cff; --lgesell: #f0965e; --lnatur: #5ccbd4; --wsport: #f0857a; --wwelt: #e4b54a; --wstyle: #f08dbd; --wtech: #8aa2ff; --rrecht: #5ccbd4; --rgramm: #f08dbd;
    --ok: #5cc492; --bad: #ff8a80; --okbg: #17332a; --badbg: #3a1f1d; --mid: #f0c060; --midbg: #3a2f14; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12171d; --surface: #1b222a; --ink: #e8edf2; --muted: #9aa7b4; --line: #2e3843;
  --accent: #8aa2ff; --sport: #5cc492; --gesellschaft: #f0965e; --geschichte: #e88a98; --biologie: #5ccbd4; --beruf: #b79cff; --welt: #e4b54a; --deutsch: #8aa2ff; --franz: #7fb8ff; --rzg: #7fd08c; --bv: #f0b44c; --blog: #f0b44c; --bfage: #5ccbd4; --expg: #7fd08c; --expe: #f08d4f; --polit: #ff6b7d; --frankreich: #7fb8ff; --romandie: #f29b8f; --decouvertes: #b79cff; --histoires: #5ccbb8; --lsport: #5cc492; --lberuf: #b79cff; --lgesell: #f0965e; --lnatur: #5ccbd4; --wsport: #f0857a; --wwelt: #e4b54a; --wstyle: #f08dbd; --wtech: #8aa2ff; --rrecht: #5ccbd4; --rgramm: #f08dbd;
  --ok: #5cc492; --bad: #ff8a80; --okbg: #17332a; --badbg: #3a1f1d; --mid: #f0c060; --midbg: #3a2f14; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.55;
}
.wrap {
  max-width: 1080px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 64px;
}
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: clamp(2rem, 5vw, 3rem); font-weight: 800; letter-spacing: -0.02em; }
h2 { font-size: 1.6rem; font-weight: 700; }
h3 { font-size: 1.15rem; font-weight: 700; }
a { color: var(--accent); }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

header.top { display: grid; gap: 10px; margin-bottom: 24px; }
.eyebrow { font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.lead { max-width: 62ch; color: var(--muted); margin: 0; }

.filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 22px; }
.chip {
  border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 6px 14px; cursor: pointer; font-weight: 700; font-size: .92rem;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.rubrik { margin-bottom: 30px; }
.rubrik > h2 { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.rubrik > h2::before { content: ""; width: 14px; height: 14px; border-radius: 3px; background: var(--r); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.card {
  display: grid; gap: 8px; align-content: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-top: 5px solid var(--r);
  border-radius: 10px; padding: 16px; cursor: pointer; min-width: 0;
}
.card:hover { border-color: var(--r); }
.card .meta { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.card p { margin: 0; font-size: .95rem; color: var(--muted); }
.lesetext { margin: 0; font-size: 1.05rem; line-height: 1.6; max-width: 70ch; }
.lesetext + .lesetext { margin-top: .8em; }
.karte { min-height: 200px; display: grid; place-items: center; text-align: center; font-size: 1.25rem; padding: 28px; cursor: pointer;
  border: 2px solid var(--r); border-radius: 16px; background: var(--surface); width: 100%; max-width: 640px; color: var(--ink); }
.karte b { font-size: 1.5rem; }
a.btn { display: inline-block; text-decoration: none; }
.seekarte { display: block; width: 100%; height: 900px; border: 0; border-radius: 12px; background: var(--surface); }
.kartenlinks { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 18px; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; margin-top: 8px; }
.fcard { padding: 22px 20px; gap: 10px; }
.fcard h3 { font-size: 1.5rem; margin: 0; }
.fcard .fstat { font-weight: 700; font-size: .92rem; color: var(--ink); }
.fcard.empty { border-top-style: dashed; }
.tag { font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--r); }

.note {
  background: var(--surface); border: 1px dashed var(--line); border-radius: 10px;
  padding: 14px 16px; font-size: .92rem; color: var(--muted); max-width: 75ch;
}

/* Hörstation */
.back { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; font-weight: 700; margin-bottom: 14px; }
.station { display: grid; gap: 22px; }
.station-head { display: grid; gap: 6px; }
.video {
  position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 9;
  background: #000; border-radius: 10px; overflow: hidden;
}
.video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.videolink { font-size: .9rem; color: var(--muted); }
.poster { position: absolute; inset: 0; display: block; color: #fff; text-decoration: none; }
.poster img { width: 100%; height: 100%; object-fit: cover; opacity: .75; }
.poster .play {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 76px; height: 54px; border-radius: 14px; background: #d40000;
  display: grid; place-items: center; font-size: 26px;
}
.poster .posternote {
  position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 14px;
  background: rgba(0,0,0,.65); font-weight: 700; font-size: .95rem;
}
.localhint { border-left: 4px solid var(--accent); background: var(--bg); padding: 10px 14px; border-radius: 6px; font-size: .92rem; margin: 0; }
.block {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 18px; display: grid; gap: 14px; min-width: 0;
}
.block > h3 { display: flex; gap: 8px; align-items: baseline; }
.step { font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: var(--r); font-weight: 700; }
.q { display: grid; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
.q:first-of-type { border-top: 0; padding-top: 0; }
.q legend { font-weight: 700; padding: 0; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 6px 10px; border-radius: 8px; cursor: pointer; }
.opt input { margin-top: 5px; accent-color: var(--accent); }
.opt.right { background: var(--okbg); }
.opt.wrong { background: var(--badbg); }
.rf { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; }
.rf .opt { padding: 4px 8px; }
textarea {
  width: 100%; min-height: 84px; border: 1.5px solid var(--line); border-radius: 8px;
  padding: 10px; background: var(--bg); resize: vertical;
}
details summary { cursor: pointer; color: var(--accent); font-weight: 700; font-size: .92rem; }
details p { margin: 6px 0 0; color: var(--muted); }
.feedback { font-weight: 700; font-size: .92rem; }
.feedback.ok { color: var(--ok); } .feedback.bad { color: var(--bad); }
.sp legend { line-height: 1.5; }
.spgap { color: var(--muted); letter-spacing: 1px; }
.spword { font-weight: 700; color: var(--r, var(--accent)); text-decoration: underline; text-underline-offset: 3px; }
.sphint { margin: 2px 0 6px; color: var(--muted); font-size: .95rem; }
.spin { font: inherit; width: 8.5em; max-width: 60%; padding: 2px 6px; margin: 0 4px; border: 1px solid var(--line); border-bottom: 2px solid var(--muted); border-radius: 6px; background: var(--surface); color: var(--ink); }
.spline { font: inherit; width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
.spin.right, .spline.right { border-color: var(--ok); background: var(--okbg); }
.spin.wrong, .spline.wrong { border-color: var(--bad); background: var(--badbg); }
.sptoks { line-height: 2.5; margin: 2px 0 4px; font-size: 1.05rem; }
.tok { font: inherit; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 1px 6px; border-radius: 6px; cursor: pointer; }
.tok[aria-pressed="true"] { background: var(--midbg); border-color: var(--mid); }
.tok.right { background: var(--okbg); border-color: var(--ok); }
.tok.wrong { background: var(--badbg); border-color: var(--bad); }
.spsel { font: inherit; max-width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
.spsel.right { border-color: var(--ok); background: var(--okbg); } .spsel.wrong { border-color: var(--bad); background: var(--badbg); }
.paar { display: grid; grid-template-columns: minmax(8em, 1fr) 2fr; gap: 8px 12px; align-items: center; }
@media (max-width: 600px) { .paar { grid-template-columns: 1fr; } }
.reihe { display: grid; gap: 6px; margin: 6px 0; }
.rstep { font: inherit; text-align: left; display: flex; gap: 10px; align-items: center; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 8px 10px; border-radius: 10px; cursor: pointer; }
.rstep .nr { flex: none; width: 1.8em; height: 1.8em; border-radius: 50%; display: grid; place-items: center; border: 1.5px dashed var(--muted); font-weight: 700; }
.rstep[data-pos] .nr { border-style: solid; border-color: var(--accent); background: var(--accent); color: #fff; }
.rstep.right { border-color: var(--ok); background: var(--okbg); } .rstep.wrong { border-color: var(--bad); background: var(--badbg); }
.rreset { font: inherit; font-size: .9rem; background: none; border: 0; color: var(--accent); text-decoration: underline; cursor: pointer; padding: 0; }
.sptext { font: inherit; width: 100%; min-height: 5.5em; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
.sptext.right { border-color: var(--ok); }
.spunit { margin-left: 2px; }
.mtext { line-height: 2.1; }
.mtok { font: inherit; border: 1px dashed var(--muted); background: var(--surface); color: var(--ink); padding: 1px 6px; border-radius: 6px; cursor: pointer; }
.mtok[aria-pressed="true"] { background: var(--midbg); border-style: solid; border-color: var(--mid); }
.mtok.right { background: var(--okbg); border-color: var(--ok); border-style: solid; } .mtok.wrong { background: var(--badbg); border-color: var(--bad); border-style: solid; }
.mtok.fehlt { outline: 2px dashed var(--ok); }
.lernbox { background: var(--surface); border-left: 4px solid var(--r, var(--accent)); padding: 10px 14px; border-radius: 8px; margin: 10px 0; }
.gap { display: inline-block; width: 18px; height: 1.7em; vertical-align: middle; margin: 0 1px; padding: 0; border: 1px dashed var(--line); border-radius: 5px; background: none; color: var(--ink); font: inherit; font-weight: 700; cursor: pointer; }
.gap[aria-pressed="true"] { border-style: solid; border-color: var(--mid); background: var(--midbg); }
.gap[aria-pressed="true"]::after, .gap.fehlt::after { content: ","; }
.gap.right { border-color: var(--ok); background: var(--okbg); }
.gap.wrong { border-color: var(--bad); background: var(--badbg); }
.regel p { margin: 0 0 8px; max-width: 70ch; }
.words { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px 18px; margin: 0; }
.words div { min-width: 0; }
.words dt { font-weight: 700; }
.words dd { margin: 0; color: var(--muted); font-size: .92rem; }
.facts { display: grid; gap: 0; margin: 0; }
.facts div { display: grid; grid-template-columns: minmax(110px, 170px) 1fr; gap: 4px 16px; padding: 9px 0; border-top: 1px solid var(--line); }
.facts div:first-child { border-top: 0; }
.facts dt { font-weight: 700; }
.facts dd { margin: 0; }
@media (max-width: 520px) { .facts div { grid-template-columns: 1fr; } }
.name { display: grid; gap: 4px; max-width: 360px; }
.name input { border: 1.5px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--bg); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn {
  border: 0; border-radius: 8px; padding: 10px 18px; font-weight: 700; cursor: pointer;
  background: var(--accent); color: var(--surface);
}
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.score { font-family: var(--font-display); font-size: 1.3rem; font-weight: 700; font-variant-numeric: tabular-nums; }

/* Anmeldung, Kopfzeile, Lehrpersonen-Ansicht */
.topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding-bottom: 14px; margin-bottom: 18px; border-bottom: 1px solid var(--line); }
.topbar .brand { font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; }
.topbar .links { display: flex; gap: 14px; flex-wrap: wrap; }
.topbar .links a { font-weight: 700; text-decoration: none; }
.topbar .who { margin-left: auto; color: var(--muted); font-size: .9rem; min-width: 0; overflow-wrap: anywhere; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 700; cursor: pointer; }
.linkbtn.danger { color: var(--bad); }
.login { max-width: 440px; margin: 6vh auto 0; display: grid; gap: 10px; }
.login .block { gap: 10px; }
.login input, .toolbar select, .mrow select, .addm input, .newg input, .gname {
  border: 1.5px solid var(--line); border-radius: 8px; padding: 9px 11px; background: var(--bg); min-width: 0;
}
.login input { width: 100%; font-size: 1.05rem; }
.hint { color: var(--muted); font-size: .92rem; margin: 0; }
.err { color: var(--bad); font-weight: 700; font-size: .92rem; margin: 0; }
.err:empty { display: none; }
.okmsg { color: var(--ok); font-weight: 700; margin: 0 0 10px; }
.progress { margin: 0; }
.cardtop { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.pill { font-size: .75rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.pill.good, .cell.good { background: var(--okbg); color: var(--ok); }
.pill.mid, .cell.mid { background: var(--midbg); color: var(--mid); }
.pill.low, .cell.low { background: var(--badbg); color: var(--bad); }
a.back { display: inline-block; text-decoration: none; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.matrix { border-collapse: collapse; font-size: .88rem; font-variant-numeric: tabular-nums; }
.matrix th, .matrix td { border-bottom: 1px solid var(--line); padding: 6px 6px; text-align: center; white-space: nowrap; }
.matrix thead th { position: sticky; top: 0; background: var(--surface); font-weight: 700; }
.matrix thead th .colk { border-bottom: 3px solid var(--r); padding-bottom: 2px; }
.matrix .sname { text-align: left; position: sticky; left: 0; background: var(--surface); z-index: 1; min-width: 170px; }
.matrix .sname span { display: block; font-weight: 400; color: var(--muted); font-size: .78rem; }
.matrix .sum { font-weight: 700; }
.matrix .empty { color: var(--line); }
.cell { border: 0; border-radius: 6px; padding: 3px 7px; font-weight: 700; cursor: pointer; font-size: .85rem; }
.legend { margin-top: 8px; }
.legend ul { columns: 2 260px; padding-left: 18px; font-size: .9rem; color: var(--muted); }
.detail { margin-top: 18px; border-top: 5px solid var(--r); }
.detailhead { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.try { border-top: 1px solid var(--line); padding-top: 10px; }
.trymeta { margin: 0 0 6px; font-variant-numeric: tabular-nums; }
.answers { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
.answers li { display: grid; gap: 2px; }
.answers li span:first-child { color: var(--muted); font-size: .9rem; }
.answers li.ok span:last-child { color: var(--ok); font-weight: 700; }
.answers li.bad span:last-child { color: var(--bad); font-weight: 700; }
.openans { white-space: pre-wrap; background: var(--bg); border-radius: 6px; padding: 6px 10px; }
.newg .row { display: flex; flex-wrap: wrap; gap: 8px; }
.newg .row input { flex: 1 1 220px; }
.gblock { margin-top: 14px; }
.ghead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.gname { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; flex: 1 1 200px; }
.mlist { list-style: none; margin: 0; padding: 0; display: grid; }
.mrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 8px 0; border-top: 1px solid var(--line); }
.mname { flex: 1 1 220px; min-width: 0; font-weight: 700; overflow-wrap: anywhere; }
.mname span { display: block; font-weight: 400; color: var(--muted); font-size: .85rem; }
.addm { display: flex; flex-wrap: wrap; gap: 8px; }
.pwbox { flex-basis: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; display: grid; gap: 4px; }
.pwbox p { margin: 0; }
.pwval { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 1.3rem; font-weight: 700; letter-spacing: .04em; user-select: all; }
.addm input { flex: 1 1 180px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
code { background: var(--bg); padding: 1px 5px; border-radius: 4px; }

/* Dashboard */
#tabbody > .block + .block { margin-top: 16px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 2px; }
.kpi .kv { font-family: var(--font-display); font-size: 1.9rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
.kpi .kv small { font-size: .9rem; font-weight: 500; color: var(--muted); }
.kpi .kl { color: var(--muted); font-size: .88rem; }
.kpi.warn { border-color: var(--bad); }
.kv.good { color: var(--ok); } .kv.mid { color: var(--mid); } .kv.low { color: var(--bad); }
.rbars { display: grid; gap: 10px; }
.rbar { display: grid; grid-template-columns: minmax(120px, 210px) 1fr 52px; gap: 12px; align-items: center; }
.rname { font-weight: 700; font-size: .92rem; }
.rval { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
.track { display: block; height: 10px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); overflow: hidden; }
.fill { display: block; height: 100%; background: var(--r, var(--accent)); border-radius: 999px; }
.listhead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 14px; }
.sorts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--muted); font-size: .88rem; }
.sortbtn { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px; font-weight: 700; font-size: .82rem; cursor: pointer; }
.sortbtn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.pcols, .phead { display: grid; grid-template-columns: minmax(150px, 1.3fr) minmax(140px, 2fr) 80px 110px; gap: 12px; align-items: center; }
.pcols { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 0 10px; }
.plist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.prow { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.prow.idle { border-style: dashed; }
.phead { width: 100%; background: none; border: 0; text-align: left; padding: 10px; cursor: pointer; border-radius: 10px; }
.phead:hover { background: var(--bg); }
.pname { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.pname span { display: block; font-weight: 400; color: var(--muted); font-size: .82rem; }
.pprog { display: grid; grid-template-columns: 1fr 48px; gap: 8px; align-items: center; }
.pprog .fill { background: var(--accent); }
.pnum, .pavg, .plast { font-variant-numeric: tabular-nums; font-size: .9rem; }
.pnum { font-weight: 700; text-align: right; }
.pavg { font-weight: 700; }
.pavg.good { color: var(--ok); } .pavg.mid { color: var(--mid); } .pavg.low { color: var(--bad); }
.plast { color: var(--muted); }
.pdetail { padding: 4px 12px 12px; display: grid; gap: 10px; border-top: 1px solid var(--line); }
.prub { display: grid; gap: 4px; padding-top: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.stufen { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 14px 0 4px; }
.stufen > span { font-weight: 700; margin-right: 4px; }
.stufen .chip[aria-pressed="true"] { background: var(--r, var(--accent)); border-color: var(--r, var(--accent)); color: #fff; }
.stufen .chip .st { letter-spacing: 1px; }
.cell.todo { background: var(--bg); color: var(--muted); border: 1px dashed var(--line); cursor: default; display: inline-block; }
@media (max-width: 640px) {
  .pcols { display: none; }
  .phead { grid-template-columns: 1fr auto; }
  .pprog { grid-column: 1 / -1; grid-row: 2; }
  .plast { display: none; }
  .rbar { grid-template-columns: 1fr 52px; }
  .rbar .track { grid-column: 1 / -1; grid-row: 2; }
}
@media (prefers-reduced-motion: no-preference) { .card { transition: border-color .15s; } }

  {"id":"exp1g","r":"expg","typ":"text","titel":"Aufbruch in die Neue Welt","kanal":"Themenheft «Zeit• Europäische Expansion»","dauer":"Kapitel 1","kurz":"Lies zuerst Kapitel 1 im Themenheft. Hier findest du eine kurze Zusammenfassung und die Fragen im Grundniveau.","text":"Seide, Gewürze und Edelsteine kamen lange über die Seidenstrasse nach Europa. Weil dieser Landweg langsam und gefährlich war, suchten Spanier und Portugiesen einen Seeweg. Vasco da Gama erreichte Indien 1498, Kolumbus landete 1492 in Amerika.","wort":[["Seidenstrasse","Handelsweg zwischen Asien und Europa, schon von Griechen und Römern genutzt."],["Epoche","Zeitlich begrenzter Abschnitt der Geschichte."],["Kap der Guten Hoffnung","Südlichster Landzipfel Afrikas."],["Indigene Bevölkerung","Menschen, die vor den Europäern in einem Gebiet zuhause waren."]],"mc":[{"q":"Auf welchem Weg gelangten Seide, Gewürze und Edelsteine zuerst nach Europa?","o":["Über die Seidenstrasse (Landweg)","Über den Atlantik","Mit dem Flugzeug"],"a":0,"x":"Der Landweg dauerte lange, zudem lauerten Diebe."},{"q":"Kolumbus segelte 1492 …","o":["ostwärts um Afrika","westwärts über den Atlantik","nordwärts nach Island"],"a":1,"x":"Er suchte Indien und landete auf den heutigen Bahamas."}],"rf":[{"s":"Kolumbus blieb bis zu seinem Tod überzeugt, Indien gefunden zu haben.","a":true,"x":"Darum nannte er die Bewohner Indios."},{"s":"Vasco da Gama segelte für die Spanier.","a":false,"x":"Er war Portugiese."}],"offen":[]},
  {"id":"exp1e","r":"expe","typ":"text","titel":"Aufbruch in die Neue Welt","kanal":"Themenheft «Zeit• Europäische Expansion»","dauer":"Kapitel 1","kurz":"Lies zuerst Kapitel 1 im Themenheft. Hier findest du eine kurze Zusammenfassung und die Fragen im erweiterten Niveau.","text":"Seide, Gewürze und Edelsteine kamen lange über die Seidenstrasse nach Europa. Weil dieser Landweg langsam und gefährlich war, suchten Spanier und Portugiesen einen Seeweg. Vasco da Gama erreichte Indien 1498, Kolumbus landete 1492 in Amerika.","wort":[["Seidenstrasse","Handelsweg zwischen Asien und Europa, schon von Griechen und Römern genutzt."],["Epoche","Zeitlich begrenzter Abschnitt der Geschichte."],["Kap der Guten Hoffnung","Südlichster Landzipfel Afrikas."],["Indigene Bevölkerung","Menschen, die vor den Europäern in einem Gebiet zuhause waren."]],"mc":[{"q":"Warum suchten Portugiesen und Spanier einen Seeweg nach Indien, obwohl es die Seidenstrasse gab?","o":["Die Seidenstrasse war im 15. Jahrhundert vollständig zerstört","Der Papst hatte den Landweg verboten","Auf See gab es keine Piraten, an Land aber Gewürze","Der Landweg war langsam und gefährlich, und die Waren wurden unterwegs teuer"],"a":3,"x":"Ein eigener Seeweg versprach schnelleren Handel ohne Zwischenhändler."},{"q":"Warum segelte Kolumbus westwärts, um Indien zu erreichen?","o":["Er wollte Afrika umgehen, weil Vasco da Gama es bereits gesperrt hatte","Er wusste, dass im Westen ein neuer Kontinent liegt","Er hatte eine Karte mit dem Weg nach Amerika","Er ging davon aus, dass man Asien auch über den Atlantik erreichen kann"],"a":3,"x":"Er kannte Amerika nicht und hielt die Erde für klein genug."},{"q":"Welche Tatsache belegt am besten, dass Kolumbus bis zu seinem Tod glaubte, in Indien gewesen zu sein?","o":["Er landete auf den Bahamas","Er schrieb 1493 einen Brief an den König","Er startete in Cadiz","Er nannte die Bewohner «Indios»"],"a":3,"x":"Die Bezeichnung «Indios» geht auf diesen Irrtum zurück."},{"q":"Was folgt aus den beiden Reisen von 1492 und 1498?","o":["Beide Länder fanden denselben Seeweg nach Indien","Portugal fand einen Seeweg ostwärts um Afrika, Spanien stiess westwärts auf einen neuen Kontinent","Kolumbus erreichte Indien vor Vasco da Gama","Vasco da Gama entdeckte Amerika"],"a":1,"x":"Zwei verschiedene Wege, zwei verschiedene Ergebnisse."},{"q":"Warum ist der Ausdruck «Entdeckung Amerikas» aus heutiger Sicht umstritten?","o":["Kolumbus landete gar nicht in Amerika","Dort lebten schon Menschen mit eigenen Kulturen, für sie war nichts neu","Amerika war schon den Römern bekannt","Der Begriff wurde erst 1900 erfunden"],"a":1,"x":"Perspektivenwechsel: Für Europäer neu, für Indigene schon immer besiedelt."},{"q":"In welcher Reihenfolge geschahen diese Ereignisse?","o":["Vasco da Gama in Indien – Buchdruck – Kolumbus in Amerika","Kolumbus in Amerika – Vasco da Gama in Indien – Buchdruck","Buchdruck – Vasco da Gama in Indien – Kolumbus in Amerika","Buchdruck – Kolumbus in Amerika – Vasco da Gama in Indien"],"a":3,"x":"1440, 1492 und 1498."}],"rf":[],"offen":[]},
  {"id":"exp2g","r":"expg","typ":"text","titel":"Der Brief von Kolumbus","kanal":"Themenheft «Zeit• Europäische Expansion»","dauer":"Kapitel 2","kurz":"Lies zuerst Kapitel 2 im Themenheft. Hier findest du eine kurze Zusammenfassung und die Fragen im Grundniveau.","text":"1493 schrieb Kolumbus einen Brief an den spanischen König. Er beschrieb Inseln, Natur und Einheimische und versprach Gold, Güter und Sklaven.","wort":[["Indigene Bevölkerung","Menschen, die vor den Europäern in einem Gebiet zuhause waren."],["Kolonie","Erobertes Land, das zu einem anderen Land gehört."]],"mc":[{"q":"Von welcher Stadt aus startete Kolumbus laut Brief?","o":["Cadiz","Lissabon","Genua"],"a":0,"x":"Nach 33 Tagen erreichte er die ersten Inseln."},{"q":"Wie beschrieb Kolumbus die Einheimischen?","o":["Ehrlich, vertrauenswürdig und grosszügig","Kriegerisch und gefährlich","Reich und mächtig"],"a":0,"x":"Sie verweigerten laut Brief einem Bittsteller nichts."},{"q":"Was bedeutet «Hissen der Fahne»?","o":["Die Fahne wird gewaschen","Das Land wird für Spanien in Besitz genommen","Das Schiff legt ab"],"a":1,"x":"Die Inseln galten nun als spanisch."}],"rf":[],"offen":[]},
  {"id":"exp2e","r":"expe","typ":"text","titel":"Der Brief von Kolumbus","kanal":"Themenheft «Zeit• Europäische Expansion»","dauer":"Kapitel 2","kurz":"Lies zuerst Kapitel 2 im Themenheft. Hier findest du eine kurze Zusammenfassung und die Fragen im erweiterten Niveau.","text":"1493 schrieb Kolumbus einen Brief an den spanischen König. Er beschrieb Inseln, Natur und Einheimische und versprach Gold, Güter und Sklaven.","wort":[["Indigene Bevölkerung","Menschen, die vor den Europäern in einem Gebiet zuhause waren."],["Kolonie","Erobertes Land, das zu einem anderen Land gehört."]],"mc":[{"q":"Der Brief von 1493 richtete sich an den König. Welche Aussage diente besonders dazu, ihn für weitere Reisen zu gewinnen?","o":["Die Angabe, dass die Reise 33 Tage gedauert hatte","Das Versprechen von Gold, Gewürzen und Sklaven","Der Hinweis, dass er in Cadiz gestartet war","Die Beschreibung des Wetters"],"a":1,"x":"Der Brief war auch Werbung für die nächste Expedition."},{"q":"Warum ist der Brief als historische Quelle mit Vorsicht zu lesen?","o":["Kolumbus schrieb aus eigenem Interesse und aus der Sicht eines Europäers","Er wurde erst 200 Jahre später geschrieben","Er wurde von den Einheimischen verfasst","Er enthält nur Zahlen"],"a":0,"x":"Quellenkritik fragt: Wer schreibt für wen und mit welchem Ziel?"},{"q":"Was bedeutete das «Hissen der Fahne» für die Einheimischen?","o":["Sie wurden um Erlaubnis gebeten","Es hatte keine Folgen","Sie erhielten spanisches Bürgerrecht","Das Land galt nun als spanisch, ohne dass sie gefragt wurden"],"a":3,"x":"Die Inbesitznahme geschah einseitig."},{"q":"Welche Folge hatte es, dass der Brief gedruckt wurde?","o":["Kolumbus verlor sein Ansehen","Spanien verbot die Reise","Die Nachricht von der Entdeckung verbreitete sich rasch in Europa","Die Einheimischen lasen ihn"],"a":2,"x":"Der Buchdruck beschleunigte die Verbreitung von Neuigkeiten."},{"q":"Welche Beschreibung der Einheimischen passt zu den Interessen von Kolumbus und warum?","o":["«Kriegerisch»: so konnte er Soldaten fordern","«Ehrlich und grosszügig»: Sie liessen sich leicht unterwerfen und ausnutzen","«Reich»: so konnte er Handel treiben","«Fremd»: so brauchte er keine Hilfe"],"a":1,"x":"Die positive Schilderung erleichterte aus Sicht der Eroberer die Unterwerfung."}],"rf":[],"offen":[]},
  {"id":"exp3g","r":"expg","typ":"text","titel":"Der Buchdruck und die Aufteilung Amerikas","kanal":"Themenheft «Zeit• Europäische Expansion»","dauer":"Kapitel 3","kurz":"Lies zuerst Kapitel 3 im Themenheft. Hier findest du eine kurze Zusammenfassung und die Fragen im Grundniveau.","text":"Gutenberg erfand 1440 den Buchdruck. Bücher wurden billiger, mehr Menschen lernten lesen. Der Papst teilte die Welt am 47. Längengrad zwischen Portugal und Spanien auf.","wort":[["Papst","Oberhaupt der katholischen Kirche, wohnt im Vatikan in Rom."],["Längengrad","Linie senkrecht zum Äquator, dient der Ortsbestimmung."],["Vertrag von Tordesillas","Teilte die Welt am 47. Längengrad zwischen Portugal und Spanien auf."]],"mc":[{"q":"In welchem Jahr erfand Gutenberg den Buchdruck?","o":["1354","1440","1840"],"a":1,"x":"Vorher wurden Bücher von Hand geschrieben."},{"q":"Welche Folge hatte der Buchdruck?","o":["Mehr Leser, schnellere Verbreitung von Neuigkeiten","Bücher wurden seltener","Nur noch Mönche lasen"],"a":0,"x":"So sprach sich Kolumbus’ Entdeckung rasch herum."},{"q":"Wer erhielt die Gebiete westlich des 47. Längengrads?","o":["Portugal","Spanien","Frankreich"],"a":1,"x":"Portugal bekam die Gebiete östlich davon."},{"q":"Nach wem ist Amerika benannt?","o":["Amerigo Vespucci","Christoph Kolumbus","Vasco da Gama"],"a":0,"x":"Er hielt das Land früh für einen eigenen Kontinent."}],"rf":[],"offen":[]},
  {"id":"exp3e","r":"expe","typ":"text","titel":"Der Buchdruck und die Aufteilung Amerikas","kanal":"Themenheft «Zeit• Europäische Expansion»","dauer":"Kapitel 3","kurz":"Lies zuerst Kapitel 3 im Themenheft. Hier findest du eine kurze Zusammenfassung und die Fragen im erweiterten Niveau.","text":"Gutenberg erfand 1440 den Buchdruck. Bücher wurden billiger, mehr Menschen lernten lesen. Der Papst teilte die Welt am 47. Längengrad zwischen Portugal und Spanien auf.","wort":[["Papst","Oberhaupt der katholischen Kirche, wohnt im Vatikan in Rom."],["Längengrad","Linie senkrecht zum Äquator, dient der Ortsbestimmung."],["Vertrag von Tordesillas","Teilte die Welt am 47. Längengrad zwischen Portugal und Spanien auf."]],"mc":[{"q":"Welcher Zusammenhang besteht zwischen Buchdruck und dem Wettlauf um Seewege?","o":["Berichte über Entdeckungen verbreiteten sich schnell und weckten Interesse","Der Buchdruck verbesserte den Schiffsbau","Der Papst verbot Bücher über Seefahrt","Nur Mönche lasen die Berichte"],"a":0,"x":"Gedruckte Bücher machten Neuigkeiten für viele zugänglich."},{"q":"Warum konnte der Papst die Welt zwischen Spanien und Portugal aufteilen?","o":["Seine Autorität wurde in den katholischen Ländern anerkannt","Er besass alle Kolonien","Er war König von Spanien","Er hatte die Schiffe bezahlt"],"a":0,"x":"Der Vertrag stützte sich auf die Macht der Kirche."},{"q":"Wer wurde bei der Aufteilung der Welt nicht gefragt?","o":["Der König von Spanien","Der König von Portugal","Der Papst","Die Menschen, die in den Gebieten lebten"],"a":3,"x":"Die Einheimischen hatten keinen Einfluss auf die Aufteilung ihres Landes."},{"q":"Wie lässt sich erklären, dass in Brasilien Portugiesisch, im übrigen Südamerika meist Spanisch gesprochen wird?","o":["Die Sklaven brachten Portugiesisch mit","Brasilien wurde als erstes Land entdeckt","Der Buchdruck erreichte Brasilien früher","Brasilien liegt östlich der Tordesillas-Linie und wurde portugiesisch"],"a":3,"x":"Die Linie bei 47° West wirkt bis heute nach."},{"q":"Warum wurde Amerika nach Vespucci und nicht nach Kolumbus benannt?","o":["Kolumbus war nie in Amerika","Vespucci erkannte früh, dass es ein eigener Kontinent ist","Vespucci war zuerst dort","Kolumbus verbot, seinen Namen zu verwenden"],"a":1,"x":"Kolumbus hielt bis zu seinem Tod an der Indien-Annahme fest."},{"q":"Lissabon liegt etwa bei 9° West. Auf welcher Seite der Linie von Tordesillas (47° West) liegt es?","o":["Östlich der Linie, also im portugiesischen Bereich","Westlich der Linie, also im spanischen Bereich","Genau auf der Linie","Die Linie betraf Europa nicht"],"a":0,"x":"9° West liegt weiter östlich als 47° West."}],"rf":[],"offen":[]},
  {"id":"exp4g","r":"expg","typ":"text","titel":"Inkas und Azteken","kanal":"Themenheft «Zeit• Europäische Expansion»","dauer":"Kapitel 4","kurz":"Lies zuerst Kapitel 4 im Themenheft. Hier findest du eine kurze Zusammenfassung und die Fragen im Grundniveau.","text":"Schon vor den Europäern lebten in Amerika hoch entwickelte Völker: die Inkas in Peru, die Azteken in Mexiko. Pizarro und Cortés eroberten ihre Reiche.","wort":[["Conquistadores","Spanisch für «Eroberer»."],["Polytheistische Religion","Religion mit mehreren Gottheiten."],["Indigene Bevölkerung","Menschen, die vor den Europäern in einem Gebiet zuhause waren."]],"mc":[{"q":"Was war die Hauptstadt der Inkas?","o":["Cusco","Tenochtitlan","Lima"],"a":0,"x":"Cusco liegt im heutigen Peru."},{"q":"Was war die Hauptstadt der Azteken?","o":["Machu Picchu","Tenochtitlan","Cusco"],"a":1,"x":"Sie hatte etwa 100 000 Einwohner."},{"q":"Wer eroberte das Inkareich?","o":["Hernán Cortés","Francisco Pizarro","Amerigo Vespucci"],"a":1,"x":"Cortés ging gegen die Azteken vor."}],"rf":[{"s":"Die Spanier nutzten den Streit zwischen indigenen Stämmen aus.","a":true,"x":"Sie hetzten die Stämme oft gegeneinander auf."}],"offen":[]},
  {"id":"exp4e","r":"expe","typ":"text","titel":"Inkas und Azteken","kanal":"Themenheft «Zeit• Europäische Expansion»","dauer":"Kapitel 4","kurz":"Lies zuerst Kapitel 4 im Themenheft. Hier findest du eine kurze Zusammenfassung und die Fragen im erweiterten Niveau.","text":"Schon vor den Europäern lebten in Amerika hoch entwickelte Völker: die Inkas in Peru, die Azteken in Mexiko. Pizarro und Cortés eroberten ihre Reiche.","wort":[["Conquistadores","Spanisch für «Eroberer»."],["Polytheistische Religion","Religion mit mehreren Gottheiten."],["Indigene Bevölkerung","Menschen, die vor den Europäern in einem Gebiet zuhause waren."]],"mc":[{"q":"Weshalb konnten wenige Spanier das Aztekenreich besiegen?","o":["Sie nutzten den Streit zwischen den Stämmen aus, hatten bessere Waffen, und Krankheiten schwächten die Azteken","Die Azteken hatten keine Armee","Die Spanier waren zahlenmässig weit überlegen","Die Azteken ergaben sich freiwillig"],"a":0,"x":"Mehrere Ursachen wirkten zusammen."},{"q":"Welche Funktion hatte das riesige Wegnetz der Inkas vermutlich?","o":["Es verband das Reich und erleichterte die Verwaltung","Es führte zu den Häfen nach Europa","Es diente der Flucht vor den Spaniern","Es war nur ein religiöser Pilgerweg"],"a":0,"x":"Ein grosses Reich braucht Verbindungen."},{"q":"Wie erklärt sich die Bedeutung des Sonnengotts im Glauben der Azteken und Inkas?","o":["Beide Völker glaubten an mehrere Götter, der Sonnengott war am wichtigsten","Sie glaubten nur an einen Gott","Sie hatten keine Religion","Sie übernahmen den Glauben der Spanier"],"a":0,"x":"Solche Religionen heissen polytheistisch."},{"q":"Was lässt sich aus der Wiederentdeckung von Machu Picchu erst 1911 schliessen?","o":["Sie wurde erst im 20. Jahrhundert erbaut","Die Spanier haben die Anlage nicht gefunden und darum nicht zerstört","Sie war immer bekannt","Die Inkas hatten sie 1911 verlassen"],"a":1,"x":"Darum ist sie so gut erhalten."},{"q":"Was entstand nach der Zerstörung von Tenochtitlan an gleicher Stelle?","o":["Lima","Mexiko-Stadt","Cusco","Neu-Tenochtitlan als Hauptstadt der Azteken"],"a":1,"x":"Die Spanier gründeten eine neue Stadt."}],"rf":[],"offen":[]},
  {"id":"exp5g","r":"expg","typ":"text","titel":"Entdecker und Eroberer","kanal":"Themenheft «Zeit• Europäische Expansion»","dauer":"Kapitel 5","kurz":"Lies zuerst Kapitel 5 im Themenheft. Hier findest du eine kurze Zusammenfassung und die Fragen im Grundniveau.","text":"Kolumbus gilt als Entdecker, war aber auch Eroberer. Spanien wollte Gold und mehr Land. Die Indigenen sollten unterworfen und bekehrt werden, eingeschleppte Krankheiten forderten die meisten Opfer.","wort":[["Conquistadores","Spanisch für «Eroberer»."],["Bekehren","Jemanden für eine Religion gewinnen, hier: ihm sie aufzwingen."],["Polytheistische Religion","Religion mit mehreren Gottheiten."],["Koexistenz","Friedliches Nebeneinanderleben von Menschen."]],"mc":[{"q":"Woran war das spanische Königshaus vor allem interessiert?","o":["An Gold","An Gewürzen aus Afrika","An Büchern"],"a":0,"x":"Dazu kamen der Wunsch nach mehr Land und die Neugier."},{"q":"Was forderte bei den Indigenen die meisten Todesopfer?","o":["Eingeschleppte Krankheiten wie Pocken","Schiffsunglücke","Hungersnöte"],"a":0,"x":"Für Europäer meist harmlos, für Indigene oft tödlich."},{"q":"An wen glaubten Inkas und Azteken?","o":["An einen einzigen Gott","An mehrere Götter, am wichtigsten war der Sonnengott","An keinen Gott"],"a":1,"x":"Solche Religionen heissen polytheistisch."}],"rf":[],"offen":[]},
  {"id":"exp5e","r":"expe","typ":"text","titel":"Entdecker und Eroberer","kanal":"Themenheft «Zeit• Europäische Expansion»","dauer":"Kapitel 5","kurz":"Lies zuerst Kapitel 5 im Themenheft. Hier findest du eine kurze Zusammenfassung und die Fragen im erweiterten Niveau.","text":"Kolumbus gilt als Entdecker, war aber auch Eroberer. Spanien wollte Gold und mehr Land. Die Indigenen sollten unterworfen und bekehrt werden, eingeschleppte Krankheiten forderten die meisten Opfer.","wort":[["Conquistadores","Spanisch für «Eroberer»."],["Bekehren","Jemanden für eine Religion gewinnen, hier: ihm sie aufzwingen."],["Polytheistische Religion","Religion mit mehreren Gottheiten."],["Koexistenz","Friedliches Nebeneinanderleben von Menschen."]],"mc":[{"q":"Kolumbus gilt als Entdecker, war aber auch Eroberer. Welcher Beleg stützt die zweite Aussage?","o":["Er nahm Land für Spanien in Besitz und versprach dem König Sklaven","Er segelte mit mehreren Schiffen","Er schrieb einen Brief","Er startete in Cadiz"],"a":0,"x":"Besitznahme und Versklavung sind Merkmale von Eroberung."},{"q":"Weshalb starben mehr Indigene an Krankheiten als in Kämpfen?","o":["Die Spanier vergifteten das Wasser","Es gab keine Kämpfe","Die Indigenen waren schlechter ernährt","Die eingeschleppten Krankheiten waren für sie neu, sie hatten keine Abwehr"],"a":3,"x":"Für Europäer meist harmlos, für Indigene oft tödlich."},{"q":"Wie wirkte sich das Einschmelzen des geraubten Inka-Goldes aus?","o":["Die Inkas wurden dadurch reicher","Das Gold verlor seinen Wert","Kunst und Kultur der Inkas gingen teilweise verloren","Spanien verzichtete auf weitere Eroberungen"],"a":2,"x":"Schätzungsweise 1000 Tonnen Gold wurden geraubt."},{"q":"Welche Absicht verfolgten die Spanier neben Gold und Land?","o":["Handelsverträge auf Augenhöhe zu schliessen","Die Völker zu Mitherrschern zu machen","Die Kultur der Indigenen zu bewahren","Die Indigenen zu unterwerfen und zu bekehren"],"a":3,"x":"Es ging um Macht und Glauben."},{"q":"Pizarro landete 1532, die Inkaherrschaft erlosch 1572. Wie lange dauerte es?","o":["4 Jahre","40 Jahre","400 Jahre","14 Jahre"],"a":1,"x":"1572 minus 1532 ergibt 40 Jahre."}],"rf":[],"offen":[]},
  {"id":"exp6g","r":"expg","typ":"text","titel":"Sklaven werden nach Amerika gebracht","kanal":"Themenheft «Zeit• Europäische Expansion»","dauer":"Kapitel 6","kurz":"Lies zuerst Kapitel 6 im Themenheft. Hier findest du eine kurze Zusammenfassung und die Fragen im Grundniveau.","text":"Im Handelsdreieck verbanden Schiffe Europa, Afrika und Amerika. Europäer tauschten in Afrika Waren gegen Sklaven, die in Amerika Zucker, Tabak, Kakao und Baumwolle produzierten.","wort":[["Reedereien","Schifffahrtsgesellschaften, die Güter und Menschen transportieren."],["Destabilisieren","Eine Situation so stören, dass sie unsicher oder chaotisch wird."],["Kolonie","Erobertes Land, das zu einem anderen Land gehört."]],"mc":[{"q":"Welche Waren tauschten Europäer in Afrika gegen Sklaven?","o":["Stoffe, Gewehre und Alkohol","Zucker und Tabak","Gold und Silber"],"a":0,"x":"Die Sklaven wurden danach nach Amerika verschifft."},{"q":"Wohin brachten Portugiesen 1518 die ersten afrikanischen Sklaven?","o":["Nach Hispaniola","Nach Kuba","Nach Mexiko"],"a":0,"x":"Dort liegen heute Haiti und die Dominikanische Republik."},{"q":"Was wurde von Amerika nach Europa verschifft?","o":["Zucker, Tabak, Kakao, Baumwolle","Stoffe, Gewehre, Alkohol","Seide und Edelsteine"],"a":0,"x":"Die Waren stammten aus Sklavenarbeit."},{"q":"Wie viele der Verschleppten starben etwa auf der Überfahrt?","o":["Etwa jeder Zehnte","Fast alle","Praktisch niemand"],"a":0,"x":"Über eine Million Menschen."}],"rf":[],"offen":[]},
  {"id":"exp6e","r":"expe","typ":"text","titel":"Sklaven werden nach Amerika gebracht","kanal":"Themenheft «Zeit• Europäische Expansion»","dauer":"Kapitel 6","kurz":"Lies zuerst Kapitel 6 im Themenheft. Hier findest du eine kurze Zusammenfassung und die Fragen im erweiterten Niveau.","text":"Im Handelsdreieck verbanden Schiffe Europa, Afrika und Amerika. Europäer tauschten in Afrika Waren gegen Sklaven, die in Amerika Zucker, Tabak, Kakao und Baumwolle produzierten.","wort":[["Reedereien","Schifffahrtsgesellschaften, die Güter und Menschen transportieren."],["Destabilisieren","Eine Situation so stören, dass sie unsicher oder chaotisch wird."],["Kolonie","Erobertes Land, das zu einem anderen Land gehört."]],"mc":[{"q":"Warum heisst es Handelsdreieck?","o":["Es fuhren immer drei Schiffe gemeinsam","Die Schiffe fuhren eine Route zwischen drei Kontinenten und tauschten an jeder Ecke Waren","Das Handelsgebiet hat die Form des afrikanischen Kontinents","Es gab drei Hauptwaren"],"a":1,"x":"Europa, Afrika und Amerika bildeten die Ecken."},{"q":"Etwa jeder Zehnte starb auf der Überfahrt. Wie viele Menschen waren das bei über 13 Millionen Verschleppten ungefähr?","o":["Etwa 10 000","Etwa 100 000","Über eine Million","Etwa 10 Millionen"],"a":2,"x":"Ein Zehntel von 13 Millionen sind 1,3 Millionen."},{"q":"Weshalb schadete der Handel Afrika langfristig?","o":["Afrika musste Zucker in Amerika kaufen","Afrika gründete Kolonien in Europa","Afrika wurde zu reich","Viele Menschen wurden verschleppt, was die Gesellschaften sozial, wirtschaftlich und politisch destabilisierte"],"a":3,"x":"Der Verlust von Millionen Menschen wirkte lange nach."},{"q":"Warum waren Zucker, Tabak, Kakao und Baumwolle für Europa so lukrativ?","o":["Sie wurden mit unbezahlter Sklavenarbeit billig hergestellt und in Europa gewinnbringend verkauft","Sie wuchsen in Europa nicht und waren darum wertlos","Sie wurden von Indigenen geschenkt","Sie waren Pflicht aufgrund des Papstes"],"a":0,"x":"Der Gewinn beruhte auf der Ausbeutung der Sklaven."},{"q":"Wer zog den grössten Nutzen aus dem Handelsdreieck?","o":["Europäische Händler und Staaten","Die verschleppten Menschen","Die Dörfer an der afrikanischen Küste","Die indigenen Völker Amerikas"],"a":0,"x":"Der Reichtum Europas beruhte auf diesem Handel."}],"rf":[],"offen":[]},

    text: "Inès a 15 ans. Elle habite à Fribourg. Son portable est toujours avec elle : le matin, à l'école et le soir dans son lit.\n\nUn jour, Inès regarde son temps d'écran : six heures par jour ! Elle est choquée. « Six heures ? C'est beaucoup trop ! » Elle regarde surtout des vidéos et elle écrit des messages à ses amies.\n\nInès veut changer. Elle a une idée : pendant une semaine, pas de portable après 20 heures. Le soir, elle met son portable dans la cuisine.\n\nLe premier soir, c'est difficile. Mais après quelques jours, elle lit un livre, elle joue aux cartes avec son petit frère et elle dort mieux. À la fin de la semaine, Inès est fière.",

  { id: "le-sac", r: "histoires", typ: "text", texttitel: "Le texte", titel: "Le sac perdu", kanal: "Lesetext", dauer: "ca. 130 Wörter",
    kurz: "Noah hat gleich einen Match, aber sein Rucksack ist weg. Eine kurze, spannende Geschichte.",
    vor: "Hast du schon einmal etwas verloren? Was?",
    text: "Samedi matin, Noah prend le train de Neuchâtel à Bienne. Il a un sac à dos bleu. Dans le sac, il y a son porte-monnaie, ses clés et son maillot de foot.\n\nÀ Bienne, Noah descend vite du train. Il a un match à dix heures. Mais tout à coup … « Mon sac ! Où est mon sac ? » Le sac est encore dans le train ! Et le train repart.\n\nNoah a peur. Sans maillot, il ne peut pas jouer. Il va au guichet de la gare. La dame est gentille. Elle téléphone au contrôleur du train.\n\nVingt minutes plus tard, le téléphone sonne. Le contrôleur a trouvé le sac bleu ! Il arrive avec le prochain train. Noah court au stade. Il arrive juste à temps pour le match … et il marque un but !",

  { id: "dl-schwingen", r: "lsport", typ: "text", texttitel: "Text", titel: "Schwingen – Sport im Sägemehl", kanal: "Sachtext", dauer: "ca. 150 Wörter",
    kurz: "Zwei Männer in kurzen Hosen aus Stoff kämpfen im Sägemehl. Was ist Schwingen, und warum ist es so beliebt?",
    vor: "Hast du schon einmal ein Schwingfest gesehen, live oder im Fernsehen?",
    text: "Schwingen ist eine Art Ringen und gilt als Schweizer Nationalsport. Zwei Schwinger kämpfen in einem runden Platz aus Sägemehl. Beide tragen über den normalen Hosen eine kurze Hose aus festem Stoff, die Schwinghose. Daran halten sie sich gegenseitig fest.\n\nDas Ziel ist einfach: Man muss den Gegner auf den Rücken legen. Wenn beide Schulterblätter des Gegners das Sägemehl berühren, hat man gewonnen. Nach dem Kampf wischt der Sieger dem Verlierer das Sägemehl vom Rücken. Das ist ein Zeichen von Respekt.\n\nFrüher war Schwingen vor allem ein Sport der Bauern und Hirten in den Bergen. Heute kommen die Schwinger aus allen Berufen: Es gibt Metzger, Zimmerleute, Polizisten und Studenten. Auch Frauen schwingen, sie haben eigene Wettkämpfe.\n\nDas grösste Fest ist das «Eidgenössische». Es findet nur alle drei Jahre statt. Mehrere hunderttausend Menschen besuchen das Fest. Der beste Schwinger wird Schwingerkönig. Geld bekommt er dafür nicht. Der Hauptpreis ist ein lebendiger Stier, der sogenannte Muni.",
    wort: [["das Sägemehl","feine Holzreste, die beim Sägen entstehen"],["der Gegner","die Person, gegen die man kämpft oder spielt"],["das Schulterblatt","flacher Knochen oben am Rücken"],["der Respekt","Achtung vor einer anderen Person"],["der Stier / der Muni","ein männliches Rind"]],

  { id: "dl-esport", r: "lsport", typ: "text", texttitel: "Text", titel: "Gamen als Beruf?", kanal: "Sachtext", dauer: "ca. 150 Wörter",
    kurz: "Manche Jugendliche träumen davon, mit Videospielen Geld zu verdienen. Ist E-Sport ein richtiger Sport?",
    vor: "Welche Games spielst du? Wie viel Zeit verbringst du pro Woche damit?",
    text: "In grossen Hallen sitzen junge Menschen vor Bildschirmen. Tausende Zuschauer jubeln, und Millionen schauen im Internet zu. Das ist E-Sport: Wettkämpfe in Videospielen. Die besten Teams spielen um Preisgelder von mehreren Millionen Dollar.\n\nViele Jugendliche träumen davon, Profi-Gamer zu werden. Doch der Weg ist sehr schwer. Profis trainieren oft acht bis zehn Stunden pro Tag. Sie analysieren Spiele, üben Taktiken und trainieren ihre Reaktionen. Nur ganz wenige Spielerinnen und Spieler können davon leben. Und die Karriere ist kurz: Mit 25 Jahren gehören viele schon zu den «Alten».\n\nIst E-Sport ein richtiger Sport? Darüber streiten die Leute. Die einen sagen: Gamer brauchen schnelle Reaktionen, Konzentration und Teamarbeit, genau wie Fussballer. Die anderen sagen: Man sitzt nur und bewegt sich kaum. Darum sei es kein Sport.\n\nSicher ist: Wer stundenlang gamt, braucht einen Ausgleich. Viele Profi-Teams haben deshalb Fitnesstrainer. Ihre Spieler joggen, machen Krafttraining und achten auf genug Schlaf.",
    wort: [["der Wettkampf","ein Spiel oder Rennen, bei dem man gewinnen will"],["das Preisgeld","Geld, das die Gewinner bekommen"],["analysieren","genau untersuchen"],["die Reaktion","wie schnell man auf etwas antwortet"],["der Ausgleich","etwas anderes, damit es wieder im Gleichgewicht ist"]],
    mc: [
      { q: "Was ist E-Sport?", o: ["Sport mit elektrischen Velos","Wettkämpfe in Videospielen","Sport, den man im Fernsehen schaut"], a: 1 },
      { q: "Wie lange trainieren Profi-Gamer oft pro Tag?", o: ["Eine Stunde","Acht bis zehn Stunden","Zwanzig Stunden"], a: 1 },
      { q: "Was sagen die Leute, für die E-Sport kein Sport ist?", o: ["Gamer bewegen sich kaum","Gamer verdienen zu viel Geld","Die Games sind zu einfach"], a: 0 },
      { q: "Warum haben viele Profi-Teams Fitnesstrainer?", o: ["Weil sie einen Ausgleich zum Sitzen brauchen","Weil sie auch Fussball spielen","Weil es gesetzlich verboten ist, ohne Trainer zu spielen"], a: 0 }

  { id: "dl-schiedsrichterin", r: "lsport", typ: "text", texttitel: "Text", titel: "Lea pfeift", kanal: "Porträt", dauer: "ca. 170 Wörter",
    kurz: "Lea ist 16 und Schiedsrichterin im Fussball. Nicht immer ist das einfach.",
    vor: "Wie benehmen sich Spieler und Zuschauer gegenüber Schiedsrichtern? Was hast du schon erlebt?",
    text: "Jeden Samstag zieht Lea ihr schwarzes Trikot an, packt die Pfeife ein und fährt auf einen Fussballplatz. Die 16-Jährige ist Schiedsrichterin. Sie leitet Spiele von Junioren-Mannschaften.\n\nAngefangen hat alles vor zwei Jahren. Lea hat selbst Fussball gespielt. Dann hat ihr Trainer gesagt: «Der Verband sucht Schiedsrichter. Probier es doch!» Lea hat einen Kurs besucht und eine Prüfung über die Regeln gemacht. Seither pfeift sie fast jedes Wochenende. Für jedes Spiel bekommt sie eine kleine Entschädigung.\n\n«Das Schönste ist, wenn ein Spiel fair ist und alle am Schluss die Hand geben», sagt Lea. Es gibt aber auch schwierige Momente. Manchmal schreien Eltern am Spielfeldrand oder Spieler reklamieren laut. Einmal hat ein Vater sie beschimpft. «Da musste ich tief durchatmen», erzählt sie. Sie hat das Spiel kurz unterbrochen und den Trainer um Hilfe gebeten.\n\nTrotzdem macht Lea weiter. Sie hat gelernt, ruhig zu bleiben und klare Entscheidungen zu treffen. «Das hilft mir auch in der Schule und später in der Lehre», sagt sie. Ihr Ziel: Einmal ein Spiel in der Super League pfeifen.",
    wort: [["pfeifen","mit der Pfeife ein Zeichen geben; ein Spiel als Schiedsrichter leiten"],["der Verband","eine grosse Organisation, z. B. für Fussball"],["die Entschädigung","Geld als Dank für eine Arbeit"],["reklamieren","sich laut beschweren"],["beschimpfen","mit bösen Wörtern beleidigen"]],
    mc: [

  { id: "dl-fitness", r: "lsport", typ: "text", texttitel: "Text", titel: "Fit ohne Fitnessstudio", kanal: "Ratgeber", dauer: "ca. 160 Wörter",
    kurz: "Ein Abo im Fitnessstudio ist teuer. Es geht auch gratis: zu Hause, im Wald oder auf dem Schulweg.",
    vor: "Wie bewegst du dich in deiner Freizeit?",
    text: "Viele Jugendliche möchten fitter werden. Doch ein Abo im Fitnessstudio kostet oft mehrere hundert Franken pro Jahr. Die gute Nachricht: Man braucht kein Studio, um fit zu werden.\n\nDer eigene Körper ist das beste Trainingsgerät. Liegestütze, Kniebeugen und Sit-ups kann man überall machen, sogar im Kinderzimmer. Wichtig ist, dass man die Übungen richtig macht. Lieber langsam und sauber als schnell und falsch. Im Internet gibt es viele Videos, die die Übungen genau erklären.\n\nAuch draussen kann man gratis trainieren. In vielen Gemeinden gibt es Vita-Parcours. Das sind Wege im Wald mit Stationen. An jeder Station steht eine Tafel mit einer Übung. Manche Städte haben auch Outdoor-Fitnessplätze mit Stangen und Geräten.\n\nAm einfachsten ist Bewegung im Alltag. Wer mit dem Velo zur Schule fährt oder die Treppe statt den Lift nimmt, bewegt sich schon mehr. Fachleute empfehlen Jugendlichen, sich jeden Tag mindestens eine Stunde zu bewegen.\n\nUnd noch ein Tipp: Zusammen geht es leichter. Wer mit Freunden trainiert, bleibt eher dran.",

    mc: [

      { q: "Wie viel Bewegung empfehlen Fachleute für Jugendliche?", o: ["Eine Stunde pro Woche","Mindestens eine Stunde pro Tag","Fünf Minuten pro Tag"], a: 1 },

  { id: "dl-lauberhorn", r: "lsport", typ: "text", texttitel: "Text", titel: "Das Lauberhorn-Rennen", kanal: "Sachtext", dauer: "ca. 150 Wörter",
    kurz: "Die längste Abfahrt im Weltcup führt durch Wengen im Berner Oberland. Ein Rennen mit Mut und Geschwindigkeit.",
    vor: "Fährst du Ski oder Snowboard? Wie schnell bist du schon gefahren?",
    text: "Jedes Jahr im Januar schauen Skifans auf ein kleines Dorf im Berner Oberland: Wengen. Hier findet das Lauberhorn-Rennen statt. Es gibt es schon seit 1930. Damit gehört es zu den ältesten Skirennen der Welt.\n\nDie Abfahrt am Lauberhorn ist die längste im Weltcup. Sie ist etwa viereinhalb Kilometer lang. Die Fahrer brauchen dafür rund zweieinhalb Minuten. Das ist sehr lange für eine Abfahrt, und am Schluss brennen die Beine.\n\nDie Strecke hat berühmte Stellen. Beim «Hundschopf» springen die Fahrer über einen Felsen. Auf dem «Haneggschuss» fahren sie schneller als 150 Kilometer pro Stunde. Ein kleiner Fehler kann gefährlich sein. Darum tragen alle einen Helm und einen Rückenschutz. Am Rand der Piste stehen hohe Netze.\n\nZum Rennen kommen jedes Jahr Zehntausende Zuschauer. Viele reisen mit der Zahnradbahn an, denn nach Wengen fahren keine Autos. Auf der Piste gibt es Musik, Fahnen und Kuhglocken. Für viele Schweizer ist das Lauberhorn-Wochenende ein grosses Fest.",
    wort: [["die Abfahrt","ein Skirennen, bei dem man schnell den Berg hinunterfährt"],["der Weltcup","eine Serie von Rennen auf der ganzen Welt"],["die Strecke","der Weg, den man fährt"],["die Piste","präparierter Weg im Schnee zum Skifahren"],["die Zahnradbahn","Bahn für steile Berge"]],

      { q: "Seit wann gibt es das Rennen?", o: ["Seit 1930","Seit 1990","Seit 2010"], a: 0 },
      { q: "Was ist besonders an der Lauberhorn-Abfahrt?", o: ["Sie ist die kürzeste im Weltcup","Sie ist die längste im Weltcup","Sie ist nur für Frauen"], a: 1 },
      { q: "Wie kommen viele Zuschauer nach Wengen?", o: ["Mit dem Auto","Mit der Zahnradbahn","Mit dem Schiff"], a: 1 }

    rf: [

  { id: "dl-schnupperlehre", r: "lberuf", typ: "text", texttitel: "Text", titel: "Die Schnupperlehre", kanal: "Ratgeber", dauer: "ca. 180 Wörter",
    kurz: "Bevor man eine Lehrstelle bekommt, geht man meistens schnuppern. Was passiert dort, und worauf kommt es an?",
    vor: "Warst du schon schnuppern? In welchem Beruf?",
    text: "Wer eine Lehrstelle sucht, kommt an der Schnupperlehre fast nicht vorbei. Beim Schnuppern arbeitet man einige Tage in einem Betrieb mit. Meistens dauert eine Schnupperlehre zwei bis fünf Tage.\n\nDie Schnupperlehre hat zwei Ziele. Erstens lernst du den Beruf kennen. Du siehst, wie ein normaler Arbeitstag aussieht. Du merkst, ob dir die Arbeit gefällt und ob du sie dir für drei oder vier Jahre vorstellen kannst. Zweitens lernt der Betrieb dich kennen. Viele Firmen vergeben ihre Lehrstellen nur an Jugendliche, die bei ihnen geschnuppert haben.\n\nWorauf achten die Betriebe? Pünktlichkeit ist sehr wichtig. Wer am ersten Tag zu spät kommt, macht keinen guten Eindruck. Auch Interesse zählt: Stell Fragen und hilf mit, wo du kannst. Das Handy bleibt während der Arbeit in der Tasche.\n\nAm Ende der Schnupperlehre gibt es oft ein Gespräch. Der Betrieb sagt dir, was gut war und was du verbessern kannst. Manchmal bekommst du einen Schnupperbericht. Den kannst du später deiner Bewerbung beilegen.\n\nTipp: Schreibe nach jedem Schnuppertag kurz auf, was du gemacht hast. So kannst du später verschiedene Berufe besser vergleichen.",
    wort: [["der Betrieb","eine Firma, ein Geschäft"],["vergeben","jemandem etwas geben, z. B. eine Lehrstelle"],["der Eindruck","was andere über dich denken, wenn sie dich sehen"],["der Schnupperbericht","schriftliche Beurteilung nach der Schnupperlehre"],["beilegen","zu etwas dazulegen, z. B. zu einem Brief"]],

      { q: "Was macht keinen guten Eindruck?", o: ["Fragen stellen","Mithelfen","Am ersten Tag zu spät kommen"], a: 2 },

    kurz: "Was gehört in eine Bewerbung für eine Lehrstelle? Eine Übersicht mit Tipps.",
    vor: "Was denkst du: Was will ein Betrieb über dich wissen, bevor er dich einlädt?",
    text: "Wer sich für eine Lehrstelle bewirbt, schickt dem Betrieb ein Bewerbungsdossier. Heute geschieht das meistens per E-Mail oder über ein Online-Formular. Das Dossier ist wie eine Visitenkarte: Der Betrieb sieht es, bevor er dich kennt.\n\nDas Wichtigste ist der Bewerbungsbrief, auch Motivationsschreiben genannt. Darin erklärst du, warum du diesen Beruf lernen möchtest und warum du gut in diesen Betrieb passt. Der Brief sollte nicht länger als eine Seite sein. Schreibe ihn für jede Firma neu und kopiere nicht einfach alles.\n\nDazu kommt der Lebenslauf. Er enthält deine Personalien, deine Schulen, deine Sprachen und deine Hobbys. Ein freundliches Foto gehört oben auf den Lebenslauf. Weiter legst du die Zeugnisse der Oberstufe bei. Viele Betriebe möchten auch das Resultat eines Tests sehen, zum Beispiel vom Multicheck oder vom Stellwerk. Falls du schon geschnuppert hast, gehören die Schnupperberichte ebenfalls dazu.\n\nBevor du die Bewerbung abschickst, lass sie von jemandem lesen. Fehler in der Rechtschreibung machen einen schlechten Eindruck. Und kontrolliere die Adresse: Der Name der Ansprechperson muss richtig geschrieben sein.",
    wort: [["sich bewerben","sich um eine Stelle bemühen"],["das Dossier","eine Sammlung von Dokumenten"],["der Lebenslauf","Übersicht über dein Leben: Schulen, Sprachen, Hobbys"],["die Personalien","Name, Adresse, Geburtsdatum usw."],["die Ansprechperson","die Person, an die man sich wendet"]],
    mc: [

      { q: "Was erklärst du im Bewerbungsbrief?", o: ["Warum du diesen Beruf lernen willst und in den Betrieb passt","Was deine Eltern arbeiten","Wie viel Lohn du willst"], a: 0 },
      { q: "Wie lang sollte der Bewerbungsbrief höchstens sein?", o: ["Eine Seite","Drei Seiten","Zehn Seiten"], a: 0 },
      { q: "Was gehört NICHT in das Dossier?", o: ["Die Zeugnisse","Der Lebenslauf","Die Zeugnisse deiner Geschwister"], a: 2 }

    rf: [

  { id: "dl-gespraech", r: "lberuf", typ: "text", texttitel: "Text", titel: "Artas Vorstellungsgespräch", kanal: "Geschichte", dauer: "ca. 180 Wörter",
    kurz: "Arta ist zu einem Vorstellungsgespräch in einer Apotheke eingeladen. Sie ist nervös, aber gut vorbereitet.",
    vor: "Wie würdest du dich auf ein Vorstellungsgespräch vorbereiten?",
    text: "Arta hat eine E-Mail bekommen: Die Apotheke im Dorf lädt sie zu einem Vorstellungsgespräch ein. Sie möchte Pharma-Assistentin werden. Arta freut sich, aber sie ist auch nervös.\n\nAm Abend vorher bereitet sie sich vor. Sie liest die Website der Apotheke noch einmal genau. Sie überlegt sich Antworten auf typische Fragen: «Warum möchtest du diesen Beruf lernen? Was sind deine Stärken? Was machst du in deiner Freizeit?» Ihre ältere Schwester spielt die Chefin und stellt ihr die Fragen. Arta übt, laut und deutlich zu antworten.\n\nAm nächsten Tag zieht sie saubere, ordentliche Kleider an. Sie ist zehn Minuten zu früh dort. Die Chefin, Frau Keller, begrüsst sie mit Handschlag. Arta schaut ihr in die Augen und lächelt.\n\nIm Gespräch erzählt Arta, dass sie gern mit Menschen zu tun hat und dass ihr Biologie gefällt. Sie erzählt auch, dass sie Albanisch, Deutsch und etwas Englisch spricht. Frau Keller nickt: «Das ist bei uns sehr nützlich. Viele Kundinnen sprechen Albanisch.»\n\nAm Schluss fragt Frau Keller: «Hast du noch Fragen?» Arta hat zwei Fragen vorbereitet. Eine Woche später kommt ein Anruf: Arta bekommt die Lehrstelle.",
    wort: [["das Vorstellungsgespräch","Gespräch, bei dem der Betrieb dich kennenlernt"],["nervös","unruhig, ein bisschen ängstlich"],["die Stärke","etwas, das man gut kann"],["der Handschlag","sich zur Begrüssung die Hand geben"],["nützlich","hilfreich, gut zu gebrauchen"]],
    mc: [
      { q: "Welchen Beruf möchte Arta lernen?", o: ["Fachfrau Gesundheit","Pharma-Assistentin","Detailhandelsfachfrau"], a: 1 },
      { q: "Wie übt Arta für das Gespräch?", o: ["Ihre Schwester stellt ihr die Fragen","Sie schaut einen Film","Sie übt gar nicht"], a: 0 },

      { q: "Warum findet Frau Keller Artas Sprachen nützlich?", o: ["Weil viele Kundinnen Albanisch sprechen","Weil die Apotheke in Albanien ist","Weil Arta Englisch unterrichten soll"], a: 0 }

      { q: "Welche Stärken hast du? Schreibe zwei Sätze, wie du sie in einem Vorstellungsgespräch nennen würdest.", l: "Individuelle Antwort, z. B.: «Ich bin pünktlich und zuverlässig.» «Ich arbeite gern im Team.»" }
    ] },

  { id: "dl-lohn", r: "lberuf", typ: "text", texttitel: "Text", titel: "Der erste Lohn", kanal: "Geschichte", dauer: "ca. 190 Wörter",
    kurz: "Dario bekommt seinen ersten Lehrlingslohn. Schnell merkt er: Das Geld ist schneller weg, als er dachte.",
    vor: "Was würdest du mit deinem ersten Lohn machen?",
    text: "Dario ist im ersten Lehrjahr als Logistiker. Ende August bekommt er zum ersten Mal einen Lohn. Auf seinem Konto sind jetzt 750 Franken. «So viel Geld!», denkt er.\n\nAm Wochenende geht er mit Kollegen in die Stadt. Er kauft neue Sneakers für 160 Franken und lädt alle zu Burgern ein. Am Sonntag bestellt er noch ein Game für 70 Franken. Zwei Wochen später ist fast nichts mehr übrig.\n\nDann kommt ein Brief: Das Handy-Abo kostet 45 Franken pro Monat. Und Darios Mutter sagt: «Ab jetzt bezahlst du dein Zugbillett selbst und gibst 100 Franken für das Essen zu Hause.» Dario erschrickt. Wie soll das gehen?\n\nSein Berufsbildner gibt ihm einen Tipp: «Mach ein Budget.» Dario setzt sich hin und schreibt alles auf: Was kommt herein? Was muss er jeden Monat bezahlen? Was bleibt für die Freizeit? Er merkt: Wenn er jeden Monat 50 Franken spart, hat er nach einem Jahr 600 Franken.\n\nIm nächsten Monat macht Dario es anders. Am Zahltag überweist er zuerst die festen Kosten und das Sparen. Erst dann gibt er Geld für Ausgang und Kleider aus. «Jetzt habe ich am Ende des Monats noch Geld», sagt er stolz.",
    wort: [["der Lohn","Geld, das man für die Arbeit bekommt"],["das Konto","Ort bei der Bank, wo dein Geld liegt"],["das Budget","Plan: wie viel Geld kommt herein, wie viel geht hinaus"],["die festen Kosten","Kosten, die jeden Monat gleich sind"],["überweisen","Geld von einem Konto auf ein anderes schicken"]],
    mc: [
      { q: "Welche Lehre macht Dario?", o: ["Logistiker","Koch","Maler"], a: 0 },
      { q: "Was kauft Dario am ersten Wochenende?", o: ["Ein Velo","Neue Sneakers","Ein Handy"], a: 1 },
      { q: "Was muss Dario ab jetzt seiner Mutter geben?", o: ["100 Franken für das Essen","Seinen ganzen Lohn","Nichts"], a: 0 },
      { q: "Wer gibt Dario den Tipp mit dem Budget?", o: ["Seine Mutter","Ein Kollege","Sein Berufsbildner"], a: 2 }
    ],
    rf: [
      { s: "Nach zwei Wochen hat Dario fast kein Geld mehr.", a: true },
      { s: "Das Handy-Abo kostet 45 Franken pro Jahr.", a: false, x: "Es kostet 45 Franken pro Monat." },
      { s: "Im nächsten Monat bezahlt Dario zuerst die festen Kosten und das Sparen.", a: true }
    ],

      { q: "Welche festen Kosten hat Dario? Nenne zwei.", l: "Handy-Abo, Zugbillett, Geld für das Essen zu Hause." }
    ] },

  { id: "dl-bm", r: "lberuf", typ: "text", texttitel: "Text", titel: "Lehre und dann? Die Berufsmaturität", kanal: "Sachtext", dauer: "ca. 160 Wörter",
    kurz: "Nach der Lehre ist nicht Schluss. In der Schweiz gibt es viele Wege, weiterzulernen.",
    vor: "Was möchtest du in zehn Jahren machen?",
    text: "Viele Jugendliche denken: Wer eine Lehre macht, kann später nicht studieren. Das stimmt nicht. Das Schweizer Bildungssystem ist durchlässig. Das heisst: Man kann von einem Weg auf einen anderen wechseln.\n\nEin wichtiger Weg ist die Berufsmaturität, kurz BM. Die BM ist eine zusätzliche Schule mit allgemeinen Fächern wie Deutsch, Mathematik und Englisch. Es gibt zwei Möglichkeiten. Man kann die BM während der Lehre machen. Dann geht man mehr Tage pro Woche zur Schule. Oder man macht die BM nach der Lehre, zum Beispiel ein Jahr lang Vollzeit.\n\nMit der Berufsmaturität kann man an einer Fachhochschule studieren. Ein Logistiker kann zum Beispiel später Betriebsökonomie studieren, eine Fachfrau Gesundheit kann Pflegefachfrau werden.\n\nAber auch ohne BM gibt es viele Möglichkeiten. Nach ein paar Jahren Berufserfahrung kann man eine Weiterbildung machen. Man kann eine Berufsprüfung ablegen oder eine Höhere Fachschule besuchen. Viele Chefs und Chefinnen in der Schweiz haben einmal mit einer Lehre angefangen.\n\nDarum sagen Fachleute: «Kein Abschluss ohne Anschluss.» Jeder Abschluss öffnet eine neue Tür.",
    wort: [["durchlässig","so, dass man durchgehen oder wechseln kann"],["zusätzlich","dazu, extra"],["die Fachhochschule","eine Hochschule mit praktischen Studiengängen"],["die Weiterbildung","weiterlernen, nachdem man schon einen Beruf hat"],["der Abschluss","das Ende einer Ausbildung mit Diplom"]],
    mc: [
      { q: "Was bedeutet «durchlässig» im Text?", o: ["Man kann von einem Weg auf einen anderen wechseln","Die Schule ist kaputt","Man muss nie lernen"], a: 0 },
      { q: "Was kann man mit der Berufsmaturität machen?", o: ["An einer Fachhochschule studieren","Sofort Arzt werden","Nichts Besonderes"], a: 0 },
      { q: "Wann kann man die BM machen?", o: ["Nur vor der Lehre","Während oder nach der Lehre","Nur mit 40 Jahren"], a: 1 },
      { q: "Was bedeutet «Kein Abschluss ohne Anschluss»?", o: ["Nach jedem Abschluss gibt es eine Möglichkeit, weiterzumachen","Man braucht einen Internetanschluss","Ohne Abschluss bekommt man keinen Job"], a: 0 }
    ],
    rf: [
      { s: "Wer eine Lehre macht, kann nie studieren.", a: false, x: "Das stimmt nicht. Mit der BM kann man an einer Fachhochschule studieren." },
      { s: "In der BM hat man allgemeine Fächer wie Deutsch und Mathematik.", a: true },
      { s: "Auch ohne BM kann man sich weiterbilden.", a: true }

    offen: [
      { q: "Erkläre in eigenen Worten, was die Berufsmaturität ist.", l: "Eine zusätzliche Schule mit allgemeinen Fächern, während oder nach der Lehre. Mit ihr kann man an einer Fachhochschule studieren." },
      { q: "Würdest du gerne eine BM machen? Begründe in ein bis zwei Sätzen.", l: "Individuelle Antwort mit Begründung." }
    ] },
