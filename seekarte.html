["l",1,"#9a6b1f","Seidenstrasse","Handelsweg zwischen Asien und Europa. Seide, Gewürze und Edelsteine kamen auf dem Landweg nach Europa. Das dauerte lange, zudem lauerten Diebe. Schon die Griechen berichteten um 400 vor Christus davon, auch die Römer nutzten ihn.",[[109,34],[95,40],[80,40],[67,39.5],[52,36],[44,37],[36,36]],"d"],

["l",3,"#7a3fb0","47. Längengrad (Tordesillas)","Der Papst teilte die Welt am 47. Längengrad zwischen Spanien und Portugal auf. Westlich gehört zu Spanien, östlich zu Portugal. Darum spricht man in Brasilien Portugiesisch.",[[-47,82],[-47,10],[-47,-58]],"dt"],

["a",4,FR,"Aztekenreich","Die Azteken lebten im heutigen Mexiko. Ihre Hauptstadt Tenochtitlan gehörte zu den grössten Städten der Welt. Menschenopfer für den Sonnengott gehörten zum gesellschaftlichen Leben. Cortés nutzte den Streit zwischen den Stämmen aus.",[[-104,22],[-96,22],[-94,17],[-100,15],[-104,18]],""],

["l",5,BR,"Francisco Pizarro","1532 landeten die Spanier unter Pizarro an der Küste Perus. Die Inkaherrschaft erlosch 1572 (Route schematisch).",[[-79.5,9],[-81,-4],[-72,-13.5]],"a"],
